<html lang="en">
<head>

<title>Karate Handbook — Build Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0c;--surface:#131316;--border:#1e1e24;--border-active:#2a2a32;
  --text:#f0eeeb;--text2:#c0bfbb;--muted:#b0aead;--dim:#666;--ghost:#555;--subtle:#44444d;--faint:#3a3a42;--floor:#33333b;
  --red:#ff6b6b;--orange:#f4a261;--teal:#2a9d8f;--blue:#457b9d;--purple:#9b5de5;--gold:#e9c46a;
  --mono:'Space Mono',monospace;--sans:'DM Sans',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.top-bar{position:sticky;top:0;z-index:100;background:#0e0e10ee;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0.8rem 1rem;display:flex;align-items:center;gap:0.6rem}
.top-bar h1{font-family:var(--mono);font-size:0.78rem;font-weight:700;letter-spacing:0.06em;color:var(--red)}
.container{max-width:700px;margin:0 auto;padding:0 1rem 3rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0.5rem;margin:1rem 0}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.8rem;text-align:center}
.stat-num{font-family:var(--mono);font-size:1.5rem;font-weight:700}
.stat-label{font-size:0.72rem;color:var(--dim);font-family:var(--mono);margin-top:0.15rem}
.progress-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;height:8px;margin:0.8rem 0 1.2rem;overflow:hidden}
.progress-fill{height:100%;border-radius:8px;transition:width 0.4s ease}
.phase{margin-bottom:0.6rem}
.phase-header{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.8rem 1rem;cursor:pointer;display:flex;align-items:center;gap:0.6rem;transition:border-color 0.2s}
.phase-header:hover{border-color:var(--border-active)}
.phase-header.done{opacity:0.6}
.phase-icon{font-size:1.2rem;flex-shrink:0}
.phase-info{flex:1;min-width:0}
.phase-name{font-weight:700;font-size:0.95rem}
.phase-desc{font-size:0.78rem;color:var(--dim);margin-top:0.1rem}
.phase-badge{font-family:var(--mono);font-size:0.65rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:6px;flex-shrink:0}
.badge-done{background:#2a9d8f22;color:var(--teal)}
.badge-active{background:#ff6b6b22;color:var(--red)}
.badge-todo{background:#44444d22;color:var(--ghost)}
.phase-chevron{color:var(--ghost);font-size:0.9rem;transition:transform 0.2s;flex-shrink:0}
.phase-chevron.open{transform:rotate(90deg)}
.prompts{overflow:hidden;max-height:0;transition:max-height 0.35s ease}
.prompts.open{max-height:5000px}
.prompt{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin:0.4rem 0.3rem;overflow:hidden}
.prompt-header{display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;cursor:pointer}
.prompt-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all 0.2s}
.prompt-check.checked{background:var(--teal);border-color:var(--teal)}
.prompt-check.checked::after{content:'✓';color:var(--bg);font-size:0.7rem;font-weight:700}
.prompt-title{flex:1;font-size:0.85rem;font-weight:500;color:var(--text2)}
.prompt-title.checked{text-decoration:line-through;color:var(--ghost)}
.prompt-expand{color:var(--ghost);font-size:0.75rem;font-family:var(--mono);cursor:pointer;padding:0.2rem 0.4rem;border-radius:4px;border:1px solid var(--border);background:transparent;transition:all 0.2s}
.prompt-expand:hover{border-color:var(--border-active);color:var(--muted)}
.prompt-body{display:none;padding:0 0.8rem 0.8rem}
.prompt-body.open{display:block}
.prompt-text{background:#111114;border:1px solid var(--border);border-radius:8px;padding:0.8rem;font-family:var(--mono);font-size:0.72rem;line-height:1.7;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:400px;overflow-y:auto}
.copy-btn{display:inline-flex;align-items:center;gap:0.3rem;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:0.4rem 0.7rem;color:var(--red);font-family:var(--mono);font-size:0.7rem;font-weight:700;cursor:pointer;margin-top:0.5rem;transition:all 0.2s}
.copy-btn:hover{background:var(--border);color:var(--text)}
.copy-btn.copied{color:var(--teal);border-color:var(--teal)}
.version-note{text-align:center;margin-top:0.5rem;font-family:var(--mono);font-size:0.68rem;color:var(--floor)}
.section-label{font-family:var(--mono);font-size:0.7rem;color:var(--red);font-weight:700;letter-spacing:0.05em;margin:1.2rem 0 0.5rem;display:flex;align-items:center;gap:0.5rem}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>

// State
let state = JSON.parse(localStorage.getItem('karate-tracker') || '{}');

function saveState() {
  localStorage.setItem('karate-tracker', JSON.stringify(state));
}

function isPromptDone(id) {
  if (state[id] !== undefined) return state[id];
  const phase = PHASES.find(p => p.prompts.some(pr => pr.id === id));
  const prompt = phase?.prompts.find(pr => pr.id === id);
  return prompt?.done || false;
}

function togglePrompt(id) {
  state[id] = !isPromptDone(id);
  saveState();
  render();
}

function getStats() {
  let total = 0, done = 0;
  PHASES.forEach(p => p.prompts.forEach(pr => {
    total++;
    if (isPromptDone(pr.id)) done++;
  }));
  const lastDone = [...PHASES].reverse().find(p => p.prompts.every(pr => isPromptDone(pr.id)));
  const version = lastDone ? lastDone.version : 'v12';
  return { total, done, remaining: total - done, version };
}

function getPhaseStatus(phase) {
  const allDone = phase.prompts.every(pr => isPromptDone(pr.id));
  const anyDone = phase.prompts.some(pr => isPromptDone(pr.id));
  if (allDone) return 'done';
  if (anyDone) return 'active';
  // Check if previous phase is done
  const idx = PHASES.indexOf(phase);
  if (idx > 0) {
    const prev = PHASES[idx - 1];
    if (prev.prompts.every(pr => isPromptDone(pr.id))) return 'active';
  }
  return 'todo';
}

let openPhase = null;
let openPrompts = {};

function copyText(text, btnEl) {
  navigator.clipboard.writeText(text).then(() => {
    btnEl.classList.add('copied');
    btnEl.textContent = '✓ COPIED';
    setTimeout(() => {
      btnEl.classList.remove('copied');
      btnEl.textContent = '📋 COPY PROMPT';
    }, 2000);
  });
}

function render() {
  const stats = getStats();
  document.getElementById('done-count').textContent = stats.done;
  document.getElementById('remaining-count').textContent = stats.remaining;
  document.getElementById('version-count').textContent = stats.version;
  document.getElementById('progress-fill').style.width = (stats.total ? (stats.done / stats.total * 100) : 0) + '%';

  const container = document.getElementById('phases-container');
  let html = '';
  let lastSection = '';

  PHASES.forEach((phase, pi) => {
    const status = getPhaseStatus(phase);
    const section = phase.id.charAt(0);
    const sectionLabels = { '0': 'ARCHITECTURE', '1': 'CORE REFERENCE', '2': 'KUMITE FORMS', '3': 'ADVANCED & WEAPONS', '4': 'IDENTITY & KNOWLEDGE', '5': 'POLISH' };
    if (section !== lastSection) {
      html += `<div class="section-label">${sectionLabels[section] || ''}</div>`;
      lastSection = section;
    }

    const isOpen = openPhase === phase.id;
    const badgeClass = status === 'done' ? 'badge-done' : status === 'active' ? 'badge-active' : 'badge-todo';
    const badgeText = status === 'done' ? '✓ DONE' : status === 'active' ? 'ACTIVE' : 'TODO';
    const borderColor = status === 'done' ? 'var(--teal)' : status === 'active' ? 'var(--red)' : 'var(--border)';

    html += `<div class="phase">`;
    html += `<div class="phase-header ${status === 'done' ? 'done' : ''}" onclick="openPhase=openPhase==='${phase.id}'?null:'${phase.id}';render()" style="border-left:4px solid ${borderColor}">`;
    html += `<div class="phase-info"><div class="phase-name">${phase.name}</div><div class="phase-desc">${phase.desc}</div></div>`;
    html += `<span class="phase-badge ${badgeClass}">${badgeText}</span>`;
    html += `<span class="phase-chevron ${isOpen ? 'open' : ''}">›</span>`;
    html += `</div>`;
    html += `<div class="prompts ${isOpen ? 'open' : ''}">`;

    phase.prompts.forEach(pr => {
      const done = isPromptDone(pr.id);
      const bodyOpen = openPrompts[pr.id];
      html += `<div class="prompt">`;
      html += `<div class="prompt-header">`;
      html += `<div class="prompt-check ${done ? 'checked' : ''}" onclick="event.stopPropagation();togglePrompt('${pr.id}')"></div>`;
      html += `<span class="prompt-title ${done ? 'checked' : ''}">${pr.title}</span>`;
      html += `<button class="prompt-expand" onclick="event.stopPropagation();openPrompts['${pr.id}']=!openPrompts['${pr.id}'];render()">SHOW</button>`;
      html += `</div>`;
      html += `<div class="prompt-body ${bodyOpen ? 'open' : ''}">`;
      html += `<div class="prompt-text">${pr.text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
      html += `<button class="copy-btn" onclick="copyText(this.parentElement.querySelector('.prompt-text').textContent,this)">📋 COPY PROMPT</button>`;
      html += `</div></div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

render();
</script>
