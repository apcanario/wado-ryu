ign a number to each cone for a cognitive load.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Bear Position — Alternating Tennis-Ball Catch", "desc": "Alternating-hand ball catching from the bear hold; combines reaction, grip and contralateral coordination.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Ball Control — Manual and Foot Dexterity", "desc": "Manipulating a ball with hands and feet. Variations: touch freely; limit the number of touches; keep the ball within a set area.", "chapter": "Coordination", "group": "Precision Movements in Context — \"Level of Space\""}, {"name": "Diagonal Single-Leg Jump", "desc": "Hopping diagonally on one leg between targets — develops single-leg control and spatial accuracy.", "chapter": "Coordination", "group": "Precision Movements in Context — \"Level of Space\""}, {"name": "Motor-Challenge Circuit (Youth, July 2021)", "desc": "A recorded session: moving through an agility ladder while simultaneously controlling a ball — dual-task coordination.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Team Coordination — Basic Exercises", "desc": "Partner/group sequences such as jump forward + jump back + roll + plank, and rolling right then left — coordination under a shared rhythm.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Crawl and Move a Medicine Ball", "desc": "Quadrupedal crawling while displacing a medicine ball; cross-body coordination with an added load.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Animal Locomotion — Compilation", "desc": "A compiled set of animal-pattern movements (bear, crab, etc.) used as a locomotion vocabulary.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Crawl Between Cones", "desc": "Quadrupedal crawling weaving through ": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Open and Close", "desc": "Basic open-close jump pattern in and around the hoop.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Front and Back, Feet Together", "desc": "Feet-together jumps cycling centre / front / back of the hoop.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Front and Back, Opening at Centre", "desc": "Front-back travel with an open-stance landing at the hoop centre.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Hopping, Jump to the Side", "desc": "Single-leg hopping with lateral jumps relative to the hoop.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Feet Together, Jump to the Side", "desc": "Two-footed lateral jumping around the hoop.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Open, Close, Back", "desc": "A four-beat hoop footwork pattern combining stance changes with travel.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Shoulder Press — Perception and Action (Partners)", "desc": "Multidirectional shoulder press where direction is dictated reactively by a partner. Strength expressed under a decision-making demand — bridging gym work and sport-specific reactive ability.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Form a Shape Quickly Between Two Cones", "desc": "Reactive task: rapidly assemble a body shape or pattern in the space between two cones.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Medicine-Ball Squat — Motor Control", "desc": "A squat holding/moving a medicine ball, emphasising controlled movement quality over load.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Catch a Moving Object — Perception and Action (Partners)", "desc": "Intercepting and catching a moving object fed by a ol — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Scap Pull-Up — Stretch", "desc": "Hanging scapular pull-ups — scapular control and a decompressive stretch.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulder Press — Kettlebell", "desc": "An overhead press with a kettlebell — shoulder strength with a stability demand.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulder External/Internal Rotation — Kettlebell", "desc": "Kettlebell rotation work for shoulder stability; also paired with foam-roller stretching.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Ankle — Split-Stance Mobility (3 planes)", "desc": "Split-stance ankle mobility drills using the foot or knee as the driver, worked through the sagittal, frontal and transverse planes.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Foot & Ankle"}], "Programmes & Assessment": [{"name": "Lower-Body Power Test", "desc": "A jump-based assessment (e.g. countermovement or horizontal jump) used to quantify lower-limb power.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Cardiovascular Endurance Test", "desc": "A field test of aerobic capacity.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Push-Up Test (FitEscola)", "desc": "Standardised push-up test from the Portuguese FitEscola battery — upper-body muscular endurance.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Core Endurance Test", "desc": "A timed trunk-endurance assessment (plank-type hold).", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "WOD — \"Don't Run Loredo\" (6 rounds for time)", "desc": "A timed CrossFit-style benchmark workout, six rounds for time.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Bunny Jump + V-Up", "desc": "A bunny jump paired with a V-up — explosive plus core.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Open WOD 14.5 — Thrusters + Burpees", "desc": "The CrossFit Open 14.5 workout: descending thrusters and bar-facing burpees.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Band Ripper 1–4 (Frank Medrano)", "desc": "A four-part banded ab series from athlete Frank Medrano.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Plank — Medicine Ball, Forearm", "desc": "Forearm plank with a medicine ball under an arm — added instability.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Crunch and Push-Up — Plank, Medicine Ball", "desc": "Combined crunch/push-up plank work over a medicine ball.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Plank — Hand Switch on Medicine Ball", "desc": "Switching a hand on and off a medicine ball from the plank — anti-rotation.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Bicycle Crunch holding Medicine Ball", "desc": "The bicycle crunch loaded with a medicine ball.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Medicine-Ball Plank Hand Switch", "desc": "Plank hand-switching across a medicine ball.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Ball Bounces", "desc": "Rapid medicine-ball bouncing — reactive upper-body/core conditioning.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Russian Ball Release", "desc": "A Russian-twist action releasing/catching the ball — rotational core.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Post-Activation Potentiation", "desc": "A webinar on PAP — using a heavy or explosive \"conditioning\" effort to acutely boost subsequent power output.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Rating of Perceived Exertion (RPE)", "desc": "A webinar on collecting and using session-RPE to monitor training load.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Training Load vs Injury Risk", "desc": "A webinar on the relationship between training load and injury risk.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Why Control Training Load", "desc": "A webinar on the rationale for monitoring and managing training load.", "chapter": "Courses / Webinars", "group": "Rules"}], "Strength & Power": [{"name": "Strength — Lower Body A (recorded session)", "desc": "A recorded example of a lower-body strength session used as a programming template.", "chapter": "Strength & Power", "group": "Strength — Sample Session"}, {"name": "Clean Pull", "desc": "The pulling phase of the power clean — barbell accelerated from floor with explosive triple extension of ankles, knees, and hips, without the catch. Safe, high-value rate-of-force-development training. Directly develops the hip-drive mechanics powering punches and kicks.", "chapter": "Strength & Power", "group": "Olympic Derivatives"}, {"name": "Push Press", "desc": "Barbell at front-rack. Short dip-and-drive of the legs, then press overhead. Leg drive initiates the press, allowing heavier loads than strict press. Trains whole-body power transfer — the same kinetic chain used in gyaku-tsuki.", "chapter": "Strength & Power", "group": "Olympic Derivatives"}, {"name": "Bear to Plank — Crawl Out", "desc": "From the bear hold, walking the hands forward into a plank and back. Anti-extension core control through a moving base.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Dead Bug — Two Legs", "desc": "Lie supine with arms toward ceiling and knees at 90°. Simultaneously lower opposite arm overhead and opposite leg toward floor while pressing lower back into the ground. The foundational anti-extension core exercise — teaches deep stabilizers to prevent lumbar arching under load.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Sit-Through to Plank", "desc": "Rotational sit-through transitions into and out of the plank — dynamic core control with rotation.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Trunk Rotation — Core", "desc": "Controlled rotation drill training the core's ability to produce and control trunk rotation.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Rotational Core Stability Exercises #1 & #4", "desc": "Two anti-rotation drills from coach Adonis Harrison — the core resists a rotational force to keep the trunk square.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Glute Bridge in Extension", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Glute Bridge with Isometric Adduction", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Wall Sit", "desc": "Back against wall, thighs parallel to floor, knees at 90°. Isometric quadriceps endurance and tendon stiffness. Commonly used for leg conditioning.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Isometric Calf Hold", "desc": "A sustained calf-raise hold — isometric plantar-flexor and Achilles stiffness work.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Single-Leg Wall Sit (Max Voluntary Contraction)", "desc": "A one-legged wall sit performed as a maximal isometric effort.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Isometric Abduction Holds", "desc": "Isometric hip-abductor holds — lateral hip and glute-medius strength.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Single-Leg Squat", "desc": "Full squat on one leg, free leg held forward. Demands knee-dominant single-leg strength, balance, hip stability, and ankle mobility. Benchmark for single-leg function.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Reverse Nordics", "desc": "Kneel with straight hip line, lean backward slowly. Quads and hip flexors eccentrically control the descent. Strengthens and stretches the anterior chain — valuable for athletes needing quad strength for stances and hip-flexor range for high kicks.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Deep Squat", "desc": "Full-depth squat, hip crease below knee. Builds strength through complete ROM and develops hip/knee/ankle mobility needed for deep stances like shiko dachi.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Quarter Squat", "desc": "Partial-range squat (roughly 40° knee bend). Allows supramaximal loading to train stiffness in the joint angle range used during sprinting, jumping, and explosive stance work.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Back Squat", "desc": "Barbell on upper back, squat to at least parallel. Foundational bilateral lower-body strength: quads, glutes, adductors, posterior chain. The base for building leg strength supporting all karate techniques.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Front Squat", "desc": "Barbell front-racked, squat to full depth with upright torso. More quad-dominant than back squat, demands greater trunk rigidity. Builds upright squatting strength for deep karate stances.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Dynamic Lunge — Unilateral", "desc": "Repeated dynamic lunges on one leg — single-leg strength and control under a split stance.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Bulgarian Split Squat — Lengthened", "desc": "Stand facing away from a bench with one foot resting on it behind you, laces down. Lower your body by bending the front knee until the thigh is parallel to the floor, keeping the torso upright. The rear-foot elevation increases range of motion and single-leg demand. Targets quads, glutes, and hip flexors. A staple single-leg builder directly applicable to karate's split-stance demands.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Bulgarian Split Squat", "desc": "Stand facing away from a bench with one foot resting on it behind you, laces down. Lower your body by bending the front knee until the thigh is parallel to the floor, keeping the torso upright. The rear-foot elevation increases range of motion and single-leg demand. Targets quads, glutes, and hip flexors. A staple single-leg builder directly applicable to karate's split-stance demands.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Split-Squat Jump", "desc": "An explosive jump from the split-squat position, switching or holding the stance — lower-body power in a lunge pattern.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Supine Medicine-Ball Throw", "desc": "Lying on the back, throwing a medicine ball explosively — upper-body power with the trunk supported.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Reactive Push-Ups (with countermovement)", "desc": "Push-ups using a fast countermovement (dip then explode) — trains upper-body stretch-shortening-cycle power.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Clap/Jump Push-Ups (no countermovement)", "desc": "Explosive push-ups from a dead stop, the hands leaving the floor — concentric upper-body power.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Elbow Extensions — Triceps Push-Ups", "desc": "Push-up-style elbow extensions targeting the triceps.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Medicine-Ball Arm Press — Hip Focus", "desc": "A medicine-ball press driven from the hips — teaches power transfer from the lower body to the arms.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Landmine Press with Hip Rotation", "desc": "Press a barbell anchored in a landmine while rotating hips — as if throwing a punch. The rotational press directly mimics gyaku-tsuki kinetic chain: ground force → hip rotation → core transfer → arm extension.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Parallel Rotational Continuous Med-Ball Throw", "desc": "Continuous rotational medicine-ball throws against a wall, standing parallel to it — repeated rotational power.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Perpendicular Rotational Continuous Med-Ball Throw", "desc": "The same continuous rotational throw standing perpendicular to the wall.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Landmine Press + Leg Movement", "desc": "Landmine press combined with footwork — integrating press power with lower-body movement.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Unilateral Push-Up", "desc": "A push-up loaded mainly through one arm — a progression toward the one-arm push-up.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Push-Ups (wide / medium / narrow)", "desc": "Push-ups across three hand widths to shift emphasis between chest and triceps.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Barbell Row (technique reference)", "desc": "An external Athlean-X reference clip on barbell row technique and common mistakes — horizontal pulling for the back.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Row with Isometric Shoulder Abduction", "desc": "A row performed while holding an isometric shoulder-abduction position — mid-back and rotator-cuff integration.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Towel Row", "desc": "An inverted/bodyweight row using a towel as the grip — back strength plus grip.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Towel Lat Pulldown", "desc": "A lat-pulldown action improvised with a towel — vertical pulling for the lats.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Penguin March", "desc": "March on balls of feet with straight legs and locked ankles. Builds ankle and Achilles tendon stiffness — the foundation of elastic rebound during explosive footwork.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "AirTrack Pogos", "desc": "Short stiff pogo hops on an air-track, keeping legs nearly straight and ankles rigid. The compliant surface amplifies ankle stiffness demand. Trains spring-like ground contacts for explosive kumite footwork.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Leg Raise + Lunge — Ankle", "desc": "A leg-raise into a lunge emphasising ankle control.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Jump in Lunge", "desc": "An explosive jump from and to a lunge position.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Acceleration Wall Position Holds + Heel Raise", "desc": "Holding the forward-lean acceleration position against a wall, adding heel raises — sprint posture plus calf strength.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Leg Curl (Bilateral & Unilateral) on the Rower", "desc": "Improvised hamstring leg-curls using a rowing machine — knee-flexor strength.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Single-Leg Deadlift with Kettlebell", "desc": "Stand on one leg, kettlebell in opposite hand. Hip hinge lowering the bell while free leg extends behind. Posterior-chain strength, single-leg balance, and hip control — essential for kicking stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Deadlift with Accommodating Resistance", "desc": "Deadlift with bands or chains so resistance rises through the range. Trains force production where leverage is strongest — teaching athletes to accelerate through the entire lift rather than decelerating at the top.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Assisted Nordic Hamstring Curl", "desc": "Kneel with ankles anchored. Slowly lower toward the floor using only hamstrings to control the eccentric descent. Use hands or band for assistance. One of the most evidence-backed exercises for hamstring injury prevention through eccentric knee-flexor strength.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Sliding Nordic — Hamstrings", "desc": "A sliding variation where the athlete extends forward on sliders in a controlled eccentric hamstring contraction, then curls back. Reduced demand versus standard Nordic while still training the critical eccentric pattern.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Copenhagen Adduction", "desc": "From a side-plank, top leg on a bench. Lift the body by squeezing the top leg's adductors, holding the bottom leg off the ground. The key research-backed exercise for groin injury prevention. Essential for athletes performing lateral movements and kicks.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Dead Bug", "desc": "Lie supine with arms toward ceiling and knees at 90°. Simultaneously lower opposite arm overhead and opposite leg toward floor while pressing lower back into the ground. The foundational anti-extension core exercise — teaches deep stabilizers to prevent lumbar arching under load.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Banded Glute Bridge", "desc": "Glute bridge with band around knees adding abduction demand. Recruits gluteus medius alongside maximus, training both hip extension and lateral hip stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Adductor Squeeze", "desc": "Ball or block between knees, squeeze isometrically. Simple adductor activation and strength — important for groin health and wide-stance stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Kettlebell Snatch", "desc": "One explosive movement: kettlebell from between the legs to locked overhead. Demands full-body coordination, hip power, shoulder stability, and grip. One of the most conditioning-dense single exercises available.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Swing (1 & 2)", "desc": "Hike the bell between the legs with a hip hinge, then snap hips forward to swing it to chest height. Arms stay straight — power comes entirely from the hip drive. The foundational ballistic posterior-chain exercise. The hip-snap pattern directly parallels gyaku-tsuki and mawashi-geri mechanics.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Goblet Squat with Kettlebell", "desc": "Hold kettlebell by the horns at chest height. Squat deep with upright torso, driving knees out. The front-loaded position naturally promotes uprightness, making it an excellent squat teaching tool while building hip mobility and core strength.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Around-the-World with Stall", "desc": "Passing the bell around the body with a brief hold — grip, coordination and core.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Single-Leg Kettlebell Deadlift", "desc": "A one-legged hip hinge with a kettlebell — posterior-chain strength and balance.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Goblet Reverse Lunge", "desc": "A backward lunge holding the bell in the goblet position — single-leg strength with an anterior load.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Banded Glute Bridge", "desc": "Glute bridge with band around knees adding abduction demand. Recruits gluteus medius alongside maximus, training both hip extension and lateral hip stability.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Jump Squats", "desc": "Jump squats against band resistance — resisted lower-body power.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Pistol Squat", "desc": "Band-assisted single-leg pistol squat. Free leg extends forward while squatting to full depth. Band reduces bodyweight demand while training extreme single-leg strength, ankle mobility, and balance.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Sprints", "desc": "Sprint against band resistance anchored behind. Overloads the horizontal force production phase — forward lean, aggressive ground strike, and hip drive — under resistance.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Biceps Curls (Overhead, Seated, Lateral, Concentration)", "desc": "A set of band biceps curls from varied angles — arm strength.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Arms & Legs Open-Close — Band", "desc": "Banded open-close action for the limbs — abduction strength.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Single-Leg Leg Press — Band", "desc": "A band-resisted single-leg press.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Calf Raises — Band", "desc": "Standing calf raises performed against band resistance wrapped under the foot. Trains plantar flexor strength and Achilles tendon stiffness — the elastic spring system that powers all explosive footwork.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Single-Leg Deadlift — Band", "desc": "A band-resisted single-leg hip hinge.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "18 Advanced Resistance-Band Exercises", "desc": "A compiled reference set of advanced band exercises.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Band Training for Strength and Power", "desc": "A reference clip on programming bands for strength and power.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "TRX Lunge with Knee Drive", "desc": "A suspended-foot lunge finished with a knee drive — single-leg strength and balance.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Mountain Climbers", "desc": "Mountain climbers with the feet in the TRX — high core demand.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Mixed Row", "desc": "A TRX row with a mixed pulling angle — back strength.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Push-Up + Crunch", "desc": "A suspended push-up combined with a knee-tuck crunch.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Low-Back Extension", "desc": "A TRX exercise for the lumbar extensors.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Gyaku Leg Drive (Kumite)", "desc": "A karate-specific TRX drill training the lead-leg drive of the reverse punch.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Pistol Squat", "desc": "A TRX-assisted single-leg pistol squat.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX \"T\" and \"Y\"", "desc": "TRX raises tracing T and Y shapes — mid-back and scapular strength.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX One-Arm Pull + Twist", "desc": "A single-arm TRX row with a trunk rotation — pulling strength plus rotation.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Squat", "desc": "A TRX-supported squat — squat pattern with assistance.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}], "Speed, Agility & Plyometrics": [{"name": "Wall Drive", "desc": "Lean against wall at 45° in sprint acceleration position. Drive raised knee down and foot into ground forcefully, then switch. Teaches front-side sprint mechanics and aggressive ground strike — the same explosive leg action powering slide entries in kumite.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Wall Switches", "desc": "Rapid alternation of the drive legs against the wall — sprint leg-switch timing and rhythm.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Load & Lift & Switch", "desc": "A wall-drill sequence: load the stance leg, lift the drive knee, then switch — sequencing the acceleration stride.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Wall Drive — Progressions", "desc": "Lean against wall at 45° in sprint acceleration position. Drive raised knee down and foot into ground forcefully, then switch. Teaches front-side sprint mechanics and aggressive ground strike — the same explosive leg action powering slide entries in kumite.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "A-Series & Switches", "desc": "The classic sprint drill progression: A-march (slow exaggerated knee lifts), A-skip (adding a hop), A-run (full tempo), plus rapid leg switches. Builds coordination, posture, and running stride mechanics. Essential warm-up for speed work.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Moving"}, {"name": "Lateral Shuffle — Progressions (PEAK)", "desc": "A graded progression of lateral shuffling drills — starting with simple side slides, progressing to rapid direction changes, crossover steps, and reactive cues. The foundation of side-to-side agility used in kumite ring movement.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle — Continuous Progression (+ Dynamic)", "desc": "Continuous lateral shuffling with a dynamic finish.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Ski Jumps (COD)", "desc": "Side-to-side jumps mimicking a skier's motion. Develops lateral elasticity and braking strength through the outside leg — the same mechanics used in lateral cutting and direction changes in kumite.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle with Hurdle Jump (COD)", "desc": "Lateral movement combined with a hurdle jump — shuffle plus reactive jump.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle — Medicine Ball", "desc": "Lateral shuffling while holding/moving a medicine ball for added load (a three-part #1–#3 series).", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Improve Multidirectional Movement (1 & 2)", "desc": "Two drills targeting general multidirectional movement quality.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Lunge with Cable", "desc": "A lateral lunge loaded by a cable — resisted side-lunge strength for cutting.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Change of Direction with Added Load", "desc": "Cutting drills performed with extra resistance — strengthens the braking and re-acceleration steps.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Dynamic Lunge", "desc": "Continuous dynamic lunging used as a COD strength primer.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Single-Leg Hop + COD (Plyometric #2)", "desc": "A sideways single-leg hop feeding into a change of direction — reactive single-leg cutting.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Multilateral Movement in Pairs", "desc": "Partner-mirrored multidirectional movement — reactive agility against a live stimulus.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Forward-Back with Reaction", "desc": "Forward and backward movement triggered by a reactive cue.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Backpedal + Turn with Sprint", "desc": "Running backward, then turning and sprinting — transition speed.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Lateral Jump + Backpedal + Turn Sprint", "desc": "A chained sequence: lateral jump, backpedal, turn and sprint.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Sprint + Agility — Colour Cue (Partners)", "desc": "Sprinting and changing direction in response to a coloured cue — perception-action agility.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Long SSC — Hurdle Jump", "desc": "Repeated hurdle jumps using a long ground contact — trains the long stretch-shortening cycle.", "chapter": "Plyometrics & Jumps", "group": "Long Stretch-Shortening Cycle — Continuum"}, {"name": "Long SSC — Hurdle Jump, 180°", "desc": "Hurdle jumps with a 180-degree turn in the air — adds rotation to the jump.", "chapter": "Plyometrics & Jumps", "group": "Long Stretch-Shortening Cycle — Continuum"}, {"name": "Landing — Skill", "desc": "Teaching the fundamental landing: soft, aligned, absorbing force through hips and knees with quiet feet. The foundation of all safe plyometric training. Athletes must master this before progressing to reactive jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing + Jump", "desc": "A controlled landing immediately followed by a jump.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing + 2 Jumps", "desc": "Landing then two consecutive jumps — progressing reactive ability.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing (no arms)", "desc": "Landing skill with the arms removed from the action, isolating lower-body absorption.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Altitude Landing", "desc": "Stepping off a raised platform and 'sticking' the landing without any rebound. Trains high-force eccentric absorption — the ability to decelerate the body under high load. Essential prerequisite for depth jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Altitude Landing — Unilateral", "desc": "Stepping off a raised platform and 'sticking' the landing without any rebound. Trains high-force eccentric absorption — the ability to decelerate the body under high load. Essential prerequisite for depth jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Drop Jump", "desc": "Step off a box, land on both feet, immediately rebound into a maximal vertical jump with minimal ground contact (under 250ms). The classic short stretch-shortening cycle exercise — trains tendons and nervous system to absorb and redirect force rapidly.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Box Jump", "desc": "From standing, jump explosively onto a box, landing softly with both feet. Step down (don't jump down). Trains concentric lower-body power from a standing start. Joint-friendly due to the elevated soft landing.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Elasticity + Vertical Explosion", "desc": "A drill pairing elastic rebounds with a maximal vertical jump.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Lateral Jump + Quick Broad Jump (Reactive)", "desc": "A lateral jump feeding a fast horizontal jump — reactive multi-plane power.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Jump Squat", "desc": "Squat down, explode upward into maximal jump, land softly. Lower-body concentric power — generating force quickly from a slow-speed position.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Multi-Jumps", "desc": "Continuous repeated bounding jumps — reactive strength and rhythm.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Multi-Jumps — Single Leg", "desc": "Continuous single-leg jumps — high reactive demand on one limb.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Split-Squat Box Jump — Alternating", "desc": "Alternating split-stance jumps onto a box.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Countermovement Jump", "desc": "A one-legged countermovement jump — single-leg power and the SSC.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Loaded Jump", "desc": "Jumps performed with added external load — strength-speed development.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Ground Contact Time", "desc": "A drill cueing minimal, stiff ground contacts.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Elastic Strength & Power", "desc": "Jump work targeting elastic (tendon) qualities.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Reaction Time & Rhythm", "desc": "Jump drills cued for fast, rhythmic response.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Stretch-Shortening Cycle", "desc": "Jump work specifically loading the SSC.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Drop Jumps — 90°", "desc": "One-legged drop jumps with a 90-degree turn.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Box Jumps", "desc": "Jumping onto a box off one leg.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Bulgarian Split Jump", "desc": "An explosive plyometric from the rear-foot-elevated split-squat position. Drop into the bottom, then explode upward driving the front knee. Land softly back into the split position. Develops single-leg reactive power — the explosive quality needed for launching kicks from a split-stance kamae.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Hip Thrust with Jump", "desc": "From hip-thrust position (back on bench), drive hips explosively into a jump. Glute-driven hip extension into explosive power. Directly parallels hip mechanics of kicking and punching.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Broad Jump", "desc": "From standing, jump as far forward as possible landing on both feet. Maximal horizontal power. Develops the pushing-off power needed for explosive forward entries in kumite.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Lateral Lunges", "desc": "Side lunges used within the jump session as a strength/mobility primer.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Horizontal Jump", "desc": "A one-legged jump for horizontal distance.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "High Skip with Stop (COD)", "desc": "High skipping interrupted by a sharp stop — rhythm into deceleration.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Explosive Knee Thrusts", "desc": "Explosive driven-knee repetitions — hip-flexor power and rhythm.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Isometric Squat + Unilateral Movement", "desc": "Holding an isometric squat while adding a single-leg action.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Travel and Jump", "desc": "Moving and jumping on one leg — reactive single-leg locomotion.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Jump from Knees to Feet", "desc": "Exploding from a kneeling position up to the feet — hip-drive power.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Open-Close + 3 Jumps", "desc": "An open-close stance action followed by three jumps.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Reverse Lunge + High Skip", "desc": "A backward lunge feeding into a high skip — strength into elastic action.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}], "Pillar Prep & Activation": [{"name": "Power Rope — Nervous Potentiation", "desc": "Fast, intense battle-rope waves for 5-10 second bursts as a nervous-system primer. Rapid explosive arm action activates fast-twitch motor units without creating fatigue.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Small Jumps — Sagittal & Frontal Plane", "desc": "Quick low pogo-style hops forward-back and side-t s — coach_watkins #1–#7", "desc": "A seven-part set of speed-agility-quickness drills sourced from coach Watkins.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "SAQ Drill 1, 2 & 3 (Rope Jumps)", "desc": "The coach's own three SAQ drills, the third built around rope jumps.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Call Outs", "desc": "Movement responses triggered by called cues — reaction and decision speed.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Cone Reaction Drill (1 & 2)", "desc": "Reacting and moving to cones on cue — reactive agility.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Medicine-Ball Throw Relay", "desc": "A team relay built around medicine-ball throws.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Plank Relay", "desc": "A team relay incorporating plank holds — core endurance as a game.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Pizza Game", "desc": "A coordination/agility tag-style game for youth groups.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Chair Game", "desc": "A reaction game (musical-chairs style) used for quickness.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Mirror Drills (1 & 2)", "desc": "Two athletes mirror each other's movement — reactive agility against a live partner.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Medicine-Ball Funnel Tag", "desc": "A tag game using a medicine ball within a funnel area.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Tic-Tac-Toe", "desc": "A running tic-tac-toe relay — speed plus decision-making.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Sharks and Fish", "desc": "A classic chasing/dodging agility game.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Hi-5s and Low-5s", "desc": "A reaction game based on high and low hand targets.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Human Burpees", "desc": "A partner/group burpee game.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Activation and Coordination", "desc": "A combined activation-and-coordination warm-up game.", "chapter": "Integrative", "group": "Varied Jumps"}], "Calisthenics & Bodyweight": [{"name": "Crab Reach", "desc": "From the crab position, reaching one arm overhead while driving the hips up — thoracic extension, shoulder mobility and posterior-chain control.", "chapter": "Animal Flow", "group": "Foot & Ankle"}, {"name": "Scorpion Reach", "desc": "From the bear/beast position, reaching a leg up and across behind the body — thoracic rotation and hip mobility.", "chapter": "Animal Flow", "group": "Foot & Ankle"}, {"name": "Backward Roll to Feet-Together Jump", "desc": "A backward roll finished by springing up into a two-footed jump.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Lower-Body Endurance — Kneeling Leg Advance/Retract (v2)", "desc": "From kneeling, advancing and recovering the leg — lower-body muscular endurance.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Glute Bridge", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Adductor — Medicine Ball", "desc": "Adductor work squeezing a medicine ball.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "High Skip (in place)", "desc": "Stationary high-knee skipping — coordination and conditioning.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Tuck Jumps", "desc": "Jump vertically, tuck knees to chest at peak, land softly. Develops vertical power, hip flexor speed, and rapid force generation/absorption.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Split-Squat Lateral Hops", "desc": "Lateral hopping from a split-squat stance.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Ratchet Squats", "desc": "Small incremental pulse squats through the range rather than full reps. Dramatically increases time under tension for quads. Effective as a conditioning finisher or when training without heavy loads.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Prisoner Walk-Ups", "desc": "Walking lunges with hands interlocked behind the head. Forces upright torso, prevents arm assistance, isolating legs for strength-endurance work.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Sidewinders", "desc": "Low lateral travelling movement in a half-squat, weaving one foot behind the other. Trains hip mobility, lateral strength-endurance, and adductor range needed for wide karate stances.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Hover Hops", "desc": "From bear crawl position (knees hovering 2 inches off floor), hop hands or feet laterally. Develops shoulder stability, core anti-rotation, and upper-body conditioning.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Step-Through Push-Ups", "desc": "A push-up combined with a rotational step-through of a leg — pressing strength with rotation.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Push-Up Toe Taps", "desc": "Push-ups alternating a hand reaching to tap the opposite toe — pressing plus anti-rotation.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Hover Pulses", "desc": "Small pulses in the hovering quadruped hold — isometric shoulder/core endurance.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Crunches — Plank on Bosu", "desc": "Core work in a plank on an unstable Bosu.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank — Knees Front and Back", "desc": "Plank driving the knees forward and back — dynamic core.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Knee-Ins", "desc": "Drawing the knees toward the chest — lower-abdominal work.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Scissors Plank", "desc": "A plank with a scissoring leg action — anti-rotation under movement.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Superman", "desc": "Prone, simultaneously lift arms, chest, and legs. Posterior chain endurance — spinal extensors, glutes, rear shoulders.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Reverse Crunches — Band", "desc": "Band-resisted reverse crunches — lower-abdominal emphasis.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Double Crunches", "desc": "Simultaneous upper and lower crunch — whole rectus abdominis.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Feet to Sky", "desc": "Supine leg/hip raises pressing the feet upward — lower abs.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Flutter Kicks", "desc": "Supine, legs slightly off floor, rapid alternating up-down kicks. Lower-abdominal endurance and hip-flexor stamina.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "One-Leg Pull", "desc": "Single-leg tuck/pull core drill.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Side Plank", "desc": "Side-lying, propped on forearm, hips lifted. The foundational anti-lateral-flexion exercise. Critical for maintaining trunk rigidity during rotational strikes.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Contralateral Plank", "desc": "Plank lifting opposite arm and leg simultaneously. Strong anti-rotation demand. Develops the diagonal stabilization pattern used in cross-body striking.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank Knee Tucks", "desc": "Drawing the knees in toward the chest from a plank.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank Reach-Through", "desc": "Threading an arm under the body from a plank — rotation with stability.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Reverse Crunch Twist", "desc": "Reverse crunch with a rotational finish — lower abs plus obliques.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Windshield Wipers", "desc": "Supine, legs raised vertically, rotating them together side to side. Advanced rotational core exercise demanding anti-rotation strength through full range.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Side Oblique Crunch", "desc": "A side-bending crunch targeting the obliques.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank with Rotation", "desc": "Rotating into a side plank and back — dynamic core.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Twisting Pistons", "desc": "A rotational knee-drive core drill.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Black Widow Knee Slides", "desc": "From plank, slide knee toward same-side elbow along outside of body. Targets obliques and hip flexors while maintaining plank stability.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Lateral Mountain Climbers", "desc": "Mountain climbers driving the knees out to the sides — obliques and conditioning.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "V-Sit Pulses", "desc": "Torso and legs raised in a V-shape, performing small pulses. Strong isometric demand on hip flexors and rectus abdominis with dynamic endurance element.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank + Toe Touch", "desc": "Plank with a hand reaching to the opposite toe.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Sit-Up", "desc": "Supine, knees bent, curl trunk to seated. Classic trunk-flexion exercise. Fundamental core movement when performed with control <script type="text/babel">
const {useState,useMemo,useRef,useEffect}=React;

const [mobileNav,setMobileNav]=useState(false);
const contentRef=useRef(null);

const currentExercises=EXERCISES[cat]||[];

},[cat]);

  let f=currentExercises;

  }
  return f;
},[cat,subFilter,search]);

    <div style={{display:"flex",alignItems:"center",gap:"0.75rem",marginBottom:"0.5rem"}}>
      <span style={{fontSize:"2rem"}}>{catIcon}</span>
      <h2 style={{fontSize:"clamp(1.5rem,3vw,2rem)",fontWeight:700,color:"#f0eeeb",letterSpacing:"-0.02em"}}>{cat}</h2>
      <span style={{fontFamily:"'Space Mono',monospace",fontSize:"0.7rem",padding:"0.2rem 0.6rem",borderRadius:4,background:catColor+"18",color:catColor,marginLeft:"0.5rem"}}>{currentExercises.length}</span>
    </div>

    {/* Sub-filters */}
    {subcats.length>2 && <div style={{display:"flex",gap:"0.3rem",flexWrap:"wrap",marginTop:"0.75rem"}}>
      {subcats.map(s=><button key={s} onClick={()=>{setSubFilter(s);setExpanded(null)}} style={{
        fontFamily:"'Space Mono',monospace",fontSize:"0.6rem",padding:"0.25rem 0.55rem",borderRadius:4,
        border:"1px solid "+(subFilter===s?catColor:"#2a2a32"),
        background:subFilter===s?catColor+"18":"transparent",
        color:subFilter===s?catColor:"#6e6e78",cursor:"pointer",whiteSpace:"nowrap"
      }}>{s==="All"?`All (${currentExercises.length})`:s+" ("+currentExercises.filter(e=>(e.group||e.chapter)===s).length+")"}</button>)}
    </div>}
  </div>

  {/* Exercise Cards */}
  {search.trim() && filtered.length===0 && <div style={{padding:"3rem",textAlign:"center",color:"#6e6e78"}}>No exercises match "{search}"</div>}

  {filtered.map((ex,i)=>{
    const isOpen=expanded===cat+"-"+i;
    return <div key={cat+"-"+i} onClick={()=>setExpanded(isOpen?null:cat+"-"+i)} style={{
      background:"#131316",border:"1px solid "+(isOpen?"#2a2a32":"#1a1a1f"),borderLeft:"4px solid "+(isOpen?catColor:"#2a2a32"),
      borderRadius:8,padding:"0.9rem 1.2rem",marginBottom:"0.4rem",cursor:"pointer",transition:"all 0.15s"
    }}>
      <div style={{display:"flex",alignItems:"center",gap:"0.6rem"}}>
        <span style={{fontFamily:"'Space Mono',monospace",fontSize:"0.55rem",color:"#6e6e78",minWidth:28}}>#{String(i+1).padStart(3,"0")}</span>
        <span style={{fontWeight:isOpen?700:500,fontSize:"0.88rem",flex:1,color:isOpen?"#f0eeeb":"#c8c6c2"}}>{ex.name}</span>
        {ex.group && <span style={{fontFamily:"'Space Mono',monospace",fontSize:"0.55rem",color:"#6e6e78",display:isOpen?"none":"inline"}}>{ex.group.substring(0,25)}</span>}
        <span style={{fontSize:"0.6rem",color:"#6e6e78",transform:isOpen?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s",flexShrink:0}}>▼</span>
      </div>
      {isOpen && <div style={{marginTop:"0.75rem",paddingTop:"0.75rem",borderTop:"1px solid #222228"}}>
        <p style={{fontSize:"0.85rem",lineHeight:1.7,color:"#c8c6c2",marginBottom:"0.6rem"}}>{ex.desc || "Exercise demonstration — refer to coach's video for full execution details."}</p>
        <div style={{display:"flex",gap:"0.75rem",flexWrap:"wrap"}}>
          {ex.chapter && <span style={{fontFamily:"'Space Mono',monospace",fontSize:"0.58rem",padding:"0.15rem 0.45rem",borderRadius:3,background:"#1a1a1f",color:"#6e6e78"}}>📂 {ex.chapter}</span>}
          {ex.group && <span style={{fontFamily:"'Space Mono',monospace",fontSize:"0.58rem",padding:"0.15rem 0.45rem",borderRadius:3,background:catColor+"12",color:catColor}}>🏷️ {ex.group}</span>}
        </div>
      </div>}
    </div>})}

  {filtered.length>0 && <div style={{textAlign:"center",padding:"1.5rem",color:"#6e6e78",fontSize:"0.75rem",fontFamily:"'Space Mono',monospace"}}>
    {filtered.length} exercise{filtered.length!==1?"s":""} shown
  </div>}
</main>
</div>

{/* Mobile nav overlay */}
<style dangerouslySetInnerHTML={{__html:`
  @media(max-width:768px){
    .sidebar{position:fixed!important;left:-280px;top:56px;bottom:0;z-index:150;transition:left 0.25s;width:260px!important}
    .sidebar.open{left:0!important;box-shadow:4px 0 20px rgba(0,0,0,0.5)}
    .mobile-nav-btn{display:block!important}
    main{padding:1rem 1rem 3rem!important}
    input[placeholder]{width:140px!important}
  }
  @media(max-width:480px){
    input[placeholder]{width:100px!important;font-size:0.75rem!important}
    h2{font-size:1.3rem!important}
  }
`}} />
</div>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
