<style>
*{margin:0;padding:0;box-sizing:border-box}

::-webkit-scrollbar{width:5px}

::selection{background:rgba(255,107,107,0.25);color:#fff}
.syl h1{font-size:1.6rem;color:#ff6b6b;margin:1.8rem 0 0.6rem;font-family:'Space Mono',monospace;font-weight:700}
.syl h2{font-size:1.3rem;color:#ff6b6b;margin:2rem 0 0.6rem;padding-top:1.4rem;border-top:1px solid #1e1e24;font-family:'Space Mono',monospace;font-weight:700}
.syl h3{font-size:1.1rem;color:#f4a261;margin:1.2rem 0 0.4rem;font-weight:700}
.syl h4{font-size:1rem;color:#2a9d8f;margin:0.8rem 0 0.3rem;font-weight:700}

.syl li{margin:0.25rem 0;line-height:1.6}
.syl strong{color:#f0eeeb}
.syl em{color:#999;font-style:italic}
.syl hr{border:none;border-top:1px solid #1e1e24;margin:1.4rem 0}
.syl table{width:100%;border-collapse:collapse;margin:0.8rem 0;font-size:0.95rem}

.syl td{padding:0.45rem 0.7rem;border-bottom:1px solid #1e1e24;color:#b0aead}
.syl code{font-family:'Space Mono',monospace;font-size:0.9rem;background:#151518;padding:0.15rem 0.4rem;border-radius:3px;color:#f4a261}

<script>
const EX={"Coordination & Balance": [{"name": "Plank with Reach (Partners)", "desc": "From forearm or high plank, extend one hand to touch a point cued by a partner. Trains anti-rotation core control and shoulder stability under unpredictable demand. The partner cue adds a reactive decision-making element.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Two-Point Plank with Reach (Partners)", "desc": "The same reach drill performed on only two contact points (e.g. one hand, one foot), sharply increasing the anti-rotation and balance challenge.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Plank with Rotation and Reach (Partners)", "desc": "Plank reach combined with a controlled trunk rotation, integrating rotary mobility with core stability.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Lunge with Rotational Chop", "desc": "Split-stance lunge paired with a diagonal chop of a ball or cable across the body. Links lower-body stability to trunk rotation and teaches force transfer through the core — the same rotational chain used in striking.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Bear Position — Alternating Tennis-Ball Hit", "desc": "In bear hold (hands and toes down, knees hovering), alternately strike a tennis ball. Builds shoulder stability and limb coordination under isometric core load.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Bear Position — Catch Tennis Ball", "desc": "From the bear position (hands and toes on the ground, knees hovering 2 inches off the floor), catch a tennis ball tossed by a partner. The reactive grasp demand is layered on top of the isometric core and shoulder-stability hold. Builds anti-rotation core strength (the body wants to collapse toward the catching side), grip speed, and the hand-eye coordination needed for reactive catching in a destabilised position.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Plank — Touch the Cones", "desc": "From a plank, reaching to touch coloured cones placed around the hands. Variations: vary the number of colours, or assign a number to each cone for a cognitive load.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Bear Position — Alternating Tennis-Ball Catch", "desc": "Alternating-hand ball catching from the bear hold; combines reaction, grip and contralateral coordination.", "chapter": "Coordination", "group": "Postural Organisation — \"Level of Tonus\""}, {"name": "Ball Control — Manual and Foot Dexterity", "desc": "Manipulating a ball with hands and feet. Variations: touch freely; limit the number of touches; keep the ball within a set area.", "chapter": "Coordination", "group": "Precision Movements in Context — \"Level of Space\""}, {"name": "Diagonal Single-Leg Jump", "desc": "Hopping diagonally on one leg between target markers (cones, hoops, or tape lines). Each hop requires a diagonal trajectory — combining forward/backward with lateral movement. Develops single-leg control, spatial accuracy, and ankle/knee stability under a directional demand. The diagonal vector is more challenging than straight-line hopping because the body must manage forces in two planes simultaneously.", "chapter": "Coordination", "group": "Precision Movements in Context — \"Level of Space\""}, {"name": "Motor-Challenge Circuit (Youth, July 2021)", "desc": "A recorded session: moving through an agility ladder while simultaneously controlling a ball — dual-task coordination.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Team Coordination — Basic Exercises", "desc": "Partner/group sequences such as jump forward + jump back + roll + plank, and rolling right then left — coordination under a shared rhythm.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Crawl and Move a Medicine Ball", "desc": "Quadrupedal (hands and feet) crawling while displacing a medicine ball forward with each movement cycle. The athlete must coordinate crawling locomotion with ball manipulation — pushing the ball ahead between steps. Adds a cross-body coordination challenge and an upper-body loading demand to the basic crawl pattern. Develops the multi-limb coordination and trunk control that underpin complex whole-body karate movements.", "chapter": "Coordination", "group": "Poly-Articular Synergies — \"Level of Synergies\""}, {"name": "Animal Locomotion — Compilation", "desc": "A compiled set of animal-pattern locomotion movements used as a movement vocabulary: bear crawl (forward, backward, lateral), crab walk, gorilla shuffle, frog jump, lizard crawl, and variations. Each pattern develops different movement qualities — bear crawl trains shoulder stability, crab walk trains posterior-chain coordination, frog jumps develop hip and ankle mobility. Used as warm-up, conditioning, or movement-preparation work.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Crawl Between Cones", "desc": "Quadrupedal crawling (bear crawl) weaving through a course of cones. The athlete must maintain low body position, coordinate opposite hand-foot movement, and navigate the turns around each cone without standing up or losing coordination. Develops shoulder loading, core anti-rotation, spatial awareness, and the fundamental crawling pattern that is one of the most primal human movement skills.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Crawl Between Cones — Forward and Back", "desc": "The same cone-weaving crawl but with direction changes — crawling forward through the cones, then reversing and crawling backward through the same course. The backward crawl is significantly more challenging for coordination and spatial awareness because the athlete cannot see where they are going. Develops bidirectional crawling competence and the proprioceptive awareness to move without visual guidance.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Inchworm", "desc": "From standing, walk hands out to plank, then walk feet back to hands. Combines posterior-chain mobility (hamstring stretch) with shoulder and core control (plank walk-out). Excellent dynamic warm-up.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Bunny Hop over Obstacle", "desc": "Two-hands-then-two-feet \"bunny\" jump clearing a low obstacle; gymnastic locomotion and arm support strength.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Zig-Zag Crawl", "desc": "Crawling along a zig-zag path marked by cones or tape. Each direction change requires the body to shift laterally while maintaining the crawling pattern — a significant coordination challenge because the limbs must adapt their rhythm to the changing direction. Develops the ability to crawl with continuous direction changes, building the agility and body control that transfers to complex multi-directional karate movement.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Multidirectional Jump, 4 Directions", "desc": "Jumping in and out of a hoop to the four cardinal directions — footwork, rhythm and reactive foot placement.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Six Jumps on the Foam Rollers, Guard Switch, Staggered", "desc": "A sequence of jumps across staggered foam rollers while switching fighting stance — karate-specific footwork balance.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Weave Cones Zig-Zag — Hopping", "desc": "Single-leg hopping in a zig-zag pattern around cones. The athlete hops on one leg, changing direction at each cone. Trains ankle and knee stability under rapid directional loading — each direction change applies a lateral force to the ankle and knee that must be absorbed and redirected. Develops the single-leg agility and lateral control needed for the single-leg phases of kicking and the quick directional footwork of kumite.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre and Back, Feet Together", "desc": "One of a family of hoop footwork drills: feet-together jumps between the hoop centre and behind it. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Open and Close 3×, Switch", "desc": "Hoop footwork: three open-close jumps then a switch — rhythm and patterned foot placement. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Open and Close", "desc": "Basic open-close jump pattern in and around the hoop. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Front and Back, Feet Together", "desc": "Feet-together jumps cycling centre / front / back of the hoop. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Front and Back, Opening at Centre", "desc": "Front-back travel with an open-stance landing at the hoop centre. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Hopping, Jump to the Side", "desc": "Single-leg hopping with lateral jumps relative to the hoop. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Feet Together, Jump to the Side", "desc": "Two-footed lateral jumping around the hoop. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Hoop — Centre, Open, Close, Back", "desc": "A four-beat hoop footwork pattern combining stance changes with travel. The hoop (laid flat on the floor) provides a spatial boundary that constrains foot placement, teaching precise, rhythmic footwork patterns. These drills develop the same foot-placement accuracy and rhythmic coordination that underpins all kumite footwork — the ability to place the feet exactly where they need to be, at the right time, without looking down. Hoops are a core tool in a constraint-led methodology for building footwork automaticity.", "chapter": "Coordination", "group": "Locomotion"}, {"name": "Shoulder Press — Perception and Action (Partners)", "desc": "Multidirectional shoulder press where direction is dictated reactively by a partner. Strength expressed under a decision-making demand — bridging gym work and sport-specific reactive ability.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Form a Shape Quickly Between Two Cones", "desc": "A reactive task: the coach calls a body shape or pattern (star, ball, plank, L-shape), and the athlete must rapidly assemble that shape in the space between two cones. Trains the speed of motor planning — hearing an instruction and converting it into a whole-body movement as quickly as possible. Develops the cognitive-motor connection that allows athletes to respond to coaching cues and tactical instructions under time pressure.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Medicine-Ball Squat — Motor Control", "desc": "A squat performed while holding and moving a medicine ball, with emphasis on controlled movement quality over speed or load. The ball may be held at chest height, moved overhead during the descent, or passed from side to side. The focus is on smooth, coordinated movement — the quality of the squat pattern under the additional coordination demand of ball handling. A corrective/teaching drill rather than a strength exercise.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Catch a Moving Object — Perception and Action (Partners)", "desc": "A partner feeds a moving object (ball, bean bag, or similar) at unpredictable speeds, heights, and angles. The athlete must intercept and catch it, coupling perception (seeing and tracking the object) with action (moving the hand to the interception point). Develops the visual-motor coupling that underlies all reactive sports skills — in karate, this same perception-action loop governs reading and responding to an opponent's attacks.", "chapter": "Coordination", "group": "Complex Movements — \"Level of Action\""}, {"name": "Hold the Partner's Leg (v2)", "desc": "One partner holds the other's raised leg; the standing athlete maintains balance and may reach to touch the partner. Single-leg stability under perturbation.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Rooster Fight", "desc": "A balance game: two athletes try to unbalance each other and force a loss of footing. Reactive single-leg balance and core control.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Curl-Up to Knee Drive", "desc": "Rolling up from the floor to a balanced stand with a driven knee — transitional balance and trunk control.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Jump into Hoops with Knee Stability", "desc": "Jumping to land inside hoops with emphasis on a stable, aligned knee on landing — landing mechanics and joint control.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Half-Pirouette Advancing with Hoop", "desc": "A half-turn (180°) performed while advancing forward through a hoop laid on the floor. The athlete steps into the hoop, rotates their body 180 degrees, and exits facing the opposite direction — all while moving forward. Trains rotational balance, spatial orientation during turning, and the ability to maintain forward momentum through a rotation. Directly applicable to the turning techniques and directional changes in kata and kumite footwork.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Walk Across Four Foam Rollers", "desc": "Walking across a line of four foam rollers laid end-to-end on the floor. The compliant, unstable surface demands constant ankle, knee, and hip adjustments to maintain balance while moving forward. Develops dynamic balance on a narrow, unstable surface — training the proprioceptive system to make rapid corrections. The challenge is significantly harder than walking on a balance beam because the rollers shift underfoot.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Squat to Shiko Dachi, Knee to Shoulder (L & R)", "desc": "From a squat, exiting into the wide horse-straddle stance (Shiko Dachi), then driving the knee up toward the shoulder on each side.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Squat to Shiko Dachi, Knee to Shoulder + Yoko Geri", "desc": "From a squat, exit into shiko dachi (square/sumo stance), drive the knee up toward the same-side shoulder, then extend into yoko geri (side kick). The full sequence: squat → wide stance → knee drive → side kick. Tests and develops balance through the complete chain from a low, stable position to a dynamic single-leg kicking action. The transition through shiko dachi pre-loads the hip for the side kick.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "On the Bag — Mae Geri and Yoko Geri", "desc": "Front and side kicks executed while balancing on top of a bag — extreme single-leg stability demand.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "On the Bag — Mae, Yoko and Ushiro Geri", "desc": "Front kick (mae geri), side kick (yoko geri), and back kick (ushiro geri) performed while balancing on top of a heavy bag laid on the floor. The unstable surface forces extreme single-leg balance while executing three different kick trajectories. The front kick demands forward hip flexion, the side kick demands lateral hip rotation, and the back kick demands posterior hip extension — all from the same unstable platform. An advanced balance challenge that builds kick stability under real-world instability.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Kamae — Lift Knee, Rotate Front to Mawashi Position", "desc": "From fighting stance (Kamae), lifting the knee and rotating through the front into the chambered roundhouse-kick position.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Zenkutsu Dachi on the Bags with Mae Geri", "desc": "Front stance (zenkutsu dachi) practised on heavy bags laid on the floor, finished with mae geri (front kick). The bags create an unstable surface that demands constant balance adjustment within the stance. Adding the front kick from this unstable base trains the ability to generate forward kicking power while the body is managing balance — simulating the imperfect footing conditions of competition.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Trampoline — Single-Leg Jump and Stabilise", "desc": "Jumping on a trampoline on one leg and sticking the landing without the other foot touching down (knee bent). Scored on landing quality.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Retreat Switching Leg to Mawashi Geri Position", "desc": "Stepping back while switching legs into the chambered roundhouse position — four retreating movements with a kick executed (knee kept bent).", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Throw Ball on Unstable Platform", "desc": "Medicine-ball passing with a partner while standing on an unstable surface — balance under an upper-body task.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Single-Leg Stand — Touch Cone (stance-leg side)", "desc": "Standing on one leg, reaching to touch a cone placed diagonally toward the support leg. Good knee-stabiliser work.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Single-Leg Stand — Touch Cone (opposite side)", "desc": "Standing on one leg, reaching across the body to touch a cone placed on the side opposite the support leg. This cross-body reach creates a significant rotational balance challenge — the body wants to twist toward the reach, and the hip stabilisers of the support leg must resist this rotation. More challenging than same-side reaches because the centre of mass shifts further from the base of support.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Touch Cone — Airplane", "desc": "A single-leg \"airplane\"/arabesque reach to touch a cone — hip-hinge balance and posterior-chain control.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Single-Leg Stand — 8 Directions", "desc": "Touching the toe to the floor in eight directions while balancing on one leg, keeping the body facing front throughout.", "chapter": "Balance", "group": "Complex Movements — \"Level of Action\""}, {"name": "Catch Tennis Balls", "desc": "Catching dropped or thrown tennis balls with one or both hands. The coach or partner drops balls from varying heights or throws them at different speeds and angles. The athlete must react to the visual stimulus and coordinate a catching action in the shortest time possible. Develops visual reaction speed and hand-eye coordination — the same visual-motor system that governs reading and responding to an opponent's attacks in kumite.", "chapter": "Reaction", "group": "Various"}, {"name": "Catch Tennis Balls with Movement (Partners)", "desc": "Catching tennis balls while moving — the ball is thrown or bounced and may bounce once before the catch. The athlete must track the ball, adjust their movement to intercept it, and execute the catch while in motion. Adds the footwork and spatial tracking dimension to the basic reaction-catching task. Develops the ability to process visual information and coordinate a motor response simultaneously with locomotion.", "chapter": "Reaction", "group": "Various"}, {"name": "Catch Tennis Ball + Arm Strike (Partners)", "desc": "Catch a ball then immediately deliver an arm strike — trains focus, body organisation after the catch, and post-catch decision-making.", "chapter": "Reaction", "group": "Various"}], "Flexibility & Mobility": [{"name": "Shiko Dachi Position on the Floor", "desc": "Holding the shiko dachi (wide sumo/square stance) position at floor level with the hips as close to the ground as possible. Feet are wide and toes turned out at 45 degrees, knees tracking over toes. A deep static stretch for the adductors (inner thighs), hip rotators, and groin. Develops the hip opening required for wide karate stances and the pelvic mobility that supports high kicks. Hold for 30–60 seconds; use a wall for back support if needed.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Front and Side Flexibility with Ball", "desc": "Using a ball placed on the floor as a reach target to drive front-split and side-split range. The athlete extends toward the ball in front (hamstring/hip-flexor stretch) or to the side (adductor stretch), using the ball as a tactile goal. Having a physical target to reach toward engages the athlete's intention and typically produces deeper range than purely passive stretching. The ball can be progressively moved further as flexibility improves.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Dynamic Split — Open and Close Legs", "desc": "Lying supine or seated, rhythmically opening and closing the legs toward a straddle/side-split position. Dynamic (moving) stretching of the adductors and hip rotators — the legs swing open under gravity or muscle action, then close and repeat. The rhythmic movement trains the nervous system to permit greater range of motion over successive repetitions. More effective than static stretching for pre-training preparation; can also be used as a developmental flexibility drill.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Dynamic Split with Backward Roll", "desc": "A dynamic entry into the split position: the athlete performs a backward roll on the floor and, on the rise, opens into a straddle or front split position. The rolling momentum assists the range of motion, allowing a deeper split than a cold static entry would permit. Combines gymnastic flow with flexibility development — a playful, movement-integrated approach to increasing split range.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Raise Straight Leg to Ball (overhead)", "desc": "Lifting a straight leg to a ball held above head height — active hamstring/hip-flexor range for high kicks.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Ring (Backbend)", "desc": "A full 'ring' or wheel backbend position — the athlete arches backward from standing or from the floor until the hands and feet are both on the ground with the body forming a deep arch. Demands significant spinal extension, shoulder flexibility (overhead reach from an extended position), and hip-flexor length. Develops the posterior chain mobility and spinal suppleness that support dynamic kicking range and the extreme body positions found in advanced kata.", "chapter": "Flexibility", "group": "Active (Static or Dynamic)"}, {"name": "Partner Flexibility — Legs Apart / Split", "desc": "Partner-assisted straddle-split stretching. The athlete sits with legs spread wide in a straddle position while the partner applies gentle, sustained pressure to deepen the stretch — either by pushing on the back, pressing the legs wider, or pulling the athlete forward. The partner provides external force that exceeds what the athlete can generate alone, allowing deeper range. Communication is essential to avoid pushing beyond the athlete's tolerance.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Partner Flexibility — Legs Together", "desc": "Partner-assisted seated forward fold with legs together. The athlete sits with both legs extended forward and reaches toward the toes while the partner applies gentle pressure to the upper back, deepening the hamstring and lower-back stretch. Develops the posterior-chain flexibility needed for forward-folding movements and deep zenkutsu dachi positions.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Shiko Dachi — Belt Pull (Partners)", "desc": "A partner uses a karate belt looped around the athlete's hips or waist to gently pull downward while the athlete holds shiko dachi (sumo/square stance). The belt provides an external force that deepens the stance and increases the stretch on the adductors and hip rotators beyond what bodyweight alone achieves. A traditional karate-specific partner-flexibility method.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Unilateral Hip Flexibility — A", "desc": "First in a three-part progression of single-side hip-opening stretches. Targets the hip flexors, adductors, and external rotators of one leg at a time. Level A is the most accessible entry point — typically a low lunge or half-kneeling position with gentle rotation. The unilateral approach addresses side-to-side asymmetries that bilateral stretches can mask.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Unilateral Hip Flexibility — B", "desc": "Second in the three-part hip-opening progression. Increases the depth and rotational demand compared to Level A — typically adding a deeper lunge, a greater range of hip external rotation, or an overhead reach that increases the stretch through the hip flexor. Progresses range of motion while maintaining the unilateral focus.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Unilateral Hip Flexibility — C", "desc": "Third and deepest in the single-side hip-opening progression. The most demanding position for hip range — potentially a deep pigeon, a full split preparation, or an end-range rotational stretch. Only appropriate once Levels A and B are comfortable. Targets the maximum usable range of the hip joint on each side independently.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Static Front Split (with Plastron)", "desc": "Holding a front split, using a plastron/pad for support — passive hamstring and hip-flexor lengthening.", "chapter": "Flexibility", "group": "Passive"}, {"name": "Flexibility Routine", "desc": "A complete demonstrated flexibility routine covering all major muscle groups and joints. Follows a logical sequence from lower body to upper body (or vice versa), holding each stretch for 20–30 seconds. Designed as a standalone session or a post-training cool-down. Provides a standardised routine that athletes can follow independently, ensuring consistency in their flexibility work across training sessions.", "chapter": "Flexibility", "group": "Various"}, {"name": "Walking Adductor Extension", "desc": "A walking drill that takes the adductors (inner thigh) through extension: with each step, the athlete widens the stance and sinks into a lateral stretch, then walks forward into the next repetition. Dynamic groin mobility performed in motion rather than as a static hold. More functional than seated stretches because it trains the adductors through a range of motion that includes the walking pattern used in training.", "chapter": "Stretching", "group": "Varied Jumps"}, {"name": "Walking Flexion-to-Extension of the Adductors", "desc": "A walking drill cycling the adductors from flexion to extension: each stride combines a forward (hip flexion) and outward (hip abduction/extension) component, taking the groin through its full range dynamically. More comprehensive than single-direction adductor stretches because it addresses the multi-planar demands placed on the groin during karate stances and kicks.", "chapter": "Stretching", "group": "Varied Jumps"}, {"name": "General Stretching Routine (15 min)", "desc": "A complete 15-minute full-body stretching routine covering all major muscle groups: calves, hamstrings, quads, hip flexors, adductors, glutes, lower back, thoracic spine, shoulders, and neck. Designed to be performed post-training as a cool-down or as a standalone mobility session. The 15-minute format is practical — long enough to be effective, short enough to be consistently used.", "chapter": "Stretching", "group": "Varied Jumps"}, {"name": "Hamstrings — Foam Roller", "desc": "Self-myofascial release of the hamstrings using a foam roller. The athlete sits on the roller with one or both legs extended and rolls slowly along the back of the thigh from just above the knee to just below the sit bone. Pausing on tender spots for 20–30 seconds helps release fascial restrictions and reduce muscle tone. Used pre-training to improve tissue quality or post-training to aid recovery.", "chapter": "Myofascial Release", "group": "Varied Jumps"}, {"name": "Sole of Foot — Lacrosse Ball", "desc": "Rolling the sole of the foot over a lacrosse ball while standing or seated. The lacrosse ball's firmness and small diameter allow precise pressure on the plantar fascia, intrinsic foot muscles, and trigger points in the arch and heel. Improves foot mobility and tissue quality — particularly valuable for karate athletes who spend significant time barefoot on hard dojo floors and need healthy, responsive feet for balance and propulsion.", "chapter": "Myofascial Release", "group": "Varied Jumps"}, {"name": "Hip Mobility — Planar Drills", "desc": "A family of hip-joint mobility drills (inner and outer hip region) worked through the sagittal, frontal and transverse planes.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Hip, Squat & Quadriceps"}, {"name": "Hip Extension — Hands as Driver (3 planes)", "desc": "Hip-extension mobility using the hands to drive range in each plane. Hip and glute work develops the power source for karate — the hips generate the rotational force that drives punches, the extension force that powers kicks, and the directional force that enables explosive footwork.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Hip, Squat & Quadriceps"}, {"name": "Kickstand Stretch — Hip", "desc": "A staggered-stance hip stretch. Kicking drills build the hip mobility, single-leg balance, and muscular power specific to karate's scoring leg techniques. In WKF competition, kicks score the highest points (WAZA-ARI for body, IPPON for head).", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Hip, Squat & Quadriceps"}, {"name": "Pigeon with Reach", "desc": "The pigeon stretch (outer-hip/glute) combined with a reach to drive deeper range. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Hip, Squat & Quadriceps"}, {"name": "Squat Mobility (front, back & overhead) — CrossTips", "desc": "A mobility set preparing the ankles, hips and shoulders for front, back and overhead squats. Squatting strength is the foundation of all karate stance work and the leg drive that powers both kicks and punches. Every karate technique begins with force generated against the floor through the legs.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Hip, Squat & Quadriceps"}, {"name": "Core — Definition & Function (Go Athlete)", "desc": "An explanatory reference clip on what the core is and how it functions. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Disc Twist", "desc": "A rotation drill on a sliding disc — controlled trunk rotation. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Pallof Press", "desc": "Pressing a band/cable straight out from the chest while resisting its pull to the side — the definitive anti-rotation core exercise.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Pointer (Bird-Dog)", "desc": "From all fours, extending the opposite arm and leg — anti-extension/anti-rotation control and deep-core activation.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Rotational Core Stability Exercises #2 & #3", "desc": "Further anti-rotation drills from coach Adonis Harrison. Rotational exercises develop the trunk rotation power and control that drives both punching (hip rotation into gyaku-tsuki) and kicking (hip rotation into mawashi-geri) in karate.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Lunge on Pilates Ball — Stability", "desc": "A lunge with a foot/hand on a Pilates ball — stability under an unstable base. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Single-Leg Stand on Swiss Ball", "desc": "Balancing on one leg with support on a Swiss ball. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Plank, 4 & 3 Points, on Swiss Ball", "desc": "Plank holds on a Swiss ball with four then three contact points — progressive anti-extension stability.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Low-Back Pain — 3 Best Exercises", "desc": "A reference clip on three exercises for lumbar pain (typically the McGill \"big three\"). Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Glute Bridge — Muscle Activation", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Core"}, {"name": "Lunge Mobility — 3 Planes", "desc": "Lunge-based knee mobility driven through each plane of motion, including posterior and crossing variations.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Knee"}, {"name": "Knee Toe-Touch — Pelvis Driver", "desc": "A toe-touch drill using pelvic movement to drive knee range. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Knee"}, {"name": "Tube Walking", "desc": "Walking against a resistance band around the legs — hip-abductor and knee-stabiliser activation. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Knee"}, {"name": "Reverse Lunge with Lateral Flexion", "desc": "A backward lunge with a side-bend — combined hip and lateral-trunk mobility. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "World's Greatest Stretch", "desc": "A multi-joint lunge-and-rotate sequence opening hips, thoracic spine and hamstrings — a staple full-body mobiliser.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "Groiners", "desc": "From a plank, driving a foot up beside the hand — dynamic hip and adductor mobility. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "Half-Kneeling Corkscrews", "desc": "A half-kneeling rotational \"corkscrew\" drill for hip and thoracic mobility. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "3D Maps — Planar Reaches", "desc": "Reaching drills mapping mobility across all three planes. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "Rollers — Stretch", "desc": "A foam-roller-assisted stretching drill. Rolling movements develop spatial awareness, vestibular control, and the ability to recover orientation after being displaced — qualities that support falls, recoveries, and dynamic transitions in competition.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "Mountain Climbers", "desc": "From a plank, alternately driving the knees to the chest — dynamic core, hip flexion and conditioning.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Multi-Joint"}, {"name": "Shoulder Extension/Flexion — Pelvis Driver (3 planes)", "desc": "Shoulder mobility drills using pelvic movement as the driver across the planes. Shoulder work develops the stability and mobility of the shoulder complex, supporting the guard position in kumite and the overhead range needed for high blocks and dynamic arm techniques.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulders & Thoracic Spine Mobility", "desc": "A combined shoulder and upper-back mobility routine. Shoulder work develops the stability and mobility of the shoulder complex, supporting the guard position in kumite and the overhead range needed for high blocks and dynamic arm techniques.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Wall Slides", "desc": "Sliding the arms up a wall keeping contact — scapular upward-rotation and shoulder mobility. Also done lying supine for scapulo-humeral rhythm.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Belly Press Test — Muscle Activation", "desc": "A subscapularis activation/assessment drill. Standardised physical testing provides objective benchmarks for athletic development, allows identification of strengths and weaknesses, and tracks progress over training cycles.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulder Joint — Medicine Ball", "desc": "Shoulder mobility/stability work against a medicine ball. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "External Rotation for the Rotator Cuff", "desc": "External-rotation strengthening for the rotator cuff. Rotational exercises develop the trunk rotation power and control that drives both punching (hip rotation into gyaku-tsuki) and kicking (hip rotation into mawashi-geri) in karate.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Lift Off — Muscle Activation", "desc": "A subscapularis \"lift-off\" activation drill. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Scap Pull-Up — Stretch", "desc": "Hanging scapular pull-ups — scapular control and a decompressive stretch. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulder Press — Kettlebell", "desc": "An overhead press with a kettlebell — shoulder strength with a stability demand. Shoulder work develops the stability and mobility of the shoulder complex, supporting the guard position in kumite and the overhead range needed for high blocks and dynamic arm techniques.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Shoulder External/Internal Rotation — Kettlebell", "desc": "Kettlebell rotation work for shoulder stability; also paired with foam-roller stretching. Rotational exercises develop the trunk rotation power and control that drives both punching (hip rotation into gyaku-tsuki) and kicking (hip rotation into mawashi-geri) in karate.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Shoulder & Scapula"}, {"name": "Ankle — Split-Stance Mobility (3 planes)", "desc": "Split-stance ankle mobility drills using the foot or knee as the driver, worked through the sagittal, frontal and transverse planes.", "chapter": "Mobility & Motor Control — Corrective Exercises", "group": "Foot & Ankle"}], "Programmes & Assessment": [{"name": "Lower-Body Power Test", "desc": "A jump-based assessment (e.g. countermovement or horizontal jump) used to quantify lower-limb power.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Cardiovascular Endurance Test", "desc": "A field test of aerobic capacity. Endurance work builds the muscular and cardiovascular stamina to maintain technique quality through an entire training session or competition bout. In karate, the athlete who maintains form under fatigue has a decisive advantage.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Push-Up Test (FitEscola)", "desc": "Standardised push-up test from the Portuguese FitEscola battery — upper-body muscular endurance. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "Core Endurance Test", "desc": "A timed trunk-endurance assessment (plank-type hold). Endurance work builds the muscular and cardiovascular stamina to maintain technique quality through an entire training session or competition bout. In karate, the athlete who maintains form under fatigue has a decisive advantage.", "chapter": "Analysis & Assessment", "group": "Various"}, {"name": "WOD — \"Don't Run Loredo\" (6 rounds for time)", "desc": "A timed CrossFit-style benchmark workout: 6 rounds for time. Named after Staff Sergeant Michael Loredo, it combines running, bodyweight squats, push-ups, and lunges in a high-volume conditioning format. Used as a measurable fitness benchmark — athletes record their completion time and track improvement across training cycles.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Bunny Jump + V-Up", "desc": "A bunny jump paired with a V-up — explosive plus core. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Open WOD 14.5 — Thrusters + Burpees", "desc": "The CrossFit Open 14.5 workout: 21-18-15-12-9-6-3 thrusters (front squat to overhead press in one movement, 43kg men / 29kg women) and bar-facing burpees. A gruelling descending-repetition workout testing the combination of lower-body strength-endurance, overhead pressing power, and full-body conditioning under extreme fatigue.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Band Ripper 1–4 (Frank Medrano)", "desc": "A four-part banded ab series from athlete Frank Medrano. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Plank — Medicine Ball, Forearm", "desc": "Forearm plank with a medicine ball under an arm — added instability. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Crunch and Push-Up — Plank, Medicine Ball", "desc": "Combined crunch/push-up plank work over a medicine ball. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Plank — Hand Switch on Medicine Ball", "desc": "Switching a hand on and off a medicine ball from the plank — anti-rotation. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Bicycle Crunch holding Medicine Ball", "desc": "The bicycle crunch loaded with a medicine ball. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Medicine-Ball Plank Hand Switch", "desc": "Plank hand-switching across a medicine ball. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Ball Bounces", "desc": "Rapid medicine-ball bouncing — reactive upper-body/core conditioning. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Russian Ball Release", "desc": "A Russian-twist action releasing/catching the ball — rotational core. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Programmes — Workout of the Day", "group": "Sequences & Gymnastics"}, {"name": "Post-Activation Potentiation", "desc": "A webinar on PAP — using a heavy or explosive \"conditioning\" effort to acutely boost subsequent power output.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Rating of Perceived Exertion (RPE)", "desc": "A webinar on collecting and using session-RPE to monitor training load. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Training Load vs Injury Risk", "desc": "A webinar on the relationship between training load and injury risk. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Courses / Webinars", "group": "Rules"}, {"name": "Why Control Training Load", "desc": "A webinar on the rationale for monitoring and managing training load. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Courses / Webinars", "group": "Rules"}], "Strength & Power": [{"name": "Strength — Lower Body A (recorded session)", "desc": "A recorded example of a lower-body strength session used as a programming template. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Strength — Sample Session"}, {"name": "Clean Pull", "desc": "The pulling phase of the power clean — barbell accelerated from floor with explosive triple extension of ankles, knees, and hips, without the catch. Safe, high-value rate-of-force-development training. Directly develops the hip-drive mechanics powering punches and kicks.", "chapter": "Strength & Power", "group": "Olympic Derivatives"}, {"name": "Push Press", "desc": "Barbell at front-rack. Short dip-and-drive of the legs, then press overhead. Leg drive initiates the press, allowing heavier loads than strict press. Trains whole-body power transfer — the same kinetic chain used in gyaku-tsuki.", "chapter": "Strength & Power", "group": "Olympic Derivatives"}, {"name": "Bear to Plank — Crawl Out", "desc": "From the bear hold, walking the hands forward into a plank and back. Anti-extension core control through a moving base.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Dead Bug — Two Legs", "desc": "Lie supine with arms toward ceiling and knees at 90°. Simultaneously lower opposite arm overhead and opposite leg toward floor while pressing lower back into the ground. The foundational anti-extension core exercise — teaches deep stabilizers to prevent lumbar arching under load.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Sit-Through to Plank", "desc": "Rotational sit-through transitions into and out of the plank — dynamic core control with rotation. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Trunk Rotation — Core", "desc": "Controlled rotation drill training the core's ability to produce and control trunk rotation. Rotational exercises develop the trunk rotation power and control that drives both punching (hip rotation into gyaku-tsuki) and kicking (hip rotation into mawashi-geri) in karate.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Rotational Core Stability Exercises #1 & #4", "desc": "Two anti-rotation drills from coach Adonis Harrison — the core resists a rotational force to keep the trunk square.", "chapter": "Strength & Power", "group": "Core"}, {"name": "Glute Bridge in Extension", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Glute Bridge with Isometric Adduction", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Wall Sit", "desc": "Back against wall, thighs parallel to floor, knees at 90°. Isometric quadriceps endurance and tendon stiffness. Commonly used for leg conditioning.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Isometric Calf Hold", "desc": "A sustained calf-raise hold — isometric plantar-flexor and Achilles stiffness work. Calf and ankle work builds the tendon stiffness and plantar-flexor strength that make the foot a rigid, spring-like platform for explosive movement. Karate athletes need stiff, reactive ankles for rapid footwork and stable landings.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Single-Leg Wall Sit (Max Voluntary Contraction)", "desc": "A one-legged wall sit performed as a maximal isometric effort. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Isometric Abduction Holds", "desc": "Isometric hip-abductor holds — lateral hip and glute-medius strength. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Isometrics"}, {"name": "Single-Leg Squat", "desc": "Full squat on one leg, free leg held forward. Demands knee-dominant single-leg strength, balance, hip stability, and ankle mobility. Benchmark for single-leg function.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Reverse Nordics", "desc": "Kneel with straight hip line, lean backward slowly. Quads and hip flexors eccentrically control the descent. Strengthens and stretches the anterior chain — valuable for athletes needing quad strength for stances and hip-flexor range for high kicks.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Deep Squat", "desc": "Full-depth squat, hip crease below knee. Builds strength through complete ROM and develops hip/knee/ankle mobility needed for deep stances like shiko dachi.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Quarter Squat", "desc": "Partial-range squat (roughly 40° knee bend). Allows supramaximal loading to train stiffness in the joint angle range used during sprinting, jumping, and explosive stance work.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Back Squat", "desc": "Barbell on upper back, squat to at least parallel. Foundational bilateral lower-body strength: quads, glutes, adductors, posterior chain. The base for building leg strength supporting all karate techniques.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Front Squat", "desc": "Barbell front-racked, squat to full depth with upright torso. More quad-dominant than back squat, demands greater trunk rigidity. Builds upright squatting strength for deep karate stances.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Dynamic Lunge — Unilateral", "desc": "Repeated dynamic lunges on one leg — single-leg strength and control under a split stance. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Bulgarian Split Squat — Lengthened", "desc": "Stand facing away from a bench with one foot resting on it behind you, laces down. Lower your body by bending the front knee until the thigh is parallel to the floor, keeping the torso upright. The rear-foot elevation increases range of motion and single-leg demand. Targets quads, glutes, and hip flexors. A staple single-leg builder directly applicable to karate's split-stance demands.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Bulgarian Split Squat", "desc": "Stand facing away from a bench with one foot resting on it behind you, laces down. Lower your body by bending the front knee until the thigh is parallel to the floor, keeping the torso upright. The rear-foot elevation increases range of motion and single-leg demand. Targets quads, glutes, and hip flexors. A staple single-leg builder directly applicable to karate's split-stance demands.", "chapter": "Strength & Power", "group": "Legs — Knee & Hip Dominant"}, {"name": "Split-Squat Jump", "desc": "An explosive jump from the split-squat position, switching or holding the stance — lower-body power in a lunge pattern.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Supine Medicine-Ball Throw", "desc": "Lying on the back, throwing a medicine ball explosively — upper-body power with the trunk supported.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Reactive Push-Ups (with countermovement)", "desc": "Push-ups using a fast countermovement (dip then explode) — trains upper-body stretch-shortening-cycle power.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Clap/Jump Push-Ups (no countermovement)", "desc": "Explosive push-ups from a dead stop, the hands leaving the floor — concentric upper-body power. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Elbow Extensions — Triceps Push-Ups", "desc": "Push-up-style elbow extensions targeting the triceps. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Medicine-Ball Arm Press — Hip Focus", "desc": "A medicine-ball press driven from the hips — teaches power transfer from the lower body to the arms.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Landmine Press with Hip Rotation", "desc": "Press a barbell anchored in a landmine while rotating hips — as if throwing a punch. The rotational press directly mimics gyaku-tsuki kinetic chain: ground force → hip rotation → core transfer → arm extension.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Parallel Rotational Continuous Med-Ball Throw", "desc": "Continuous rotational medicine-ball throws against a wall, standing parallel to it — repeated rotational power.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Perpendicular Rotational Continuous Med-Ball Throw", "desc": "The same continuous rotational throw standing perpendicular to the wall. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Landmine Press + Leg Movement", "desc": "Landmine press combined with footwork — integrating press power with lower-body movement. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Plyometrics — Upper Body / Trunk"}, {"name": "Unilateral Push-Up", "desc": "A push-up loaded mainly through one arm — a progression toward the one-arm push-up. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Push-Ups (wide / medium / narrow)", "desc": "Push-ups across three hand widths to shift emphasis between chest and triceps. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Barbell Row (technique reference)", "desc": "An external Athlean-X reference clip on barbell row technique and common mistakes — horizontal pulling for the back.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Row with Isometric Shoulder Abduction", "desc": "A row performed while holding an isometric shoulder-abduction position — mid-back and rotator-cuff integration.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Towel Row", "desc": "An inverted/bodyweight row using a towel as the grip — back strength plus grip. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Towel Lat Pulldown", "desc": "A lat-pulldown action improvised with a towel — vertical pulling for the lats. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Strength & Power", "group": "Trunk — Push & Pull"}, {"name": "Penguin March", "desc": "March on balls of feet with straight legs and locked ankles. Builds ankle and Achilles tendon stiffness — the foundation of elastic rebound during explosive footwork.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "AirTrack Pogos", "desc": "Short stiff pogo hops on an air-track, keeping legs nearly straight and ankles rigid. The compliant surface amplifies ankle stiffness demand. Trains spring-like ground contacts for explosive kumite footwork.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Leg Raise + Lunge — Ankle", "desc": "A leg-raise into a lunge emphasising ankle control. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Jump in Lunge", "desc": "An explosive jump from and to a lunge position. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Acceleration Wall Position Holds + Heel Raise", "desc": "Holding the forward-lean acceleration position against a wall, adding heel raises — sprint posture plus calf strength.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Leg Curl (Bilateral & Unilateral) on the Rower", "desc": "Improvised hamstring leg-curls using a rowing machine — knee-flexor strength. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Single-Leg Deadlift with Kettlebell", "desc": "Stand on one leg, kettlebell in opposite hand. Hip hinge lowering the bell while free leg extends behind. Posterior-chain strength, single-leg balance, and hip control — essential for kicking stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Deadlift with Accommodating Resistance", "desc": "Deadlift with bands or chains so resistance rises through the range. Trains force production where leverage is strongest — teaching athletes to accelerate through the entire lift rather than decelerating at the top.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Assisted Nordic Hamstring Curl", "desc": "Kneel with ankles anchored. Slowly lower toward the floor using only hamstrings to control the eccentric descent. Use hands or band for assistance. One of the most evidence-backed exercises for hamstring injury prevention through eccentric knee-flexor strength.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Sliding Nordic — Hamstrings", "desc": "A sliding variation where the athlete extends forward on sliders in a controlled eccentric hamstring contraction, then curls back. Reduced demand versus standard Nordic while still training the critical eccentric pattern.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Copenhagen Adduction", "desc": "From a side-plank, top leg on a bench. Lift the body by squeezing the top leg's adductors, holding the bottom leg off the ground. The key research-backed exercise for groin injury prevention. Essential for athletes performing lateral movements and kicks.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Dead Bug", "desc": "Lie supine with arms toward ceiling and knees at 90°. Simultaneously lower opposite arm overhead and opposite leg toward floor while pressing lower back into the ground. The foundational anti-extension core exercise — teaches deep stabilizers to prevent lumbar arching under load.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Banded Glute Bridge", "desc": "Glute bridge with band around knees adding abduction demand. Recruits gluteus medius alongside maximus, training both hip extension and lateral hip stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Adductor Squeeze", "desc": "Ball or block between knees, squeeze isometrically. Simple adductor activation and strength — important for groin health and wide-stance stability.", "chapter": "Muscular Reinforcement", "group": "Trunk — Push & Pull"}, {"name": "Kettlebell Snatch", "desc": "One explosive movement: kettlebell from between the legs to locked overhead. Demands full-body coordination, hip power, shoulder stability, and grip. One of the most conditioning-dense single exercises available.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Swing (1 & 2)", "desc": "Hike the bell between the legs with a hip hinge, then snap hips forward to swing it to chest height. Arms stay straight — power comes entirely from the hip drive. The foundational ballistic posterior-chain exercise. The hip-snap pattern directly parallels gyaku-tsuki and mawashi-geri mechanics.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Goblet Squat with Kettlebell", "desc": "Hold kettlebell by the horns at chest height. Squat deep with upright torso, driving knees out. The front-loaded position naturally promotes uprightness, making it an excellent squat teaching tool while building hip mobility and core strength.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Around-the-World with Stall", "desc": "Passing the bell around the body with a brief hold — grip, coordination and core. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Single-Leg Kettlebell Deadlift", "desc": "A one-legged hip hinge with a kettlebell — posterior-chain strength and balance. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Kettlebell Goblet Reverse Lunge", "desc": "A backward lunge holding the bell in the goblet position — single-leg strength with an anterior load.", "chapter": "Kettlebell", "group": "Sequences & Gymnastics"}, {"name": "Banded Glute Bridge", "desc": "Glute bridge with band around knees adding abduction demand. Recruits gluteus medius alongside maximus, training both hip extension and lateral hip stability.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Jump Squats", "desc": "Jump squats against band resistance — resisted lower-body power. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Pistol Squat", "desc": "Band-assisted single-leg pistol squat. Free leg extends forward while squatting to full depth. Band reduces bodyweight demand while training extreme single-leg strength, ankle mobility, and balance.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Sprints", "desc": "Sprint against band resistance anchored behind. Overloads the horizontal force production phase — forward lean, aggressive ground strike, and hip drive — under resistance.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Banded Biceps Curls (Overhead, Seated, Lateral, Concentration)", "desc": "A set of band biceps curls from varied angles — arm strength. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Arms & Legs Open-Close — Band", "desc": "Banded open-close action for the limbs — abduction strength. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Single-Leg Leg Press — Band", "desc": "A band-resisted single-leg press. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Calf Raises — Band", "desc": "Standing calf raises performed against band resistance wrapped under the foot. Trains plantar flexor strength and Achilles tendon stiffness — the elastic spring system that powers all explosive footwork.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Single-Leg Deadlift — Band", "desc": "A band-resisted single-leg hip hinge. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "18 Advanced Resistance-Band Exercises", "desc": "A compiled reference set of advanced band exercises. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "Band Training for Strength and Power", "desc": "A reference clip on programming bands for strength and power. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "TRX & Resistance Bands", "group": "Resistance Band"}, {"name": "TRX Lunge with Knee Drive", "desc": "A lunge performed with the rear foot suspended in a TRX strap, followed by a knee drive at the top. The suspended rear foot creates instability that forces the front leg and core to stabilise throughout the movement. The knee drive at the top mimics the knee-lift chamber of mae geri (front kick). Builds single-leg strength, balance, and hip-flexor power in a karate-relevant pattern.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Mountain Climbers", "desc": "Mountain climbers performed with the feet in TRX straps — alternating knee drives toward the chest from a plank position. The suspended feet amplify the core anti-extension demand and remove the ground contact that normally provides stability. Creates a significantly harder core challenge than floor mountain climbers, building the abdominal endurance and trunk control needed for sustained technique quality.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Mixed Row", "desc": "A TRX row performed with a mixed grip or changing pulling angle between repetitions — supinated, pronated, and neutral grips. Trains the back muscles (lats, rhomboids, rear deltoids) from multiple vectors in a single set. Develops the horizontal pulling strength that balances the forward-pushing mechanics of punching.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Push-Up + Crunch", "desc": "A push-up with feet in TRX straps, followed by drawing the knees toward the chest in a crunch/tuck. Combines pressing strength with dynamic core flexion under suspension instability. The push-up builds the pressing power for oi-tsuki and guard maintenance; the crunch develops the knee-drive pattern used in kick chambers.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Low-Back Extension", "desc": "A TRX exercise targeting the lumbar extensors (erector spinae). The athlete faces the anchor point, leans back with arms extended holding the straps, and extends the trunk against gravity. Strengthens the posterior chain of the trunk — the muscles that maintain spinal alignment during rotational techniques and prevent collapse under impact.", "chapter": "TRX & Resistance Bands", "group":
