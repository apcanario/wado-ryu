"TRX Suspension Trainer"}, {"name": "TRX Gyaku Leg Drive (Kumite)", "desc": "A karate-specific TRX drill that isolates the rear-leg drive of gyaku-tsuki (reverse punch). The athlete holds the TRX straps for stability and practises the explosive rear-leg push-off and hip rotation that powers the reverse punch — without the complexity of the full technique. Isolates the leg drive so the athlete can feel the correct force-production pattern before integrating it into the complete punch.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Pistol Squat", "desc": "A single-leg pistol squat performed while holding TRX straps for balance assistance. The straps reduce the balance demand, making the full-depth single-leg squat accessible to athletes who can't yet perform it freestanding. Builds the extreme single-leg strength, ankle mobility, and hip control that the pistol squat demands, with a progression path toward the unassisted version.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX \"T\" and \"Y\"", "desc": "TRX 'T' and 'Y' raises: the athlete leans back holding the straps and pulls the body up while spreading the arms into a T-shape (arms out to sides) or Y-shape (arms overhead at 45°). Targets the mid-back (rhomboids, middle trapezius) and scapular stabilisers (lower trapezius, rotator cuff). Builds the postural strength and shoulder-blade control that maintains a strong guard position in kumite.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX One-Arm Pull + Twist", "desc": "A single-arm TRX row combined with a trunk rotation: pull with one arm while rotating the torso to open the chest toward the pulling side. Combines horizontal pulling strength with rotational core control. Develops the back-and-rotation pattern used in pulling guard adjustments and the rotational unwinding that can follow a blocking action in kumite.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}, {"name": "TRX Squat", "desc": "A squat performed while holding TRX straps for balance and light assistance. The straps allow the athlete to sit deeper into the squat while maintaining an upright torso. An excellent teaching tool for squat mechanics — the straps provide feedback and support without removing the strengthening demand. Also useful for high-repetition squat conditioning when fatigue would normally compromise form.", "chapter": "TRX & Resistance Bands", "group": "TRX Suspension Trainer"}], "Speed, Agility & Plyometrics": [{"name": "Wall Drive", "desc": "Lean against wall at 45° in sprint acceleration position. Drive raised knee down and foot into ground forcefully, then switch. Teaches front-side sprint mechanics and aggressive ground strike — the same explosive leg action powering slide entries in kumite.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Wall Switches", "desc": "Rapid alternation of the drive legs against the wall — sprint leg-switch timing and rhythm. Wall drills provide a stable reference surface that allows the athlete to isolate specific movement patterns (sprint mechanics, pressing actions, body positioning) without the complexity of free-standing movement.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Load & Lift & Switch", "desc": "A wall-drill sequence: load the stance leg, lift the drive knee, then switch — sequencing the acceleration stride.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "Wall Drive — Progressions", "desc": "Lean against wall at 45° in sprint acceleration position. Drive raised knee down and foot into ground forcefully, then switch. Teaches front-side sprint mechanics and aggressive ground strike — the same explosive leg action powering slide entries in kumite.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Stationary"}, {"name": "A-Series & Switches", "desc": "The classic sprint drill progression: A-march (slow exaggerated knee lifts), A-skip (adding a hop), A-run (full tempo), plus rapid leg switches. Builds coordination, posture, and running stride mechanics. Essential warm-up for speed work.", "chapter": "Acceleration & Maximum Velocity", "group": "Technical Drills — Moving"}, {"name": "Lateral Shuffle — Progressions (PEAK)", "desc": "A graded progression of lateral shuffling drills — starting with simple side slides, progressing to rapid direction changes, crossover steps, and reactive cues. The foundation of side-to-side agility used in kumite ring movement.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle — Continuous Progression (+ Dynamic)", "desc": "Continuous lateral shuffling with a dynamic finish. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Ski Jumps (COD)", "desc": "Side-to-side jumps mimicking a skier's motion. Develops lateral elasticity and braking strength through the outside leg — the same mechanics used in lateral cutting and direction changes in kumite.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle with Hurdle Jump (COD)", "desc": "Lateral movement combined with a hurdle jump — shuffle plus reactive jump. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Shuffle — Medicine Ball", "desc": "Lateral shuffling while holding/moving a medicine ball for added load (a three-part #1–#3 series). Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Improve Multidirectional Movement (1 & 2)", "desc": "Two drills targeting general multidirectional movement quality. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Lunge with Cable", "desc": "A lateral lunge loaded by a cable — resisted side-lunge strength for cutting. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Change of Direction with Added Load", "desc": "Cutting drills performed with extra resistance — strengthens the braking and re-acceleration steps. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Dynamic Lunge", "desc": "Continuous dynamic lunging used as a COD strength primer. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Lateral Single-Leg Hop + COD (Plyometric #2)", "desc": "A sideways single-leg hop feeding into a change of direction — reactive single-leg cutting. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Deceleration & Change of Direction", "group": "Change of Direction — Drills"}, {"name": "Multilateral Movement in Pairs", "desc": "Partner-mirrored multidirectional movement — reactive agility against a live stimulus. Partner work adds an unpredictable, reactive element that solo training cannot replicate. The partner provides live stimulus, resistance, or perturbation that more closely simulates the demands of facing an opponent.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Forward-Back with Reaction", "desc": "Forward and backward movement triggered by a reactive cue. Reaction training develops the visual-motor speed that governs the ability to read and respond to an opponent's actions — the perceptual foundation of all combat sports.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Backpedal + Turn with Sprint", "desc": "Running backward, then turning and sprinting — transition speed. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Lateral Jump + Backpedal + Turn Sprint", "desc": "A chained sequence: lateral jump, backpedal, turn and sprint. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Sprint + Agility — Colour Cue (Partners)", "desc": "Sprinting and changing direction in response to a coloured cue — perception-action agility. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Deceleration & Change of Direction", "group": "Agility — Drills"}, {"name": "Long SSC — Hurdle Jump", "desc": "Repeated hurdle jumps using a long ground contact — trains the long stretch-shortening cycle. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Long Stretch-Shortening Cycle — Continuum"}, {"name": "Long SSC — Hurdle Jump, 180°", "desc": "Hurdle jumps with a 180-degree turn in the air — adds rotation to the jump. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Long Stretch-Shortening Cycle — Continuum"}, {"name": "Landing — Skill", "desc": "Teaching the fundamental landing: soft, aligned, absorbing force through hips and knees with quiet feet. The foundation of all safe plyometric training. Athletes must master this before progressing to reactive jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing + Jump", "desc": "A controlled landing immediately followed by a jump. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing + 2 Jumps", "desc": "Landing then two consecutive jumps — progressing reactive ability. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Landing (no arms)", "desc": "Landing skill with the arms removed from the action, isolating lower-body absorption. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Altitude Landing", "desc": "Stepping off a raised platform and 'sticking' the landing without any rebound. Trains high-force eccentric absorption — the ability to decelerate the body under high load. Essential prerequisite for depth jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Altitude Landing — Unilateral", "desc": "Stepping off a raised platform and 'sticking' the landing without any rebound. Trains high-force eccentric absorption — the ability to decelerate the body under high load. Essential prerequisite for depth jumps.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Drop Jump", "desc": "Step off a box, land on both feet, immediately rebound into a maximal vertical jump with minimal ground contact (under 250ms). The classic short stretch-shortening cycle exercise — trains tendons and nervous system to absorb and redirect force rapidly.", "chapter": "Plyometrics & Jumps", "group": "Landing Skill"}, {"name": "Box Jump", "desc": "From standing, jump explosively onto a box, landing softly with both feet. Step down (don't jump down). Trains concentric lower-body power from a standing start. Joint-friendly due to the elevated soft landing.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Elasticity + Vertical Explosion", "desc": "A drill pairing elastic rebounds with a maximal vertical jump. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Lateral Jump + Quick Broad Jump (Reactive)", "desc": "A lateral jump feeding a fast horizontal jump — reactive multi-plane power. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Jump Squat", "desc": "Squat down, explode upward into maximal jump, land softly. Lower-body concentric power — generating force quickly from a slow-speed position.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Multi-Jumps", "desc": "Continuous repeated bounding jumps — reactive strength and rhythm. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Multi-Jumps — Single Leg", "desc": "Continuous single-leg jumps — high reactive demand on one limb. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Split-Squat Box Jump — Alternating", "desc": "Alternating split-stance jumps onto a box. Squatting strength is the foundation of all karate stance work and the leg drive that powers both kicks and punches. Every karate technique begins with force generated against the floor through the legs.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Countermovement Jump", "desc": "A one-legged countermovement jump — single-leg power and the SSC. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Loaded Jump", "desc": "Jumps performed with added external load — strength-speed development. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Ground Contact Time", "desc": "A drill cueing minimal, stiff ground contacts. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Elastic Strength & Power", "desc": "Jump work targeting elastic (tendon) qualities. Resistance bands provide accommodating resistance — the tension increases as the band stretches, matching the natural strength curve of most movements. Ideal for karate athletes because they overload the end range where techniques need to be fastest.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Reaction Time & Rhythm", "desc": "Jump drills cued for fast, rhythmic response. Reaction training develops the visual-motor speed that governs the ability to read and respond to an opponent's actions — the perceptual foundation of all combat sports.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Improve Stretch-Shortening Cycle", "desc": "Jump work specifically loading the SSC. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Drop Jumps — 90°", "desc": "One-legged drop jumps with a 90-degree turn. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Box Jumps", "desc": "Jumping onto a box off one leg. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Bulgarian Split Jump", "desc": "An explosive plyometric from the rear-foot-elevated split-squat position. Drop into the bottom, then explode upward driving the front knee. Land softly back into the split position. Develops single-leg reactive power — the explosive quality needed for launching kicks from a split-stance kamae.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Hip Thrust with Jump", "desc": "From hip-thrust position (back on bench), drive hips explosively into a jump. Glute-driven hip extension into explosive power. Directly parallels hip mechanics of kicking and punching.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Broad Jump", "desc": "From standing, jump as far forward as possible landing on both feet. Maximal horizontal power. Develops the pushing-off power needed for explosive forward entries in kumite.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Lateral Lunges", "desc": "Side lunges used within the jump session as a strength/mobility primer. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Horizontal Jump", "desc": "A one-legged jump for horizontal distance. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "High Skip with Stop (COD)", "desc": "High skipping interrupted by a sharp stop — rhythm into deceleration. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Explosive Knee Thrusts", "desc": "Explosive driven-knee repetitions — hip-flexor power and rhythm. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Isometric Squat + Unilateral Movement", "desc": "Holding an isometric squat while adding a single-leg action. Squatting strength is the foundation of all karate stance work and the leg drive that powers both kicks and punches. Every karate technique begins with force generated against the floor through the legs.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Single-Leg Travel and Jump", "desc": "Moving and jumping on one leg — reactive single-leg locomotion. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Jump from Knees to Feet", "desc": "Exploding from a kneeling position up to the feet — hip-drive power. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Open-Close + 3 Jumps", "desc": "An open-close stance action followed by three jumps. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}, {"name": "Reverse Lunge + High Skip", "desc": "A backward lunge feeding into a high skip — strength into elastic action. Lunge patterns train the split-stance strength and single-leg stability directly applicable to karate stances. The forward, reverse, and lateral lunge variations develop the directional strength needed for multi-plane movement.", "chapter": "Plyometrics & Jumps", "group": "Varied Jumps"}], "Pillar Prep & Activation": [{"name": "Power Rope — Nervous Potentiation", "desc": "Fast, intense battle-rope waves for 5-10 second bursts as a nervous-system primer. Rapid explosive arm action activates fast-twitch motor units without creating fatigue.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Small Jumps — Sagittal & Frontal Plane", "desc": "Quick low pogo-style hops forward-back and side-to-side — ankle stiffness and priming. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Small Jumps — Single Leg", "desc": "Quick single-leg hops for reactive ankle priming. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Low Lateral Skips", "desc": "Low, fast lateral skipping — rhythm and frontal-plane priming. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Fast Contact Time", "desc": "Jumping/hopping drills cueing the shortest possible ground contacts. Trains ankle stiffness, tendon elasticity, and neural pre-activation for spring-like ground contacts.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Skipping with Sprint", "desc": "Skipping that breaks into a sprint — priming into top-speed mechanics. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Lateral Skip + Ball Throw", "desc": "Lateral skipping combined with a ball throw — coordinated whole-body priming. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Medicine Ball — Nervous Potentiation", "desc": "Explosive medicine-ball throws used as a primer. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Open and Close — Frontal Plane", "desc": "Fast open-close foot action in the frontal plane. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Lateral Jumps, Feet Together — Frontal Plane", "desc": "Two-footed side jumps for frontal-plane priming. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "Push-Up — Slow Eccentric + Fast Concentric", "desc": "A push-up lowered slowly then driven up explosively — upper-body potentiation. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Neural Activation / Nervous Potentiation", "group": "Varied Jumps"}, {"name": "SAQ Drills — coach_watkins #1–#7", "desc": "A seven-part set of speed-agility-quickness drills sourced from coach Watkins. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "SAQ Drill 1, 2 & 3 (Rope Jumps)", "desc": "The coach's own three SAQ drills, the third built around rope jumps. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Call Outs", "desc": "Movement responses triggered by called cues — reaction and decision speed. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Cone Reaction Drill (1 & 2)", "desc": "Reacting and moving to cones on cue — reactive agility. Reaction training develops the visual-motor speed that governs the ability to read and respond to an opponent's actions — the perceptual foundation of all combat sports.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Medicine-Ball Throw Relay", "desc": "A team relay built around medicine-ball throws. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Plank Relay", "desc": "A team relay incorporating plank holds — core endurance as a game. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Pizza Game", "desc": "A coordination/agility tag-style game for youth groups. Game-based drills develop physical qualities (speed, agility, reaction, coordination) within a fun, competitive context that maintains engagement — particularly important for youth athletes whose attention and motivation thrive on play.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Chair Game", "desc": "A reaction game (musical-chairs style) used for quickness. Game-based drills develop physical qualities (speed, agility, reaction, coordination) within a fun, competitive context that maintains engagement — particularly important for youth athletes whose attention and motivation thrive on play.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Mirror Drills (1 & 2)", "desc": "Two athletes mirror each other's movement — reactive agility against a live partner. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Medicine-Ball Funnel Tag", "desc": "A tag game using a medicine ball within a funnel area. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Tic-Tac-Toe", "desc": "A running tic-tac-toe relay — speed plus decision-making. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Sharks and Fish", "desc": "A classic chasing/dodging agility game. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Hi-5s and Low-5s", "desc": "A reaction game based on high and low hand targets. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Human Burpees", "desc": "A partner/group burpee game. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}, {"name": "Activation and Coordination", "desc": "A combined activation-and-coordination warm-up game. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Integrative", "group": "Varied Jumps"}], "Calisthenics & Bodyweight": [{"name": "Crab Reach", "desc": "From the crab position, reaching one arm overhead while driving the hips up — thoracic extension, shoulder mobility and posterior-chain control.", "chapter": "Animal Flow", "group": "Foot & Ankle"}, {"name": "Scorpion Reach", "desc": "From the bear/beast position, reaching a leg up and across behind the body — thoracic rotation and hip mobility.", "chapter": "Animal Flow", "group": "Foot & Ankle"}, {"name": "Backward Roll to Feet-Together Jump", "desc": "A backward roll finished by springing up into a two-footed jump. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Lower-Body Endurance — Kneeling Leg Advance/Retract (v2)", "desc": "From kneeling, advancing and recovering the leg — lower-body muscular endurance. Endurance work builds the muscular and cardiovascular stamina to maintain technique quality through an entire training session or competition bout. In karate, the athlete who maintains form under fatigue has a decisive advantage.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Glute Bridge", "desc": "Supine, knees bent, drive hips up by squeezing glutes. Foundational glute activation and posterior-chain exercise. Corrects glute inhibition, builds hip-extension strength for sprinting and kicking.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Adductor — Medicine Ball", "desc": "Adductor work squeezing a medicine ball. Medicine-ball work develops power through the kinetic chain — the force must be transmitted from the legs through the core into the arms and then into the ball. This whole-body power transfer pattern directly mirrors the mechanics of punching and throwing in karate.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "High Skip (in place)", "desc": "Stationary high-knee skipping — coordination and conditioning. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Tuck Jumps", "desc": "Jump vertically, tuck knees to chest at peak, land softly. Develops vertical power, hip flexor speed, and rapid force generation/absorption.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Split-Squat Lateral Hops", "desc": "Lateral hopping from a split-squat stance. Squatting strength is the foundation of all karate stance work and the leg drive that powers both kicks and punches. Every karate technique begins with force generated against the floor through the legs.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Ratchet Squats", "desc": "Small incremental pulse squats through the range rather than full reps. Dramatically increases time under tension for quads. Effective as a conditioning finisher or when training without heavy loads.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Prisoner Walk-Ups", "desc": "Walking lunges with hands interlocked behind the head. Forces upright torso, prevents arm assistance, isolating legs for strength-endurance work.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Sidewinders", "desc": "Low lateral travelling movement in a half-squat, weaving one foot behind the other. Trains hip mobility, lateral strength-endurance, and adductor range needed for wide karate stances.", "chapter": "Calisthenics", "group": "Lower Body"}, {"name": "Hover Hops", "desc": "From bear crawl position (knees hovering 2 inches off floor), hop hands or feet laterally. Develops shoulder stability, core anti-rotation, and upper-body conditioning.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Step-Through Push-Ups", "desc": "A push-up combined with a rotational step-through of a leg — pressing strength with rotation. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Push-Up Toe Taps", "desc": "Push-ups alternating a hand reaching to tap the opposite toe — pressing plus anti-rotation. Push-up variations develop the pressing strength and shoulder stability that support the punching mechanics of karate — the same muscle groups (chest, triceps, anterior deltoid) drive the extension of the arm in tsuki techniques.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Hover Pulses", "desc": "Small pulses in the hovering quadruped hold — isometric shoulder/core endurance. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Upper Body"}, {"name": "Crunches — Plank on Bosu", "desc": "Core work in a plank on an unstable Bosu. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank — Knees Front and Back", "desc": "Plank driving the knees forward and back — dynamic core. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Knee-Ins", "desc": "Drawing the knees toward the chest — lower-abdominal work. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Scissors Plank", "desc": "A plank with a scissoring leg action — anti-rotation under movement. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Superman", "desc": "Prone, simultaneously lift arms, chest, and legs. Posterior chain endurance — spinal extensors, glutes, rear shoulders.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Reverse Crunches — Band", "desc": "Band-resisted reverse crunches — lower-abdominal emphasis. Core work in the flexion pattern (crunches) develops the trunk-flexion power used in snapping kicks and the protective curling action that absorbs body shots in kumite.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Double Crunches", "desc": "Simultaneous upper and lower crunch — whole rectus abdominis. Core work in the flexion pattern (crunches) develops the trunk-flexion power used in snapping kicks and the protective curling action that absorbs body shots in kumite.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Feet to Sky", "desc": "Supine leg/hip raises pressing the feet upward — lower abs. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Flutter Kicks", "desc": "Supine, legs slightly off floor, rapid alternating up-down kicks. Lower-abdominal endurance and hip-flexor stamina.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "One-Leg Pull", "desc": "Single-leg tuck/pull core drill. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Side Plank", "desc": "Side-lying, propped on forearm, hips lifted. The foundational anti-lateral-flexion exercise. Critical for maintaining trunk rigidity during rotational strikes.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Contralateral Plank", "desc": "Plank lifting opposite arm and leg simultaneously. Strong anti-rotation demand. Develops the diagonal stabilization pattern used in cross-body striking.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank Knee Tucks", "desc": "Drawing the knees in toward the chest from a plank. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank Reach-Through", "desc": "Threading an arm under the body from a plank — rotation with stability. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Reverse Crunch Twist", "desc": "Reverse crunch with a rotational finish — lower abs plus obliques. Core work in the flexion pattern (crunches) develops the trunk-flexion power used in snapping kicks and the protective curling action that absorbs body shots in kumite.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Windshield Wipers", "desc": "Supine, legs raised vertically, rotating them together side to side. Advanced rotational core exercise demanding anti-rotation strength through full range.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Side Oblique Crunch", "desc": "A side-bending crunch targeting the obliques. Core work in the flexion pattern (crunches) develops the trunk-flexion power used in snapping kicks and the protective curling action that absorbs body shots in kumite.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank with Rotation", "desc": "Rotating into a side plank and back — dynamic core. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Twisting Pistons", "desc": "A rotational knee-drive core drill. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Black Widow Knee Slides", "desc": "From plank, slide knee toward same-side elbow along outside of body. Targets obliques and hip flexors while maintaining plank stability.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Lateral Mountain Climbers", "desc": "Mountain climbers driving the knees out to the sides — obliques and conditioning. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "V-Sit Pulses", "desc": "Torso and legs raised in a V-shape, performing small pulses. Strong isometric demand on hip flexors and rectus abdominis with dynamic endurance element.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Plank + Toe Touch", "desc": "Plank with a hand reaching to the opposite toe. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Sit-Up", "desc": "Supine, knees bent, curl trunk to seated. Classic trunk-flexion exercise. Fundamental core movement when performed with control.", "chapter": "Calisthenics", "group": "Core / Midsection"}, {"name": "Burpee + Jump + Kamae", "desc": "Standard burpee but landing in kamae (fighting guard) instead of neutral stance. Full-body conditioning with the habit of recovering into combat stance under fatigue.", "chapter": "Calisthenics", "group": "Compound"}, {"name": "Side Kick-Through (Animal Flow)", "desc": "A rotational kick-through from the beast position. Kicking drills build the hip mobility, single-leg balance, and muscular power specific to karate's scoring leg techniques. In WKF competition, kicks score the highest points (WAZA-ARI for body, IPPON for head).", "chapter": "Calisthenics", "group": "Compound"}, {"name": "Bulgarian Split Squat", "desc": "Stand facing away from a bench with one foot resting on it behind you, laces down. Lower your body by bending the front knee until the thigh is parallel to the floor, keeping the torso upright. The rear-foot elevation increases range of motion and single-leg demand. Targets quads, glutes, and hip flexors. A staple single-leg builder directly applicable to karate's split-stance demands.", "chapter": "Calisthenics", "group": "Compound"}, {"name": "Partner Drills", "desc": "A set of partner exercises — seated ball crunches, partner straight-leg raises, ball back-extensions, foot-touch jumps, leapfrog (\"leapfrog\"), travelling plank, backward roll with ball pass, bunny-jump + V-up, extended-body bunny jumps, Superman back-extension with jumps and with rolls, plank-push-up + jump + crawl, and seated arm-extension plyometrics. Partner resistance and shared timing throughout.", "chapter": "Calisthenics", "group": "Partner Work"}, {"name": "Calisthenic Sequences A–D", "desc": "Four set bodyweight flows combining the movements above into continuous routines. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Calisthenics", "group": "Sequences & Gymnastics"}, {"name": "Gymnastics — Roll & Bunny-Jump Circuits", "desc": "Circuits chaining forward rolls and bunny jumps, including over a hurdle; plus Arsénio's gymnastic sequence.", "chapter": "Calisthenics", "group": "Sequences & Gymnastics"}, {"name": "Bridge — Knees Down, Hips Forward", "desc": "A back-bridge progression from the knees — spinal extension and shoulder/hip-flexor mobility. Hip and glute work develops the power source for karate — the hips generate the rotational force that drives punches, the extension force that powers kicks, and the directional force that enables explosive footwork.", "chapter": "Calisthenics", "group": "Sequences & Gymnastics"}, {"name": "Cartwheel", "desc": "Hands placed sequentially while the body rotates laterally through a handstand, landing on feet one at a time. Develops coordination, spatial awareness, hand-support strength, and comfort with inversion.", "chapter": "Calisthenics", "group": "Sequences & Gymnastics"}], "Kihon & Fundamentals": [{"name": "Foot-Shape Correction (Partners)", "desc": "Partner drill focused on correcting the angle, shape, and positioning of the feet in karate stances. One partner assumes the stance while the other physically checks and adjusts foot placement: toe direction, arch engagement, weight distribution across the foot, and heel-to-toe alignment. Proper foot shape is the invisible foundation of every stance — small misalignments here cascade into balance and power issues above.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Foot Settling into Stances", "desc": "Drilling the correct 'settling' action as the body drops into each karate stance. Rather than stepping into a stance mechanically, the athlete practises the dynamic transition: the weight sinks, the hips engage, and the feet grip the floor simultaneously. Developing this settling quality makes stances feel rooted rather than placed — a key distinction between beginners and experienced karateka.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Zenkutsu Dachi: Leg Raise + Rotation + 180° (Level 1)", "desc": "From zenkutsu dachi (front stance), the athlete raises the rear leg, rotates the body, and completes a 180-degree turn to end in the opposite-facing front stance. Level 1 of a stance-turning progression. Trains the mechanics of turning in stance — weight transfer, pivot on the support foot, and immediate re-settling into a solid front stance facing the new direction. Essential for kata and for the turning actions in kumite ring movement.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Zenkutsu Dachi: Mae Geri + Mate + 180° + Gyaku Tsuki (Level 2)", "desc": "Front kick, held pause, 180-degree turn and reverse punch — level 2; a level-3 version is performed in threes.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Zenkutsu Dachi with Knee/Leg Raise (Level 0)", "desc": "The introductory front-stance drill (Level 0): from zenkutsu dachi (front stance), raise the rear knee toward the chest, hold briefly for balance, then return to the stance. Builds single-leg balance within the stance, hip-flexor activation, and the core control needed to maintain an upright torso while the leg is lifted. The prerequisite movement before adding rotation or directional changes.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Lumbar & Abdominal Proprioception (Level 0)", "desc": "Proprioceptive awareness training for the trunk: exercises that develop the athlete's ability to sense and control the position of the pelvis, lumbar spine, and abdominal wall. Includes pelvic tilting, bracing under perturbation, and abdominal hollowing/bracing variations. Foundational for karate — the trunk must transmit force between the lower and upper body during every technique, and poor proprioception here means energy leaks and technique collapse under fatigue.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Anatomy in Focus #7 — Hip Flexors", "desc": "An educational reference clip examining the hip flexors (iliacus, psoas major, rectus femoris) — their anatomy, function, and critical role in karate technique. The hip flexors drive the knee chamber of every kick, maintain the forward lean of zenkutsu dachi, and control the hip position in kamae. Understanding their function helps coaches programme targeted mobility and strengthening work and diagnose technique faults caused by hip-flexor restriction or weakness.", "chapter": "Biomechanics", "group": "TRX Suspension Trainer"}, {"name": "Playful Bunkai — Sequence A (and v2)", "desc": "A game-based bunkai (application) sequence where partners apply kata movements in a playful, exploratory context. Rather than rigid 'this block defends this attack' interpretation, the athletes discover applications through movement play — testing how kata shapes can trap, redirect, or control a partner. The game format removes the performance anxiety of formal bunkai and encourages creative problem-solving with traditional movements.", "chapter": "Bunkai", "group": "TRX Suspension Trainer"}, {"name": "Yoko Geri Circuit (Beginners)", "desc": "A technical circuit for beginner classes focused entirely on yoko geri (side kick). Stations progress through the kick's components: hip opening, knee chamber, extension toward a target, retraction, and balance holds. Each station isolates one phase of the kick, and the circuit format keeps beginners moving and engaged rather than standing in a line waiting for repetitions. Appropriate for white-to-green belt levels.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi Circuit (Children)", "desc": "A horse-stance (kiba dachi) circuit adapted for children's classes. Stations include: holding the stance for time, walking in the stance between cones, performing arm techniques from the stance (punches, blocks), and partner pushing games to test stability. The circuit format keeps children engaged through variety and movement, avoiding the attention-span limitations of prolonged static stance practice.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Motor-Literacy Circuit — Speed & Plyometrics (Advanced)", "desc": "An advanced motor-literacy circuit combining speed and plyometric tasks: sprint starts, box jumps, agility ladder work, tuck jumps, and reactive direction changes. Designed for athletes who have mastered basic movement patterns and are ready for high-intensity, explosive movement challenges. Builds the athletic qualities (reactive strength, acceleration, power) that underpin advanced karate technique.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Motor-Literacy Circuit — Speed (A & B)", "desc": "Two versions of a speed-focused motor-literacy circuit. Version A and Version B offer different exercise combinations but target the same quality: movement speed expressed through sprints, rapid footwork, reaction tasks, and fast-contact drills. Having two versions allows coaches to alternate between sessions, preventing staleness while maintaining the speed development stimulus.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Motor-Literacy Circuit — Gymnastics & Agility", "desc": "A circuit blending gymnastic skills (rolls, cartwheels, bunny hops, handstand walks) with agility tasks (cone weaves, direction changes, reactive movement). Develops the broad movement competency that young karateka need — body control in space, spatial awareness, and the confidence to move the body through unusual positions. Also includes a gymnastics-only variant for sessions focused purely on body control.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Individual Karate Choreography (FIJILKAM)", "desc": "A solo karate choreography sequence from FIJILKAM (Italian Karate Federation). The athlete performs a pre-set sequence of karate techniques as a continuous, flowing routine — similar to a simplified kata but designed specifically for physical and technical assessment. Tests the athlete's ability to chain techniques smoothly, maintain rhythm, and express power and control across a varied movement sequence.", "chapter": "Motor-Literacy Circuits", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi with Hoop", "desc": "Horse stance (kiba dachi) practised with a hoop laid on the floor as a positional reference. The athlete places their feet at the edges of the hoop, ensuring the correct width and depth of the stance. The visual constraint self-corrects the common errors of too-narrow or too-wide stances without requiring constant verbal coaching. As proficiency increases, the hoop can be removed and the athlete is checked for retention of the correct width.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi with Roll", "desc": "Entering kiba dachi (horse stance) out of a forward or backward roll on the floor. The athlete rolls, then immediately settles into a stable horse stance on the rise. Trains the ability to recover a strong, grounded position from a dynamic transition — relevant for competition scenarios where balance is momentarily lost and must be instantly recovered.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Shiko Dachi Eccentric Strength", "desc": "Slow, controlled lowering into shiko dachi (square/sumo stance) over 5–10 seconds, emphasising the eccentric (lengthening) phase of the leg muscles. The athlete stands with feet wide and toes turned out, then sinks into the deepest position they can control, feeling the adductors, quads, and glutes work eccentrically. Builds the strength-at-range needed to hold deep stances under fatigue and to recover from low positions explosively.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi in Pairs", "desc": "Partner-resisted horse stance (kiba dachi) work. One athlete holds kiba dachi while the partner applies pushing, pulling, or perturbation forces from various angles. The athlete in the stance must maintain position against the disturbances. Develops the reactive stability and rooted quality that distinguish a functional stance from a static pose — in competition, stances must absorb and redirect forces, not just look correct.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi in 4 Directions", "desc": "Moving kiba dachi (horse stance) through the four cardinal directions: forward, backward, left, and right. The athlete must maintain correct stance depth, width, and posture while transitioning between directions. Trains the dynamic quality of the horse stance — the ability to move in it rather than only hold it statically. Develops the lateral and linear movement patterns used in basic kumite footwork.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Shiko Dachi with Roll", "desc": "Entering shiko dachi (square/sumo stance) out of a forward or backward roll. The athlete rolls, rises, and immediately settles into a stable shiko dachi. Similar principle to kiba dachi with roll but the wider, toes-out position of shiko dachi adds a greater hip-opening demand on the recovery. Trains stance recovery from the floor.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Kiba Dachi Star Jump, 4 Directions", "desc": "Star jumps (jumping jacks or explosive jumps with limbs extended) that land in kiba dachi (horse stance) facing each of the four cardinal directions. The athlete jumps, rotates in the air, and must settle into a solid horse stance on landing — combining explosive power with instant stance stability. Develops the ability to land in a strong, grounded position from a dynamic movement, directly applicable to the footwork-to-technique transitions in kumite.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Heisoku Dachi to Zenkutsu Dachi, 4 Directions", "desc": "From the feet-together stance, stepping into the front stance toward each of the four directions, left and right.", "chapter": "Dachi Waza — Stances", "group": "TRX Suspension Trainer"}, {"name": "Oi Tsuki in Zenkutsu Dachi (Partners)", "desc": "Lunge punch (oi-tsuki) practised in zenkutsu dachi (front stance) with a partner. The attacking athlete drives forward from the rear leg into a long front stance while extending the same-side arm in a straight punch. The partner provides a target or light resistance. The drill emphasises the connection between the leg drive and the punch — power must travel from the rear foot through the hip and into the fist as a single coordinated action.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Gedan Barai in Kiba Dachi (Partners)", "desc": "Downward sweeping block (gedan barai) practised from kiba dachi (horse stance) with a partner. The partner attacks low (chudan or gedan), and the defender sweeps the attack away with the forearm in a downward arc while maintaining a stable horse stance. Trains the block's correct trajectory (diagonal downward sweep, not a straight push) and the ability to generate blocking force from a wide, lateral stance.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Arm Techniques in Kiba Dachi", "desc": "A set of arm techniques from the horse stance — punch to the front, rising block left, outside block right, downward block to the rear.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Circuit — Kiba Dachi + Yoko Geri (Beginners)", "desc": "A circuit for beginners combining kiba dachi (horse stance) holds with yoko geri (side kick) repetitions. Stations alternate between stance endurance (hold kiba dachi for time) and kicking technique (side kicks from the stance). Builds the foundational connection between the stable base and the dynamic kick — the side kick is biomechanically launched from kiba dachi, so training them together reinforces the correct pattern.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Hold the Hoop — Mae Geri and Tsuki in Heisoku Dachi", "desc": "From heisoku dachi (feet-together stance), the athlete holds a hoop as a spatial reference while performing mae geri (front kick) and tsuki (punch) repetitions. The feet-together starting position forces the athlete to generate all forward momentum from the hip and core rather than relying on a wide stance. The hoop constrains the arm position, preventing the common beginner error of swinging the arms during kicks.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Age Uke Combination Sequences", "desc": "Linked rising-block sequences — e.g. age uke + gyaku + mae geri + shiko dachi + gedan barai, advancing and retreating, with neko-ashi and shuto variations.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Kihon Keri Waza with Support", "desc": "Basic kicking techniques (mae geri, mawashi geri, yoko geri) practised with external balance support — holding a wall, partner's shoulder, or barre. Removes the balance variable so the athlete can focus purely on kick mechanics: chamber position, extension trajectory, striking surface (koshi for front kick, sokuto for side kick, haisoku for roundhouse), and controlled retraction. Essential for beginners and for experienced athletes rebuilding technique after injury.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Weave Cones + Technique (Levels 0–5)", "desc": "A six-level progression weaving through cones and executing a technique — footwork plus basics, the higher levels in pairs.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Weave Cones (Children, July 2021)", "desc": "The cone-weaving footwork drill adapted for children's classes: simplified distances, lower speed expectations, and game-based elements (races, team relays) to maintain engagement. Children weave between cones using karate-relevant footwork patterns (forward stepping, lateral movement, pivoting) before executing a simple technique at the end. Builds basic agility and spatial awareness in a fun, age-appropriate format.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Hoops — Kiba Dachi: Oi Tsuki, Gedan Barai, Age Uke, Soto Uke", "desc": "Horse-stance drill cycling lunge punch, downward block, rising block and outside block across hoops.", "chapter": "Kihon — Basics", "group": "Various"}, {"name": "Turn Opponent Over", "desc": "A ne waza (ground work) drill where the athlete must turn a resisting opponent from a prone (face-down) position onto their back. Requires understanding of leverage, body positioning, and the use of hooks and frames to create the turning force. Develops the ground-fighting awareness that, while not the primary focus of WKF kumite, can occur after sweeps (ashi-barai) and takedowns in competition — particularly relevant under rules allowing follow-up techniques to grounded opponents.", "chapter": "Ne Waza — Ground Work", "group": "Rules"}, {"name": "Wrestle — Back-to-Back (Alternating & Level 2)", "desc": "A grappling game starting with both athletes back-to-back. On the signal, they turn and attempt to control, unbalance, or take down the other using wrestling-style gripping and body positioning. Develops reactive strength, positional awareness, and the physical courage to engage in close-range body contact — qualities that transfer to the close-range scrambles that occur in WKF kumite when two athletes clash inside fighting distance.", "chapter": "Ne Waza — Ground Work", "group": "Rules"}, {"name": "Wrestle — Variation 1", "desc": "A further ground-wrestling game variation beyond the back-to-back format. Different starting positions or rules (e.g., starting seated, starting with one athlete in guard, limited grip positions) create varied grappling challenges. Builds the general wrestling competence and body awareness that supports the throwing and sweeping techniques permitted in WKF kumite rules.", "chapter": "Ne Waza — Ground Work", "group": "Rules"}, {"name": "Plank on Forefists (Seiken)", "desc": "A plank held on the forefists — conditions the seiken (punching knuckles) and wrist alignment while training the core.", "chapter": "Uchi Waza — Arm Techniques", "group": "Rules"}, {"name": "Oi Tsuki — Grip the Hoop", "desc": "Oi-tsuki (lunge punch) drill using a hoop as both a grip and a target reference. The athlete grips the hoop in the punching hand and drives forward into the lunge punch, using the hoop to teach correct arm extension, alignment, and wrist position. The physical object in the hand provides tactile feedback that verbal coaching alone cannot — the athlete can feel whether the wrist is straight and the extension is complete.", "chapter": "Uchi Waza — Arm Techniques", "group": "Rules"}], "Keri Waza — Kicks": [{"name": "Side Kick on the Floor (simple & alternating)", "desc": "Lying/seated side-kick reps on the floor, single and alternating — isolating the kicking mechanics without balance demand.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side Kick to Ball on the Floor (Partners)", "desc": "Partners face each other seated on the floor. One holds a ball as a target. The kicking athlete executes yoko geri (side kick) from a seated/floor position, striking the ball with the blade of the foot (sokuto). Alternating legs. Develops kicking accuracy, hip-flexor strength, and the ability to generate lateral force from a low base — isolating the kick mechanics without the balance demands of standing. The floor position forces proper hip engagement since the athlete can't compensate with a forward lean.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side Kick in Pairs (Floor)", "desc": "Partnered yoko geri (side kick) practice performed from the floor. Both athletes sit or kneel facing each other, taking turns executing side kicks with control and precision. The floor eliminates the standing balance variable, allowing pure focus on hip rotation, chamber position, and the thrusting extension of the kick. Useful for beginners building the motor pattern and for advanced athletes isolating mechanical faults.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Standing Side Kick with Rotation", "desc": "Standing yoko geri (side kick) with full hip rotation driving through the kick. The athlete chambers the knee, rotates the supporting hip to align the body, and thrusts the kicking leg laterally with the hips fully turned over. The rotation is what generates penetrating power in yoko geri kekomi — without it, the kick lacks depth and force. Partner or bag can provide the target.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side Kick inside the Hoop", "desc": "Yoko geri (side kick) performed with the supporting foot placed inside a hoop laid on the floor. The hoop provides a spatial reference for foot placement and ensures the athlete doesn't drift forward or backward during the kick. Teaches positional discipline — the support foot must stay anchored within the hoop while the kicking hip rotates and the leg extends laterally. A constraint-led drill that self-corrects footwork without verbal coaching.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side Kick — Kiba Dachi Travel with Hoop (v1 & v2)", "desc": "Travelling yoko geri (side kick) series from kiba dachi (horse stance). The athlete moves laterally in kiba dachi, executing a side kick at each hoop marker, then resettling into the stance. Trains the transition from stable stance to dynamic kick and back — the ability to fire a technique mid-movement without losing base position. Hoops mark footwork targets, enforcing correct spacing and stance width.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side Kick over Hurdle", "desc": "Yoko geri (side kick) executed while clearing a low hurdle or obstacle. The hurdle forces a high knee chamber and proper lateral extension — the kick must travel over the obstacle to reach the target. Develops the upward-outward trajectory of the kick, prevents the common error of cutting the chamber short, and builds hip-flexor range under a dynamic demand.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Side-Kick Leg Balance (Partners)", "desc": "Holding the fully extended yoko geri (side kick) position with partner support for stability. The kicking leg is held at height (chudan or jodan) for timed holds — 10 to 30 seconds — while the partner provides light support at the ankle or shin. Builds isometric strength in the hip abductors and flexors at end range, trains the balance required to hold the kick in competition (for zanshin), and develops the muscular endurance to maintain the chamber under fatigue.", "chapter": "Keri Waza — Kicking Techniques", "group": "Yoko Geri — Side Kick"}, {"name": "Knee Raise — Transition to Mae Geri (v1 & v2)", "desc": "Isolating the knee chamber and its conversion into mae geri (front kick). The athlete lifts the knee to the chest in a tight chamber, holds briefly, then extends the kick with the ball of the foot (koshi) driving forward. The drill separates the two phases that beginners tend to blur: the vertical knee lift (chamber) and the horizontal kick extension. Ensuring a clean chamber prevents the common error of 'scooping' the kick from the ground.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mae Geri — Front Kick"}, {"name": "Front Kick to Ball on the Floor", "desc": "Mae geri (front kick) practised from a floor position, kicking toward a ball target. Removes the standing balance demand, isolating the hip-flexor engagement and kicking extension. Develops accuracy with the striking surface (koshi — ball of the foot) and the snapping retraction that characterises keage (snap kick) style. Useful for drilling repetitions when leg fatigue from standing work is high.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mae Geri — Front Kick"}, {"name": "Front Kick inside the Hoop", "desc": "Mae geri (front kick) with the supporting foot placed inside a hoop. The hoop constrains the base position — the athlete must maintain the support foot within the ring while chambering the knee and extending the kick forward. Teaches alignment: the kick must travel straight ahead from a stable base rather than drifting off-line. Self-correcting positional drill.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mae Geri — Front Kick"}, {"name": "Front-Kick Leg Balance (Partners)", "desc": "Holding the mae geri (front kick) extended position with partner support. The kicking leg is held at chudan or jodan height for timed holds while the partner stabilises at the ankle. Builds isometric hip-flexor and quadriceps strength at the end-range kick position, trains zanshin (maintaining the technique after execution), and develops the balance platform needed for follow-up techniques after the kick.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mae Geri — Front Kick"}, {"name": "Front Kick in Bridge", "desc": "Mae geri (front kick) executed from a back-bridge or bridge-like position on the floor. Extremely challenging for hip-flexor mobility and core control — the athlete must generate a forward kicking action from an extended-spine position. Develops the active range of motion in the hip flexors under an unusual demand, and builds the trunk control needed to kick from compromised positions.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mae Geri — Front Kick"}, {"name": "Mawashi Progression — Knee & Straight-Leg Raises", "desc": "A progression: knee raises and straight-leg raises building toward the roundhouse, including a version without the kick itself.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mawashi Geri — Roundhouse Kick"}, {"name": "Mawashi Geri Around a Partner", "desc": "The kicking athlete circles around a partner, executing mawashi geri (roundhouse kick) at various angles as they orbit. The partner stands as a reference point and may hold a pad at chudan or jodan height. Trains the ability to generate the roundhouse from different approach angles — not just the standard square-on position. Develops the hip rotation and pivot needed to fire mawashi geri while moving laterally, directly applicable to competition kumite where angles are constantly shifting.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mawashi Geri — Roundhouse Kick"}, {"name": "Mawashi Geri to Target with Ball Control", "desc": "A dual-task drill: the athlete must control a ball (with hands or feet) while simultaneously executing mawashi geri (roundhouse kick) to a target. The ball-control task occupies cognitive bandwidth, forcing the kick to become automatic rather than consciously directed. Develops the motor-learning quality of automaticity — making mawashi geri a reflexive action that can be executed while the brain is processing other information, as it must be in competition.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mawashi Geri — Roundhouse Kick"}, {"name": "Mawashi Geri to Ball at Distance (Partners)", "desc": "Partner holds a ball at a set distance, and the kicker must execute mawashi geri (roundhouse kick) to contact the ball cleanly. The distance forces proper maai (distancing) calculation — the kick must reach its full extension at exactly the point where the ball sits. Too close and the kick jams; too far and it whiffs. Trains the range-finding ability that determines whether a mawashi geri scores WAZA-ARI (chudan) or IPPON (jodan) in competition.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mawashi Geri — Roundhouse Kick"}, {"name": "Mawashi Geri — Knee Raise Only, in Hoops", "desc": "Isolating just the knee-chamber phase of mawashi geri (roundhouse kick), with hoops on the floor marking footwork positions. The athlete lifts the knee laterally to the chambered position (hip externally rotated, knee pointing to the side), holds briefly, then returns — without extending the kick. This isolates the chamber, which is the make-or-break moment of the roundhouse: a poor chamber produces a poor kick regardless of leg extension strength.", "chapter": "Keri Waza — Kicking Techniques", "group": "Mawashi Geri — Roundhouse Kick"}, {"name": "Ura Mawashi inside the Hoop (Trios)", "desc": "Ura mawashi geri (reverse roundhouse / hook kick) drilled in groups of three with a hoop laid on the floor as a positional reference. The support foot stays in or near the hoop while the kick arcs inward from outside to inside, striking with the sole of the foot or heel. The trio format allows continuous rotation: one kicks, one holds target, one rests. The hoop constrains footwork to prevent the common error of drifting backward during the reverse rotation.", "chapter": "Keri Waza — Kicking Techniques", "group": "Ura Mawashi Geri — Reverse Roundhouse"}, {"name": "Ura Mawashi with Squat (Partners)", "desc": "Combining a squat with ura mawashi geri (reverse roundhouse kick). The athlete performs a squat, then on the rise drives into the reverse roundhouse. The squat pre-loads the legs and forces the kick to be generated from a deep, stable base rather than from a shallow, tippy position. Builds the leg strength and hip mobility that make the reverse roundhouse powerful rather than decorative. Partner holds a target at jodan height.", "chapter": "Keri Waza — Kicking Techniques", "group": "Ura Mawashi Geri — Reverse Roundhouse"}, {"name": "Endurance — Keage and Yoko Geri", "desc": "Sustained high-repetition drilling of keage (snap kicks) and yoko geri (side kicks) for muscular and cardiovascular endurance. Continuous kicking for timed rounds (typically 30–60 seconds per set) without rest between kicks. Develops the hip-flexor and abductor stamina needed to maintain kick quality late in a training session or competition bout when fatigue degrades technique.", "chapter": "Keri Waza — Kicking Techniques", "group": "Various"}, {"name": "Yoko Geri and Mawashi Geri (Partners)", "desc": "Partnered combination drilling of yoko geri (side kick) and mawashi geri (roundhouse kick). Athletes alternate between the two kicks to a partner-held target, developing the ability to switch between a lateral thrust (yoko) and a circular arc (mawashi) without losing base position. Trains the hip rotation and re-chambering speed needed to chain different kick types in competition, where the opponent's movement dictates which kick angle is available.", "chapter": "Keri Waza — Kicking Techniques", "group": "Various"}], "Sport Kumite": [{"name": "Movement Speed — Unloaded / Weighted Vest / Elastic (resisted & assisted)", "desc": "The core footwork-speed series: stepping speed performed with no load, with a weighted vest, and with elastic resistance both opposing and assisting the movement — the contrast develops fast, controlled displacement.", "chapter": "Sport Kumite", "group": "Footwork"}, {"name": "Ladder — Kamae In-and-Out, Lateral (and with Guard Switch)", "desc": "Agility-ladder footwork from the fighting stance: lateral in-and-out steps, one version switching guard.", "chapter": "Sport Kumite", "group": "Footwork"}, {"name": "Cones — Simple Step-In Entry (and 2-Beat + Gyaku)", "desc": "Cone-based footwork drill for the basic kumite entry step. Cones mark start and target positions. The athlete practises the forward slide-step entry used to close distance before attacking. Version 1: single-step entry. Version 2: a two-beat entry (step-adjust-step) finished with gyaku-tsuki (reverse punch). Develops the controlled distance-closing that precedes every WKF scoring technique — the entry step must cover ground without telegraphing intent.", "chapter": "Sport Kumite", "group": "Footwork"}, {"name": "Oi-zuki Speed — Unloaded", "desc": "Lunge-punch (oi-zuki) speed repetitions performed without external load. From fighting kamae, the athlete drives forward with a committed lunge punch at maximum velocity, resets, and repeats. Pure speed work — no resistance bands, no weighted vest. Establishes the baseline movement speed against which loaded variations (elastic resisted, elastic assisted, weighted) are compared. Speed work must always include unloaded sets to prevent the nervous system from 'forgetting' what maximal velocity feels like.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Gyaku Speed — Elastic (resisted & assisted) and Weighted", "desc": "Reverse-punch speed with elastic opposing the punch, elastic assisting it, and with added weight — a contrast method for hand speed.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Gyaku Explosion", "desc": "Explosive reverse punch (gyaku-tsuki) repetitions from the fighting stance at absolute maximum effort. Each rep is a single, all-out gyaku-tsuki — full hip rotation, full extension, maximum acceleration. Short sets (3–5 reps) with full recovery between sets to maintain neural quality. Trains the rate of force development specific to the competition reverse punch — the ability to go from stationary kamae to full-speed gyaku in the shortest time possible.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Lateral Jump with Gyaku (v1 & v2)", "desc": "A lateral jump immediately combined with gyaku-tsuki (reverse punch) on landing. The athlete jumps sideways (changing angle), lands in kamae, and fires the reverse punch in one fluid action. Trains the ability to link footwork displacement to the striking action — in competition, athletes rarely punch from a static base. The lateral angle change makes the gyaku harder to read and defend. Two versions: v1 from open stance, v2 from closed/mirrored stance.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Plastron Reaction — Punch/Kick Combinations", "desc": "Reacting to a coach's body-shield cues with combinations: punch, punch+punch, punch+kick, kick+kick.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Kumite — Arm/Tsuki Circuit", "desc": "A circuit of punching stations for kumite training. Stations may include: kizami-tsuki to focus mitts, gyaku-tsuki to body shield, double-punch combinations, speed punches against resistance
