bands, and reaction punching to coach cues. Typically 30–45 seconds per station with 15 seconds transition. Develops both punching technique and the specific endurance to maintain hand speed through a full competition bout.", "chapter": "Sport Kumite", "group": "Arms"}, {"name": "Leg Speed — Unloaded / Elastic / Weighted", "desc": "Kicking-leg speed drilled with no load, with elastic, and with added weight (two unloaded versions).", "chapter": "Sport Kumite", "group": "Legs"}, {"name": "Geri Technique — Skill and Control", "desc": "Two-part kicking drill: the first part develops kicking skill (correct trajectory, chamber, extension, retraction), the second develops controlled accuracy (landing the kick precisely on a small target without excessive force). Addresses the WKF requirement that kicks must land with controlled contact — sun-dome distance of 5cm for foot techniques. A kick that is powerful but uncontrolled will not score; a kick that is accurate and controlled at the correct distance will.", "chapter": "Sport Kumite", "group": "Legs"}, {"name": "Mawashi Geri Technical Work & Reinforcement with Chair", "desc": "Roundhouse kick (mawashi geri) technique and strength drill using a chair for balance support. The athlete holds the back of a chair with one hand and performs slow, controlled mawashi geri repetitions with the free leg — focusing on hip rotation, knee chamber, extension, and retraction. The chair removes the balance variable, allowing pure technical focus. Also used as a strengthening exercise: slow-tempo kicks build the hip abductor and rotator endurance needed for sustained kicking quality.", "chapter": "Sport Kumite", "group": "Legs"}, {"name": "Mawashi and Ura Mawashi (Partners)", "desc": "Partnered drilling of mawashi geri (roundhouse kick) and ura mawashi geri (reverse roundhouse / hook kick). Athletes alternate between the two kick types to partner-held targets. Develops the ability to transition between a forward-rotating kick (mawashi) and a reverse-rotating kick (ura mawashi) — opposite hip actions that share the same initial chamber. In competition, chaining these two creates an unpredictable kicking sequence that is extremely difficult to defend.", "chapter": "Sport Kumite", "group": "Legs"}, {"name": "Geri Leg Circuit", "desc": "A circuit of kicking stations designed for leg technique and conditioning. Stations typically include: mae geri (front kick) to a pad, mawashi geri (roundhouse) to a target, yoko geri (side kick) to a shield, ura mawashi geri (hook kick) to a focus mitt, and speed kicks against elastic resistance. Timed rounds (30–45 seconds per station) with brief transitions. Builds kicking endurance and technical consistency across the full kicking vocabulary.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Plastron Reaction — Leg and Arm Attacks", "desc": "Coach holds plastrons (body shields) and presents them as cues for mixed attacks — the athlete must react with the appropriate technique depending on how the shield is presented. A shield held high and forward cues a punch; held laterally cues a kick; held at body level cues a body-shot combination. Trains the decision-making speed of selecting the right weapon (arm or leg) for the target, not just the reaction speed of executing a technique. Directly simulates the read-and-respond demands of WKF competition.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Kizami + Gyaku on the Ladder", "desc": "Jab (kizami-tsuki) and reverse punch (gyaku-tsuki) combination drilled while moving through an agility ladder. The athlete steps through the ladder using kumite footwork and fires the kizami → gyaku combination at each ladder square. Links hand technique to footwork in a structured, repeatable pattern. The ladder constrains step length and rhythm, preventing the common error of over-striding or under-striding when transitioning from movement to punch.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Zone Defence — Static", "desc": "Drilling defensive coverage of the WKF scoring zones from a stationary base. The coach calls or cues a target zone (jodan / chudan / gedan), and the athlete executes the corresponding defensive technique: jodan age-uke (rising block) or hand cover, chudan soto-uke or body rotation, gedan barai (downward sweep). Static = no footwork involved, isolating the upper-body defensive reactions. Builds the correct guard positions before adding movement complexity.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Zone Defence + Movement — Figure-of-Eight", "desc": "Zone defence combined with footwork tracing a figure-of-eight (infinity symbol) pattern on the tatami. The athlete moves in the figure-of-eight while responding to zone cues with the appropriate defensive technique. Adds the challenge of defending while in motion — directly replicating the WKF competition reality where defensive actions must happen during footwork, not from a static position. The figure-of-eight pattern trains multi-directional movement and prevents linear-only thinking.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Reaction to NKS Attack", "desc": "A reaction drill where the athlete must respond to a defined NKS (national karate squad) attack pattern. The attack is pre-set — the defender knows what's coming but not when. Trains the reaction speed to respond to a known threat, removing the decision variable and isolating pure reactive motor speed. Once the reaction time to the known pattern is fast enough, the drill progresses to randomised attack selection.", "chapter": "Sport Kumite", "group": "Basics & Defence"}, {"name": "Karate Rules — What Is Kumite (Olympic Committee)", "desc": "An educational reference video produced by the Olympic Committee explaining the rules and format of competition kumite: the scoring areas (head, body, back), the point values (YUKO 1pt for punches/strikes, WAZA-ARI 2pt for body kicks, IPPON 3pt for head kicks or techniques to downed opponents), match duration, and the senshu (first-score) advantage rule. Essential viewing for any athlete transitioning from club training to competition.", "chapter": "Sport Kumite", "group": "Rules"}, {"name": "Karate Rules — Kumite Scoring System (WKF)", "desc": "A reference video from the World Karate Federation (WKF) explaining the kumite scoring system in detail: what constitutes a valid score, the required controlled contact distance (sun-dome), the role of the judges, and the criteria for awarding or rejecting points. Covers the 2026 WKF rules including the 2cm hand / 5cm foot contact distance for seniors and the 5cm / 10cm distances for cadets and juniors.", "chapter": "Sport Kumite", "group": "Rules"}], "Playful Kumite & Games": [{"name": "Level 1 — One Attack, One Defence (Tsuki)", "desc": "The most basic exchange: a single punch and a single defence, in horse-stance movement. Punching technique work develops the speed, accuracy, and kinetic chain coordination specific to WKF scoring hand techniques. Kizami-tsuki (jab) and gyaku-tsuki (reverse punch) score YUKO (1 point) and account for the majority of competition scores.", "chapter": "Playful Kumite", "group": "Rules"}, {"name": "Level 2 — One Attack, One Defence (Tsuki Jodan)", "desc": "The same exchange directed to the head level. Punching technique work develops the speed, accuracy, and kinetic chain coordination specific to WKF scoring hand techniques. Kizami-tsuki (jab) and gyaku-tsuki (reverse punch) score YUKO (1 point) and account for the majority of competition scores.", "chapter": "Playful Kumite", "group": "Rules"}, {"name": "Level 3 — Jodan and Chudan Alternating", "desc": "Alternating head- and body-level attacks — adds target variation. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Playful Kumite", "group": "Rules"}, {"name": "Level 4 — Random Attack", "desc": "Unpredictable attacks — reactive defence and decision-making. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Playful Kumite", "group": "Rules"}, {"name": "Touch Game — Levels 1–3", "desc": "A three-level \"touch\" sparring game training distancing, timing and evasion through variables of target, evasion, footwork and defence.", "chapter": "Playful Kumite", "group": "Rules"}, {"name": "Agility Game — 3 Protect 4 Cones vs 1", "desc": "Three players defend four cones against one attacker — reactive agility and teamwork. Agility and cone drills develop the ability to change direction quickly under control — the same quality that determines ring movement, angle creation, and defensive evasion in kumite.", "chapter": "Games", "group": "Rules"}, {"name": "8 Cones, 3 in the Hoop Game", "desc": "A cone-collecting speed and decision game. Agility and cone drills develop the ability to change direction quickly under control — the same quality that determines ring movement, angle creation, and defensive evasion in kumite.", "chapter": "Games", "group": "Rules"}, {"name": "Noughts and Crosses (Running)", "desc": "A running tic-tac-toe relay — speed plus tactical decision-making. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Games", "group": "Rules"}, {"name": "Reaction Game — Catch Ball and Touch Body (v2)", "desc": "Catch a ball then touch a body part — reaction and coordination. Reaction training develops the visual-motor speed that governs the ability to read and respond to an opponent's actions — the perceptual foundation of all combat sports.", "chapter": "Games", "group": "Rules"}, {"name": "Manipulation Game — Place/Remove Cone with the Feet", "desc": "Foot-dexterity game moving a cone in and out of a hoop. Agility and cone drills develop the ability to change direction quickly under control — the same quality that determines ring movement, angle creation, and defensive evasion in kumite.", "chapter": "Games", "group": "Rules"}, {"name": "Rock-Paper-Scissors", "desc": "The hand game used as a reactive-decision starter for movement tasks. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Games", "group": "Rules"}, {"name": "Hands and Feet Game — Coordination", "desc": "A coordination game pairing hand and foot patterns. Game-based drills develop physical qualities (speed, agility, reaction, coordination) within a fun, competitive context that maintains engagement — particularly important for youth athletes whose attention and motivation thrive on play.", "chapter": "Games", "group": "Rules"}, {"name": "Speed Game — Cones (v2)", "desc": "A cone-based speed game. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Games", "group": "Rules"}, {"name": "Speed Game — Remove Pins from Cones", "desc": "A speed race removing pins from cones. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Games", "group": "Rules"}, {"name": "Locomotion & Manipulation — Place Pins in the Batons", "desc": "Combined movement and object-placement task. Part of a comprehensive karate exercise library spanning physical preparation, performance, and technique.", "chapter": "Games", "group": "Rules"}, {"name": "Speed Game — Place Pins on Cones", "desc": "A speed race placing pins onto cones. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Games", "group": "Rules"}, {"name": "Speed Game — Remove and Place Pins", "desc": "A speed game combining removing and placing pins. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Games", "group": "Rules"}, {"name": "Speed Session (Beginners, Jan 2020)", "desc": "A recorded beginners' speed session. Speed development work directly transfers to the explosive first step and rapid distance-closing ability that determines who scores first in a kumite exchange.", "chapter": "Games", "group": "Rules"}, {"name": "Ball on Cones Game", "desc": "A game manipulating a ball among cones. Agility and cone drills develop the ability to change direction quickly under control — the same quality that determines ring movement, angle creation, and defensive evasion in kumite.", "chapter": "Games", "group": "Rules"}, {"name": "Plank — Touch the Cones", "desc": "Plank position reaching to touch coloured cones — core stability with a cognitive/reaction element. Plank variations build the anti-movement core strength that prevents energy leaks during technique execution. A rigid trunk is the transmission system between the legs (power source) and the arms (delivery system) for every karate technique.", "chapter": "Games", "group": "Rules"}, {"name": "Human Skipping Game", "desc": "A group game in which players act as the \"rope\" for skipping. Jumping and hopping drills develop the reactive power and elastic energy system that powers explosive footwork, rapid direction changes, and the launching phase of kicks.", "chapter": "Games", "group": "Rules"}, {"name": "Snake Hoops Game — Laterality", "desc": "Footwork through a winding \"snake\" of hoops — trains laterality and foot placement. Game-based drills develop physical qualities (speed, agility, reaction, coordination) within a fun, competitive context that maintains engagement — particularly important for youth athletes whose attention and motivation thrive on play.", "chapter": "Games", "group": "Rules"}], "Wado-Ryu Drills": [{"name": "Kette Junzuki — Elastic Contrast (Unloaded / Resisted / Assisted)", "desc": "The first dan-grade basic technique drilled using the elastic contrast method. Three sets: (1) unloaded — full-speed kette junzuki from kamae, focusing on the stepping-punch coordination. (2) Elastic resisted — band around the waist anchored behind, forcing the athlete to drive harder through the step. (3) Elastic assisted — band anchored ahead, accelerating the step beyond normal speed. The contrast between resisted and assisted sets develops faster, more powerful stepping punches. 6 reps per set, full recovery between.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Kette Gyakuzuki — Elastic Contrast (Unloaded / Resisted / Assisted)", "desc": "The second dan-grade basic: stepping reverse punch drilled with the elastic contrast method. The band resistance loads the hip rotation that powers the gyaku-tsuki — the athlete must rotate harder against the band. The assisted set then lets the hip rotate faster than normal, reprogramming the nervous system for higher-velocity rotation. Directly addresses the gyaku-tsuki hip-drive that Wado-Ryu emphasises as central to power generation.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Nagashizuki Speed — Unloaded / Weighted Vest / Elastic", "desc": "The fifth dan-grade basic: the flowing/deflecting punch unique to Wado-Ryu. Drilled in three conditions: unloaded (pure speed), weighted vest (strength-speed under load), and elastic resistance (overloading the forward drive). Nagashi-zuki requires a simultaneous parry and counter — the contrast method develops the explosive forward commitment the technique demands while maintaining the deflecting hand's precision.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Surikomi Jodan Sokuto — Chair Support Technical Drill", "desc": "The eighth dan-grade basic: sliding side kick to head level. Using a chair for balance support (proven physical preparation methodology), the athlete practises the surikomi sliding entry and the high sokuto extension in slow, controlled repetitions. The chair removes the balance variable so the athlete can focus on: (1) the slide timing, (2) the hip rotation that drives the blade of the foot upward, (3) the full extension at jodan height. Build to unsupported once form is clean.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Jodan Mawashigeri — Hoop Chamber Drill", "desc": "The sixth dan-grade basic: jodan roundhouse kick. Using a hoop laid on the floor as a positional reference for the support foot, the athlete drills the lateral knee chamber and hip rotation that powers mawashi-geri to head height. The hoop constrains the pivot foot position — ensuring the athlete doesn't drift forward during the kick. Progress from chamber-only (knee raise to lateral position) to full extension at jodan height.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Chudan Ushirogeri — Wall Drive Progression", "desc": "The seventh dan-grade basic: mid-level back kick. Progressive drill using a wall: (1) Face the wall, hands on wall, chamber the knee and extend ushiro-geri backward with control — the wall provides stability. (2) Stand sideways to wall, one hand on wall, execute the full turning back kick. (3) Free-standing, full-speed ushiro-geri to a body shield held by a partner. The wall progression isolates the hip extension and heel-strike trajectory before adding the turn.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Taisabaki — Cone Evasion Circuit (Sokushin, Kaishin, Chinshin, Soremi, Hikimi)", "desc": "A circuit training all five Wado-Ryu taisabaki (body evasion) methods using cones as attackers. Station 1 (Sokushin): step sideways past a cone as partner swings a pool noodle. Station 2 (Kaishin): rotating evasion around a cone. Station 3 (Chinshin): drop the body under a horizontal pool noodle held at chest height. Station 4 (Soremi): lean upper body backward under a noodle at face height. Station 5 (Hikimi): evade middle/lower body backward. 30 seconds per station, 3 rounds. Builds all five evasion patterns as distinct motor skills.", "group": "Taisabaki & Principles", "chapter": "Wado-Ryu Drills"}, {"name": "Noru / Nagasu / Inasu — Partner Timing Drill", "desc": "Drilling the three core Wado-Ryu countering principles against a live partner. Partner attacks with junzuki at moderate speed. Defender practises: (1) NORU — ride the attack, intercept early, stay close and counter immediately. (2) NAGASU — let the attack flow past, parry and redirect, counter from the side. (3) INASU — evade entirely, drop or move around, counter from a new angle. Coach calls which principle before each exchange. Develops the tactical vocabulary that distinguishes Wado-Ryu from other styles.", "group": "Taisabaki & Principles", "chapter": "Wado-Ryu Drills"}, {"name": "Ayumi-ashi / Tsugi-ashi / Yori-ashi — Ladder Footwork", "desc": "All three fundamental Wado-Ryu footwork patterns drilled on an agility ladder. Ayumi-ashi (normal step) through the ladder squares. Tsugi-ashi (sliding step — rear foot catches up) along the ladder. Yori-ashi (simultaneous slide — both feet move together) laterally beside the ladder. Each pattern is drilled at walking speed first, then at combat tempo, then with a technique (junzuki, gyakuzuki) at each ladder exit. The ladder constrains step length and enforces the correct footwork rhythm.", "group": "Taisabaki & Principles", "chapter": "Wado-Ryu Drills"}, {"name": "Sanbon Gumite Preparation — Reaction Pad Drill", "desc": "Preparing for three-step sparring using pad reactions. Coach holds two pads representing jodan and chudan targets. Coach attacks three times at moderate speed (simulating the sanbon attacker); athlete performs the appropriate block sequence (e.g., chudan soto-uke, chudan soto-uke, chudan soto-uke) then fires a counter to the pad. Progress from pre-announced attacks (athlete knows the attack) to randomised (jodan or chudan on each step). Builds the defensive reactions needed for Sanbon Gumite with live timing rather than mechanical repetition.", "group": "Kumite Forms Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Kihon Kumite Ipponme — Isolated Kaishin Rotation", "desc": "Isolating the kaishin (rotating evasion) that defines the first Kihon Kumite. Without a partner, the athlete practises the rotation: from shizentai, the left foot slides forward and outward while the body rotates to avoid the punch line. A cone placed on the floor marks the attack line — the athlete must rotate far enough that the cone (representing the punch) passes the body. Once the rotation is automatic, add the nagashi-soto-uke and the nakadaka-ippon-ken counter. Then add a live partner attacking with tobikomizuki-jodan.", "group": "Kumite Forms Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Kihon Kumite Entry — Nijiri-ashi Cone Drill", "desc": "Drilling the nijiri-ashi (crawling foot) approach used at the start of every Ohyo Kumite and Kihon Kumite. Cones are set at the starting distance (approximately 2 metres apart). The attacker practises creeping forward with small, weighted slides, maintaining kamae throughout. The defender practises creeping backward, maintaining ma-ai. Coach signals 'go' at random — attacker launches the initial technique on the signal. Develops the tension, timing, and distance management that makes the kihon kumite opening realistic rather than mechanical.", "group": "Kumite Forms Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Ohyo Kumite Ipponme — Ashi-barai Isolation with Hoop", "desc": "Isolating the foot sweep that defines the first Ohyo Kumite. Using a hoop laid on the floor to mark the partner's foot position: the attacking athlete practises the ashi-barai sweep timing — the foot must contact the partner's support foot at the exact moment they are mid-step and their weight is committed. The hoop constrains the target zone. Progress from slow-motion partner work (partner steps deliberately) to combat-speed application. The sweep is the signature technique of Ohyo Kumite Ipponme and must be trained as a distinct skill.", "group": "Kumite Forms Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Renraku Waza Ipponme — Segmented Combination Drill", "desc": "Breaking down the first Renraku Waza (combination technique) into trainable segments. Segment 1: Okuriashi-uraken-chudan-jodan + gyakuzuki-chudan (the opening two techniques). Segment 2: Surikomi-ashi-barai-ushirogeri (sweep to back kick). Segment 3: Uraken-jodan + gyakuzuki-chudan (second uraken-gyaku pair). Segment 4: Migi-mawashigeri-gedan + hidari-mawashigeri-chudan (double roundhouse finish). Drill each segment 10 times, then chain segments 1+2, then 2+3, then 3+4, then the full combination. Avoids the common error of learning the whole sequence badly instead of each segment well.", "group": "Renraku Waza", "chapter": "Wado-Ryu Drills"}, {"name": "Renraku Waza — Speed Layering (Walk / Half / Full)", "desc": "All three Renraku Waza combinations drilled at three progressive speeds. Walk speed: each technique delivered slowly with emphasis on form, trajectory, and stance transitions — essentially a moving kata. Half speed: techniques delivered at 50% tempo, adding body connection and hip engagement. Full speed: combat tempo, emphasis on explosive transitions and kime on each technique. The speed layering prevents the common error of rushing to full speed before the pattern is clean. Walk speed reveals technical faults that full speed hides.", "group": "Renraku Waza", "chapter": "Wado-Ryu Drills"}, {"name": "Pinan Kata — Direction-Change Plyometric Drill", "desc": "A conditioning drill based on the direction changes in the Pinan kata series. The athlete performs explosive direction changes (180° and 90° turns with jumps) matching the embusen (floor pattern) of each Pinan kata, but without the techniques — just the footwork pattern at maximum explosive speed. Builds the rotational power, balance, and spatial awareness needed to perform the Pinan kata with speed and precision. Each Pinan has a distinct floor pattern — drill all five for comprehensive directional agility.", "group": "Kata Conditioning", "chapter": "Wado-Ryu Drills"}, {"name": "Kata Stance-Endurance Circuit", "desc": "A circuit of timed isometric holds in every stance used across the WIKF kata repertoire. Station 1: Junzuki-dachi (30s per side). Station 2: Gyakuzuki-dachi/Kokutsu-dachi (30s per side). Station 3: Neko-ashi-dachi (30s per side). Station 4: Kiba-dachi (30s). Station 5: Seishan-dachi (30s per side). Station 6: Shiko-dachi (30s). 3 rounds with 15 seconds transition between stations. Builds the leg endurance and positional strength to hold kata stances under the fatigue of a grading or competition performance.", "group": "Kata Conditioning", "chapter": "Wado-Ryu Drills"}, {"name": "Nage-Waza Entry — Kuzushi Partner Drill", "desc": "Drilling the kuzushi (balance-breaking) entries for Wado-Ryu's nine throwing techniques. Partner stands in natural stance. The thrower practises the entry — closing distance, creating the off-balancing grip or body contact, and disrupting the partner's centre of gravity — WITHOUT completing the throw. Focuses on the first 70% of the throw, which is where most failures occur. The throw itself is relatively simple once kuzushi is achieved. Drill entries for: Byobu Daoshi (folding-screen topple), Koma Nage (spinning-top), Kubi Wa (neck ring), progressing through all nine.", "group": "Nage-Waza Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Tsubame Gaeshi — Crash Mat Progression", "desc": "Progressive training for Tsubame Gaeshi (Swallow Reversal throw). Stage 1: partner attacks, thrower practises the entry and hip position on a crash mat without completing the throw. Stage 2: slow-speed execution onto the crash mat with partner cooperation. Stage 3: full-speed execution with committed attack and dynamic response. The crash mat removes the fear of falling that prevents committed practice of throwing techniques. Tsubame Gaeshi requires a fast, committed reversal — tentative practice produces tentative technique.", "group": "Nage-Waza Prep", "chapter": "Wado-Ryu Drills"}, {"name": "Tanto Dori — Reaction Drill with Foam Knife", "desc": "Reaction training for knife defence using a foam training knife. Partner attacks with randomised knife strikes (overhead, thrust, lateral slash) at increasing speed. Defender must identify the attack angle and execute the initial evasion/parry — WITHOUT completing the disarm technique. The foam knife allows realistic speed without injury risk. Develops the read-and-react skills that make tanto dori functional rather than choreographic. Progress from announced attacks to fully randomised.", "group": "Weapons Defence", "chapter": "Wado-Ryu Drills"}, {"name": "Tanto Dori — Wrist-Lock Isolation (Compliance Drill)", "desc": "Isolating the joint-locking and disarming finishes common across the 10 tanto dori sequences. Partner holds a foam knife in a static grip. The defender practises the wrist control, lever application, and disarm from a slow, controlled starting position. Emphasis on correct hand placement, leverage angle, and the body positioning that makes the lock effective. Each tanto dori ends with a control technique — these must be drilled separately from the evasion/entry phase to develop real competence.", "group": "Weapons Defence", "chapter": "Wado-Ryu Drills"}, {"name": "Idori — Seiza-to-Action Explosive Start Drill", "desc": "Developing the explosive transition from seiza (formal kneeling) to the defensive action required in Idori techniques. From seiza, on coach's signal, the athlete must rise to a defensive position as fast as possible. Timed with a stopwatch — measure improvement across sessions. The seated starting position is uniquely challenging because normal athletic readiness (bent knees, loaded legs) is absent. The drill builds the hip-flexor power and trunk control to generate defensive movement from a kneeling base.", "group": "Weapons Defence", "chapter": "Wado-Ryu Drills"}, {"name": "San Mi-Ittai — Three-Phase Counter Drill", "desc": "Drilling the three-body unity (ten-i, ten-tai, ten-gi) that defines Wado-Ryu's kihon kumite. Phase 1 (ten-i — position shift): partner attacks, defender shifts position only — no body turn, no technique. Phase 2 (ten-tai — body realignment): same attack, defender shifts AND rotates/realigns the body to reduce target area. Phase 3 (ten-gi — technique execution): same attack, defender shifts, realigns, AND executes the counter technique while the attack passes. Isolating each phase prevents the common error of jumping straight to technique without proper evasion.", "group": "Taisabaki & Principles", "chapter": "Wado-Ryu Drills"}, {"name": "Go no Sen / Sen no Sen / Sen Sen no Sen — Timing Ladder", "desc": "A progressive timing drill for the three Wado-Ryu timing tactics. Using the same attack (junzuki-chudan) from a partner: Round 1 (Go no Sen): defender blocks the attack AFTER it arrives, then counters. Round 2 (Sen no Sen): defender intercepts SIMULTANEOUSLY — technique and counter happen at the same time. Round 3 (Sen Sen no Sen): defender attacks BEFORE the opponent's technique completes. Each round represents a higher level of timing sophistication. The drill makes the abstract timing concepts concrete and measurable.", "group": "Taisabaki & Principles", "chapter": "Wado-Ryu Drills"}, {"name": "Kiba-dachi Stability — Partner Push Drill (Wado-Ryu Stances)", "desc": "Partner-resisted stance stability specifically for the Wado-Ryu stance repertoire. The athlete assumes each stance (junzuki-dachi, gyakuzuki-dachi, neko-ashi-dachi, kiba-dachi, seishan-dachi) while the partner applies pushing forces from all four directions. The athlete must maintain the stance without shifting feet. Develops the rooted quality that makes Wado-Ryu stances functional under the pressure of combat — stances must absorb and redirect force, not merely look correct.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}, {"name": "Empi-uchi Power — Medicine Ball Rotation Throw", "desc": "Developing the rotational power for empi-uchi (elbow strike) — a technique featured in multiple Wado-Ryu combinations and kata. Standing perpendicular to a wall, the athlete rotates explosively and throws a medicine ball against the wall, catching and repeating. The rotation pattern mimics the hip-driven elbow strike. Variations: parallel to wall (horizontal empi), facing wall (age-empi / rising elbow). The medicine ball provides resistance that overloads the rotation, building the power that makes empi strikes decisive.", "group": "Kihon Tsuki & Keri", "chapter": "Wado-Ryu Drills"}]};

## PART 1 — LINEAGE & HISTORY

### Hironori Ōtsuka (1892–1982)

- Born June 1, 1892, Shimodate City, Ibaragi, Japan
- Studied Shindō Yōshin-ryū Jūjutsu under Shinzaburō Nakayama Sensei (3rd Grand Master) from 1897
- Received Menkyo Kaiden (highest license) in Shindō Yōshin-ryū in 1920
- Studied Okinawan karate under Gichin Funakoshi from 1922, later also under Kenwa Mabuni and Chōki Motobu
- Registered "Wado-Ryū" officially in 1938
- Awarded "Meijin" (10th Dan) in 1972 by the International Martial Arts Federation
- Died January 29, 1982

Before his death, Ōtsuka requested Tatsuo Suzuki to help preserve the essence of Wado-Ryū. After Ōtsuka's son (Jirō) took over, technical inconsistencies in kata and technique began spreading internationally. Suzuki tried to reunify the organizations multiple times but was unsuccessful.

### Tatsuo Suzuki (1928–2011)

- Born April 27, 1928, Yokohama, Japan
- Began Wado-Ryū training in 1942 (age 14) under Kimura Sensei (one of Ōtsuka's top students)
- Direct instruction from Ōtsuka from 1945–1956 at Wado-Ryū HQ
- 3rd Dan at age 19 (1947)
- 5th Dan at age 24 (1951) — the highest grade in Wado-Ryū at that time
- 8th Dan and title "Hanshi" (Master) in 1975
- Also: 2nd Dan Tenshin Koryū Bō-jutsu, 1st Dan Judo, Zen study under Genpo Yamamoto and Sōyen Nakagawa
- Spread Wado-Ryū across Europe from 1963 onwards (London base from 1965)
- Founded WIKF (Wado Kokusai Karate-Dō Renmei) in 1991 to protect Ōtsuka's authentic teachings
- Appointed Jon Wicks as World Chief Instructor in 2009
- Died July 12, 2011

### Joaquim Gonçalves — WIKF Portugal

- Technical Director of AWIKP (Associação Wado Internacional Karate-do Portugal)
- Currently listed as 7th Dan on WIKF records
- Listed on wikf.com as responsible for Portugal ("Tony Goncalves")

### The WIKF Organization

The WIKF was founded to protect the teachings of Ōtsuka as transmitted through Suzuki. It is distinct from the Wado-Kai (under Jirō Ōtsuka / Hironori Otsuka II, later Kazutaka Otsuka / Hironori Otsuka III) and the Wadō-ryū Karate-dō Renmei. The WIKF considers itself the only organization that authentically preserves Suzuki's transmission of Ōtsuka's Wado-Ryū.

**World Technical Committee** — appointed by Suzuki in 2008 to ensure aligned and consistent standards.
**Current World Chief Instructor** — Jon Wicks (appointed by Suzuki in 2009).

## PART 2 — FOUNDATIONAL PRINCIPLES

### Dojo Kun (Rules of the Dojo)

1. **Reisetsu O Mamori** — Respect the Rules
2. **Shingi O Omanji** — A student must remain loyal to his Master
3. **Jojitsu Ni Oberezu** — Teachers and Students are not Equal
4. **Shinkenmi Ni Tesseyo** — Always apply yourself seriously

### Three Basic Principles of Wado-Ryū

1. **Mudana no Chikara** — No unnecessary force
2. **Mudana no Ugoki** — No unnecessary movement
3. **Mudana no Waza** — No unnecessary technique

### Timing Tactics (Kakete and Machite)

1. **Go no Sen** — Block the attack and immediately counter
2. **Sen no Sen** — Counter simultaneously with the attack
3. **Sen Sen no Sen** — Attack just before being attacked

### Taisabaki (Body Management)

Methods of evasion:

- **Sokushin** — Step sideways
- **Kaishin** — Rotating evasion (e.g., 1st Kihon Kumite)
- **Chinshin** — Drop the body (e.g., 8th Kihon Kumite)
- **Soremi** — Upper body backward (e.g., 4th Kihon Kumite)
- **Hikimi** — Evasion of middle and lower body (e.g., 5th Kihon Kumite)

### San Mi-Ittai (Three-Body Unity)

The Kihon Kumite are considered the best examples of san mi-ittai:

1. **Ten-i** — Shifting position, moving away from the attack
2. **Ten-tai** — Twisting/realigning the body to change its relation to the attack, reducing the exposed target area
3. **Ten-gi** — Executing technique while allowing the attack to pass

### Principles for Countering Attack

1. **Noru** — "To ride." Anticipate and stifle an attack before it is fully executed. Intercept at the beginning or middle. Stay close and pursue. Simultaneous or immediate counterattack.
2. **Nagasu** — "To let flow." Redirect rather than block. Parry and move with the attack. Let the attack pass the body. Stay within ma-ai for immediate counter.
3. **Inasu** — "To evade/deflect." Avoid or circumvent an attack. Often dropping the body to move under, inside, or around the attacker's technique.
4. **Irimi** — Move to enter, to come inside the opponent's technique to create an opening.

### Shu Ha Ri

- **Shu** — The beginner must correctly copy all techniques from the instructor
- **Ha** — After years of training and reaching high dan grade, the karateka may develop new techniques provided they are improvements (except for basic techniques)
- **Ri** — The highest form: after an even longer period, the karateka can execute all forms of karate automatically without conscious thought

### Kata no Rokugensoku (Six Principles of Kata)

These principles guide proper kata performance in the Suzuki/WIKF tradition.

### Kumite no Gogensoku (Five Principles of Kumite)

These principles guide proper kumite engagement in the Suzuki/WIKF tradition.

## PART 3 — KIHON (BASICS)

### Zones of the Body

- **Jodan** — Upper level (head/face)
- **Chudan** — Middle level (torso)
- **Gedan** — Lower level (below waist)

### Shisei (Stances)

The core stances of Wado-Ryū as taught in the WIKF:

- Shizentai (natural stance)
- Junzuki-dachi / Zenkutsu-dachi
- Gyakuzuki-dachi / Kokutsu-dachi
- Neko-ashi-dachi (cat stance)
- Kiba-dachi (horse stance)
- Seishan-dachi / Tate-seishan-dachi
- Hanmi-gamae (half-facing guard)
- Mahanmi (full side-facing)
- Shiko-dachi
- Yoi-dachi

### Ashi-sabaki (Footwork)

- **Ayumi-ashi** — Normal step
- **Tsugi-ashi** — Sliding step (rear foot catches up to advancing front foot)
- **Yori-ashi** — Sliding both feet simultaneously without changing stance width
- **Ushiro-mawari-ashi** — Turning backward
- **Hiki-ashi** — Sliding backward

### Tsuki-waza (Punching Techniques)

Jun-tsuki, Gyaku-tsuki, Tobikomi-tsuki, Yama-tsuki, Hasami-tsuki, Tetsui-tsuki, Mawashi-tsuki, Kagi-tsuki, Teishō-tsuki, Age-tsuki, Ura-tsuki, Nagashi-tsuki

### Uchi-waza (Striking Techniques)

Uraken-uchi, Tetsui-uchi, Haitō-uchi, Shutō-uchi, Teishō-uchi, Empi-uchi (various), Haito-uchi

### Geri-waza (Kicking Techniques)

Mae-geri, Yoko-geri (sokutō), Mawashi-geri, Ushiro-geri, Hiza-geri, Ashi-barai (foot sweeps)

### Uke-waza (Blocking/Deflecting Techniques)

Jōdan-uke, Soto-uke, Uchi-uke, Gedan-barai, Nagashi-uke, Sukui-uke, Shutō-uke, Osae-uke, Te-nagashi-uke

### Striking Surfaces

**Hand (Te):** Seiken, Ippon-ken, Nakadaka-ippon-ken, Uraken, Tetsui, Shutō, Haitō, Teishō, Nukite, Empi

**Foot (Ashi):** Koshi (ball of foot), Sokutō (blade of foot), Kakato (heel), Haisoku (instep), Hiza (knee)

## PART 6 — SANBON GUMITE (Three-Step Sparring)

## PART 7 — OHYO KUMITE (Applied Sparring) — 1 to 8

Ohyo Kumite is described as "applied sparring" — prearranged semi-free fighting sequences. The principle is to develop individual timing (as if free-fighting), as opposed to the coordinated timing found in Kihon Kumite. **Ohyo Kumite is a specialty of Tatsuo Suzuki Hanshi's WIKF organization.**

Both attacker and defender use **nijiri-ashi** (crawling foot) before engaging — the attacker creeps forward to close distance, the defender creeps backward to maintain ma-ai.

### Ohyo Kumite Ipponme

Demonstrates the foot-sweep tactic upon the opponent with a more rearward weighted stance. During the initial attack, the defender has been forced to retreat, but the intended technique must be of paramount importance.

## PART 8 — KIHON KUMITE (Fundamental Sparring) — 1 to 10

Kihon Kumite are prearranged fighting sequences that reflect the fundamental concepts of Wado-Ryū. They are considered the best examples of **san mi-ittai** (three-body unity: ten-i, ten-tai, ten-gi). Both attacker and defender use **nijiri-ashi** before engaging.

### Notes on Kata (per Suzuki Sensei)

Suzuki Sensei's philosophy on kata, in his own words paraphrased from WIKF documentation:

- Kata must have a living opponent in your mind. Suzuki would imagine an opponent who had harmed his family — this gives the kata life and genuine fighting spirit.
- Behind one enemy there are always three or four more. You must attack them all with that mindset.
- Wado kata is tight but has short movements. If not performed tightly, it is lost.
- Teaching only technique is insufficient. A student must imagine the opponent is present.
- Constant speed through all movements would mean death — the opponent would win. Tempo and timing, slow then fast, executed with spirit, give life to kata.
- Kata is not separate from kumite. Those who separate kata from fighting misunderstand karate.
- Competition kata has become more of a show than a fight. This is completely wrong.

## PART 16 — JAPANESE BUDO PRINCIPLES

These philosophical concepts form part of the WIKF theoretical knowledge:

- **Junanshin** — A pliable/moldable mind
- **Zanshin** — A total state of alertness/awareness
- **Kiai** — Spirit harmony (Ki = spirit, Ai = harmony)
- **Kime** — Control, decision
- **Metsuke** — Looking, seeing (visual awareness)
- **Ma-ai** — Distance (combative distance)
- **Muga Mushin** — An empty mind
- **Ri-ai** — Coherence, interconnection
- **Sei to Do** — Action and non-action
- **Yoyū** — Margin (having reserve)
- **Shisei** — Posture/attitude
- **Kanken** — Intuition and seeing
- **Fudōshin** — Immovable mind/spirit
- **Shu Ha Ri** — Protect/yield, reflect, depart
- **Misogi** — Purification

### Historical Samurai Maxims

- **Futanren** — Insufficient training
- **Mikuzure** — Fear because the enemy looks fierce and strong
- **Kikioji** — Fear before the fight because of the enemy's reputation

const KIHON_SECTIONS=[
{id:"stances",name:"Shisei — Stances",icon:"🦶",count:20,images:["stances_grid","foot_positions_1","foot_positions_2"],
techniques:[
{jp:"Heisoku-dachi",en:"Closed-foot stance",desc:"Feet together, toes touching. A formal attention stance used in bowing and at the start/end of kata."},
{jp:"Musubi-dachi (Fudo-Tai)",en:"Knot stance / Immovable body",desc:"Heels together, toes angled outward at roughly 45\u00b0. The standard ready position for bowing (rei)."},
{jp:"Hachiji-dachi (Shizentai / Yoi)",en:"Natural stance / Ready stance",desc:"Feet shoulder-width apart, toes slightly outward. The default natural posture and the starting position when called to attention (yoi)."},
{jp:"Zenkutsu-dachi (Junzuki-dachi)",en:"Forward stance",desc:"Long stance with front knee bent over the toes, back leg straight. Weight distribution approximately 60/40 front. The fundamental attacking stance in Wado-Ry\u016b, used for jun-tsuki (lunge punch) and many kata techniques."},
{jp:"Kokutsu-dachi (Gyakuzuki-dachi)",en:"Back stance",desc:"Weight shifted to the rear leg (roughly 70/30 back), front foot forward on the ball of the foot, rear knee bent. Used for gyaku-tsuki (reverse punch) and defensive techniques where retreating or shifting weight backward."},
{jp:"Neko-ashi-dachi",en:"Cat stance",desc:"Almost all weight on the bent rear leg, front foot rests lightly on the ball. Three variations exist: Ma-hanme (half-facing forward), Hanme (side-facing), and Shomen (square-facing). Allows instant front-leg kicks without weight transfer."},
{jp:"Kiba-dachi",en:"Horse-riding stance",desc:"Wide lateral stance with both knees bent, feet parallel, weight centred. Wider than Naihanchi-dachi. Develops leg strength and stability. Used in kata and conditioning drills."},
{jp:"Naihanchi-dachi",en:"Naihanchi stance",desc:"A medium-width lateral stance with feet parallel and knees pressed outward. More compact than kiba-dachi. The foundational stance of the Naihanchi kata."},
{jp:"Seishan-dachi",en:"Seish\u0101n stance",desc:"An hourglass-shaped stance with feet turned slightly inward, knees driven together. Two forms: Yoko (lateral) and Tate (linear). Develops inner-thigh tension and is the primary stance of Seish\u0101n kata."},
{jp:"Shiko-dachi",en:"Sumo stance",desc:"Wide, deep squat stance with feet turned outward at 45\u00b0. Similar to kiba-dachi but with externally rotated feet. Associated with classical Japanese wrestling posture."},
{jp:"Soeashi-dachi",en:"Accompanying-foot stance",desc:"One foot placed alongside the other in an L-shaped configuration. Appears in Pinan Yodan and other kata during transitional movements."},
{jp:"Kosa-dachi",en:"Cross-legged stance",desc:"One foot crosses behind the other. A transitional stance seen in Wansh\u016b and other advanced kata. Requires strong balance and is typically held only briefly."},
{jp:"Jigo-tai",en:"Defensive body posture",desc:"A low, wide, stable posture used in defensive situations. Seen in the opening of K\u016bshank\u016b kata. Weight evenly distributed, centre of gravity lowered."},
{jp:"Heiko-dachi",en:"Parallel stance",desc:"Feet parallel, shoulder-width apart. Two orientations: Yoko (lateral) and Tate (linear). A neutral ready position used in certain kata openings."},
{jp:"Teiji-dachi",en:"T-stance",desc:"Feet form a T-shape with the rear foot perpendicular to the front. A transitional stance providing stability while allowing quick direction changes."},
{jp:"Katashi-dachi",en:"Single-leg stance",desc:"Standing on one leg. Seen prominently in Chint\u014d kata. Demands exceptional balance and core stability. The raised knee provides protection and readiness for kicking."},
{jp:"Lenoji-dachi",en:"L-stance",desc:"Feet in an L-shape with right or left foot forward in a natural (shizentai) position. A transitional stance used in movement and turning."},
{jp:"Hanmi-gamae",en:"Half-body fighting posture",desc:"The standard Wado-Ry\u016b fighting stance — body turned roughly 45\u00b0 to reduce the target area, lead hand forward, rear hand at the hip or guard. Weight balanced for quick movement in any direction."},
{jp:"Mahanmi-gamae",en:"Full half-body posture",desc:"Body turned further to the side than hanmi, presenting the smallest possible target. Used in specific defensive applications and in competition kumite."},
{jp:"Hidari gamae / Migi gamae",en:"Left guard / Right guard",desc:"The standard guard positions with left or right side forward. Hidari gamae (left forward) is the orthodox stance; migi gamae (right forward) is the southpaw equivalent."}
]},
{id:"punches",name:"Tsuki-waza — Punches",icon:"👊",count:12,images:["tsuki_waza"],
techniques:[
{jp:"Jun-tsuki",en:"Lunge punch",desc:"A straight punch delivered with the lead hand while stepping forward in zenkutsu-dachi. The most fundamental punch in Wado-Ry\u016b. Power comes from the forward momentum of the step combined with hip rotation."},
{jp:"Gyaku-tsuki",en:"Reverse punch",desc:"A straight punch delivered with the rear hand from a stationary or shifting stance. The hip rotates to drive the punch forward. The primary counter-attacking technique in Wado-Ry\u016b."},
{jp:"Tobikomi-tsuki",en:"Jumping-in punch",desc:"A lunging punch that closes distance rapidly with a sliding or leaping entry. Used as an attacking technique in kihon kumite and competition. Requires committed forward movement."},
{jp:"Yama-tsuki",en:"Mountain punch / U-punch",desc:"A simultaneous double punch — one to j\u014ddan (upper level) and one to ch\u016bdan (middle level). The hands form a mountain shape. Used in kata and close-range combat."},
{jp:"Hasami-tsuki",en:"Scissor punch",desc:"Two simultaneous punches from opposite sides, converging on the target like scissors. A close-range technique targeting both sides of the opponent's body."},
{jp:"Tetsui-tsuki",en:"Hammer-fist punch",desc:"A downward or sideways strike using the bottom of the closed fist (tetsui). Delivered in a punching motion rather than a swinging arc. Effective at close range."},
{jp:"Mawashi-tsuki",en:"Roundhouse punch",desc:"A circular punch following a hook-like trajectory. Targets the side of the opponent's head or body. Less common in traditional Wado-Ry\u016b but appears in certain applications."},
{jp:"Kagi-tsuki",en:"Hook punch",desc:"A short, tight hook delivered at close range. The elbow stays bent at approximately 90\u00b0 and the fist travels in a horizontal arc. Used in infighting situations."},
{jp:"Teish\u014d-tsuki",en:"Palm-heel thrust",desc:"A straight thrusting strike using the palm heel (teish\u014d). The fingers are pulled back and the wrist extended to expose the heel of the palm. Useful when punching risks hand injury."},
{jp:"Age-tsuki",en:"Rising punch",desc:"An upward punch targeting the chin or solar plexus from below. The fist travels in a rising arc. Effective against a taller opponent or when inside the opponent's guard."},
{jp:"Ura-tsuki",en:"Close punch / Inverted punch",desc:"A short punch delivered palm-up at close range, typically to the body. The fist remains in the inverted position rather than rotating. A tight, close-quarters technique."},
{jp:"Nagashi-tsuki",en:"Flowing/deflecting punch",desc:"A punch delivered simultaneously with a body shift that deflects the opponent's attack. Exemplifies the Wado-Ry\u016b principle of simultaneous defence and counter-attack. Demonstrated across 6 steps in the WIKF technical reference."}
]},
{id:"strikes",name:"Uchi-waza — Strikes",icon:"🤚",count:9,images:["uchi_waza"],
techniques:[
{jp:"Uraken-uchi",en:"Back-fist strike",desc:"A snapping strike using the back of the knuckles. Typically delivered in a whipping motion to the face or temple. One of the fastest hand techniques, frequently used in competition kumite."},
{jp:"Tetsui-uchi",en:"Hammer-fist strike",desc:"A strike using the bottom edge of the closed fist in a swinging or hammering arc. More powerful than uraken due to the heavier impact surface and longer arc."},
{jp:"Hait\u014d-uchi",en:"Ridge-hand strike",desc:"A strike using the inner edge of the hand (opposite to the knife-hand). The thumb is tucked in. Targets the temple, neck, or ribs with the inside edge of the hand between the thumb and index finger."},
{jp:"Shut\u014d-uchi",en:"Knife-hand strike",desc:"A strike using the outer edge of the open hand. One of the most recognisable karate techniques. Can be delivered inward or outward, targeting the neck, collarbone, or temple."},
{jp:"Mawashi empi-uchi",en:"Roundhouse elbow strike",desc:"A circular elbow strike travelling in a horizontal arc. Extremely powerful at close range. The elbow is one of the hardest striking surfaces on the body."},
{jp:"Otoshi empi-uchi",en:"Downward elbow strike",desc:"A dropping elbow strike targeting the crown of a bent opponent's head or the back. Delivered by driving the elbow downward with the body's weight behind it."},
{jp:"Tate empi-uchi",en:"Vertical elbow strike",desc:"An upward or vertical elbow strike, typically targeting the chin from below. The fist rises toward the own shoulder as the elbow drives upward."},
{jp:"Ushiro empi-uchi",en:"Rear elbow strike",desc:"An elbow strike directed behind the body. Used when the opponent is directly behind or has grabbed from behind. The elbow drives straight backward into the solar plexus or ribs."},
{jp:"Teish\u014d-uchi",en:"Palm-heel strike",desc:"An open-hand strike using the heel of the palm. Similar to teish\u014d-tsuki but delivered in a swinging arc rather than a straight line."}
]},
{id:"kicks",name:"Geri-waza — Kicks",icon:"🦵",count:10,images:["geri_waza","ashi_barai"],
techniques:[
{jp:"Mae-geri",en:"Front kick",desc:"A straight kick to the front using the ball of the foot (koshi). The knee drives upward first, then the lower leg extends to strike. The fundamental kicking technique. Can target ch\u016bdan or j\u014ddan."},
{jp:"Mawashi-geri",en:"Roundhouse kick",desc:"A circular kick travelling in a horizontal arc, striking with the instep (haisoku) or ball of the foot (koshi). The hip rotates to generate power. The most commonly used kick in competition kumite."},
{jp:"Ushiro-geri",en:"Back kick",desc:"A straight kick delivered rearward, striking with the heel (kakato). The body pivots and the kicking leg extends directly behind. Powerful but requires awareness of the target without visual contact."},
{jp:"Yoko-geri",en:"Side kick",desc:"A lateral kick using the blade of the foot (sokut\u014d). The kicking leg drives out to the side with the hips thrust toward the target. Can be delivered as a snap kick (keage) or thrust kick (kekomi)."},
{jp:"Sokuto fumikomi",en:"Stamping side kick",desc:"A driving stamp kick using the blade of the foot, directed downward at the opponent's knee or shin. A destructive technique aimed at the opponent's base."},
{jp:"Hiza-geri",en:"Knee kick/strike",desc:"A close-range strike using the knee. Typically driven upward into the opponent's body when grappling distance has been closed. Extremely powerful due to the short range and heavy bone."},
{jp:"Mae tobi-geri",en:"Jumping front kick",desc:"A front kick delivered while airborne. The practitioner jumps and executes mae-geri at the peak of the jump. Adds height and forward momentum to the kick."},
{jp:"Kakato-geri",en:"Heel kick / Axe kick",desc:"A downward kick using the heel, delivered in a crescent-like arc from high to low. The leg rises high and the heel drops onto the opponent's shoulder, collarbone, or head."},
{jp:"Ura mawashi-geri",en:"Reverse roundhouse / Hook kick",desc:"A circular kick travelling in the reverse direction to mawashi-geri, striking with the heel or sole of the foot. The leg hooks around the opponent's guard from the outside."},
{jp:"Komura ashi-barai",en:"Calf sweep",desc:"A foot sweep using the sole of the foot to sweep the opponent's supporting leg. Timing is critical — the sweep must connect when the opponent's weight is committed to the targeted leg."}
]},
{id:"blocks",name:"Uke-waza — Blocks",icon:"🛡️",count:22,images:["uke_waza_1","uke_waza_2"],
techniques:[
{jp:"J\u014ddan-uke",en:"Upper-level block",desc:"A rising block that deflects attacks to the head. The forearm sweeps upward to intercept a descending or straight attack to j\u014ddan. The most basic upper-level defence."},
{jp:"Gedan-barai",en:"Downward sweep",desc:"A sweeping block directed downward to deflect kicks and low punches. The arm sweeps from the opposite shoulder across the body and down. Fundamental lower-level defence."},
{jp:"Hiji-uke",en:"Elbow block",desc:"A block using the elbow. Effective at close range where there isn't space for a full forearm block. The compact movement makes it fast and hard to read."},
{jp:"Soto-uke",en:"Outside-inward block",desc:"A forearm block that sweeps from outside the body inward, deflecting a mid-level attack across the centreline. One of the three fundamental ch\u016bdan blocks."},
{jp:"Uchi-uke",en:"Inside-outward block",desc:"A forearm block that sweeps from inside the body outward, pushing the attack away from the centreline. The mirror principle to soto-uke."},
{jp:"Shut\u014d-uke",en:"Knife-hand block",desc:"A block using the open knife-hand (shut\u014d) to deflect attacks. More refined than the closed-fist blocks. Appears prominently in kata and leads naturally into grabbing or trapping."},
{jp:"Jiji-uke",en:"Cross block",desc:"Both forearms cross in front of the body to form an X-shaped block. Used against powerful attacks when a single-arm block may be insufficient. Appears in several kata."},
{jp:"Uke gedan-barai",en:"Receiving downward sweep",desc:"A variation of gedan-barai emphasising the receiving/deflecting aspect rather than a hard block. Follows the Wado principle of using minimum force."},
{jp:"Mikazuki geri-uke",en:"Crescent kick block",desc:"Using a crescent-shaped kick motion to deflect an incoming attack — the foot sweeps in an arc to knock aside the opponent's technique. An advanced defensive application of kicking."},
{jp:"Morote soto-uke",en:"Double-handed outside block",desc:"A reinforced outside block using both hands. The support hand backs the blocking forearm for extra strength against powerful attacks."},
{jp:"Nagashi-uke",en:"Flowing/sweeping block",desc:"A soft, redirecting block that guides the attack past the body rather than stopping it. Embodies the Wado-Ry\u016b principle of not opposing force with force. Used in kihon kumite."},
{jp:"Shut\u014d uke gedan",en:"Knife-hand low block",desc:"A downward knife-hand block targeting low-level attacks. The open hand sweeps downward to deflect kicks or low punches."},
{jp:"Teish\u014d awase-uke",en:"Combined palm-heel block",desc:"Both palm heels pressed together to form a combined blocking surface. Used in kata against strong frontal attacks."},
{jp:"Teish\u014d-uke",en:"Palm-heel block",desc:"A single palm-heel block. The heel of the open palm intercepts and redirects the attack. Less rigid than forearm blocks, allowing fluid transitions to counter-attack."},
{jp:"Kake-uke",en:"Hooking block",desc:"A hooking action that catches and controls the opponent's attacking limb. Transitions naturally from block into lock or throw — characteristic of Wado-Ry\u016b's jujutsu heritage."},
{jp:"Mawashi uke (Tora-guchi)",en:"Circular block / Tiger mouth",desc:"A large circular block using both hands in a flowing, round motion. Also called tora-guchi (tiger mouth) due to the hand shape. A kata technique for blocking and simultaneously trapping."},
{jp:"Teish\u014d morote-uke",en:"Double palm-heel block",desc:"A reinforced palm-heel block using both hands. The secondary hand supports the primary blocking hand for additional power."},
{jp:"Sukomen awase-uke",en:"Combined side-face block",desc:"A combined blocking technique protecting the side of the face. Uses both arms in coordination to cover the vulnerable temple and jaw area."},
{jp:"Manji-uke",en:"Manji block",desc:"A simultaneous double block — one arm blocks j\u014ddan (high) while the other blocks gedan (low). Named after the manji (swastika) symbol due to the arm positions. Appears in Pinan kata."},
{jp:"Haishu-uke",en:"Back-hand block",desc:"A block using the back of the open hand. A softer deflection that allows quick transition to grabbing. The receiving surface is the dorsal side of the hand."},
{jp:"Osae-uke",en:"Pressing block",desc:"A pressing/pushing block that pushes the attack downward or to the side. Rather than sweeping, the hand presses against the attacking limb to redirect it. Used in combination techniques."},
{jp:"Soto harai-uke",en:"Outside sweeping block",desc:"An outside sweeping block that brushes the attack away from the body in a broad sweeping motion. Effective against wide or powerful attacks."}
]},
{id:"surfaces",name:"Striking Surfaces",icon:"✋",count:25,images:["striking_surfaces_hand","striking_surfaces_foot"],
techniques:[
{jp:"Seiken",en:"Fore-fist",desc:"The front face of the closed fist, using the knuckles of the index and middle fingers. The primary punching surface. The wrist must be straight and aligned with the forearm."},
{jp:"Uraken",en:"Back-fist",desc:"The back of the knuckles. Used in snapping strikes (uraken-uchi) to the face and temple."},
{jp:"Tetsui",en:"Hammer-fist / Iron hammer",desc:"The bottom edge of the closed fist, opposite the thumb side. A robust striking surface that can absorb heavy impact without injury."},
{jp:"Ippon-ken",en:"Single-knuckle fist",desc:"The fist with the index finger knuckle protruding. Targets small, precise areas such as the space between the ribs or the philtrum. Used in kihon kumite counters."},

/* ─── Swipe-back hook ─── */
function useSwipeBack(onBack,enabled){
  const ref=useRef({startX:0,startY:0,tracking:false});
  useEffect(()=>{
    if(!enabled) return;
    const onStart=e=>{
      const t=e.touches[0];
      if(t.clientX<30){ref.current={startX:t.clientX,startY:t.clientY,tracking:true};}
      else{ref.current.tracking=false;}
    };
    const onMove=e=>{
      if(!ref.current.tracking) return;
      const t=e.touches[0];
      const dx=t.clientX-ref.current.startX;
      const dy=Math.abs(t.clientY-ref.current.startY);
      if(dx>10&&dy<dx){e.preventDefault();}
    };
    const onEnd=e=>{
      if(!ref.current.tracking) return;
      const t=e.changedTouches[0];
      const dx=t.clientX-ref.current.startX;
      const dy=Math.abs(t.clientY-ref.current.startY);
      if(dx>70&&dy<dx*1.5){onBack();}
      ref.current.tracking=false;
    };
    document.addEventListener("touchstart",onStart,{passive:true});
    document.addEventListener("touchmove",onMove,{passive:false});
    document.addEventListener("touchend",onEnd,{passive:true});
    return ()=>{
      document.removeEventListener("touchstart",onStart);
      document.removeEventListener("touchmove",onMove);
      document.removeEventListener("touchend",onEnd);
    };
  },[onBack,enabled]);
}

function HistoryDetailView({id,onMenu,onHome}){
  const page=HISTORY_PAGES.find(h=>h.id===id);
  if(!page) return <PageShell title="Not Found" onMenu={onMenu} onHome={onHome}><p style={{color:"#666"}}>Page not found.</p></PageShell>;
  const C={otsuka:"Born June 1, 1892, Shimodate City, Ibaragi, Japan. Studied Shind\u014D Y\u014Dshin-ry\u016B J\u016Bjutsu under Shinzabur\u014D Nakayama Sensei (3rd Grand Master) from 1897. Received Menkyo Kaiden (highest license) in 1920. Studied Okinawan karate under Gichin Funakoshi from 1922, later under Kenwa Mabuni and Ch\u014Dki Motob\u016B. Registered \"Wado-Ry\u016B\" officially in 1938. Awarded \"Meijin\" (10th Dan) in 1972. Died January 29, 1982.\n\nBefore his death, \u014Ctsuka requested Tatsuo Suzuki to help preserve the essence of Wado-Ry\u016B.",suzuki:"Born April 27, 1928, Yokohama, Japan. Began Wado-Ry\u016B training in 1942 (age 14) under Kimura Sensei. Direct instruction from \u014Ctsuka from 1945\u20131956. 3rd Dan at age 19 (1947). 5th Dan at age 24 (1951) \u2014 highest grade in Wado-Ry\u016B at that time. 8th Dan and title \"Hanshi\" in 1975.\n\nAlso held: 2nd Dan Tenshin Kory\u016B B\u014D-jutsu, 1st Dan Judo, Zen study under Genpo Yamamoto and S\u014Dyen Nakagawa.\n\nSpread Wado-Ry\u016B across Europe from 1963 onwards (London base from 1965). Founded WIKF in 1991 to protect \u014Ctsuka's authentic teachings. Appointed Jon Wicks as World Chief Instructor in 2009. Died July 12, 2011.",wikf:"The WIKF (Wado Kokusai Karate-D\u014D Renmei) was founded in 1991 to protect the teachings of \u014Ctsuka as transmitted through Suzuki. It is distinct from the Wado-Kai and the Wad\u014D-ry\u016B Karate-d\u014D Renmei.\n\nWorld Technical Committee \u2014 appointed by Suzuki in 2008 for aligned, consistent standards.\n\nCurrent World Chief Instructor \u2014 Jon Wicks (appointed by Suzuki in 2009).",awikp:"Joaquim Gon\u00E7alves \u2014 Technical Director of AWIKP (Associa\u00E7\u00E3o Wado Internacional Karate-do Portugal). Currently 7th Dan on WIKF records.\n\nBegan Wado-Ry\u016B on November 3, 1989 at Clube de Karate Wado-Ryu de Braga. Initial instruction under Sensei Jos\u00E9 Lezon (1st Kyu), national technical direction under Sensei Fernando Su\u00EDssas (2nd Dan), international direction under Tatsuo Suzuki (8th Dan Hanshi).\n\nDegree in Sports Science and Physical Education from the University of Coimbra (1998). National Team Selector for FNK-P. Trained directly under Suzuki Sensei."};
  return <PageShell title={page.name} subtitle={page.dates} accent="#f4a261" onMenu={onMenu} onHome={onHome}>
    <div style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"1rem",marginTop:"0.5rem"}}>
      {(C[id]||"Content coming in Phase 4A.").split("\n\n").map((p,i)=><p key={i} style={{color:"#b0aead",fontSize:"0.95rem",lineHeight:1.75,marginBottom:"0.8rem"}}>{p}</p>)}
    </div>
    <div style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"1.2rem",marginTop:"0.8rem",textAlign:"center"}}><div style={{fontSize:"2.5rem",marginBottom:"0.4rem"}}>📷</div><p style={{color:"#555",fontSize:"0.85rem"}}>Photos from the WIKF Belgium Handbook coming in Phase 4A</p></div>
  </PageShell>
}

function PrinciplesView({onNav,onMenu,onHome}){
  return <PageShell title="Principles & Philosophy" subtitle={"The philosophical foundation of Wado-Ry\u016B"} accent="#f4a261" onMenu={onMenu} onHome={onHome}>
    <div style={{display:"grid",gridTemplateColumns:"1fr",gap:"0.5rem",marginTop:"0.5rem"}}>{PRINCIPLES_PAGES.map(p=><button key={p.id} onClick={()=>onNav({type:"principleDetail",id:p.id})} style={{width:"100%",background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"1rem",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:"0.8rem",borderLeft:"4px solid #f4a261"}}>
      <span style={{fontSize:"1.3rem",flexShrink:0}}>{p.icon}</span><div><div style={{fontWeight:700,fontSize:"1rem",color:"#f0eeeb"}}>{p.name}</div><div style={{fontSize:"0.82rem",color:"#666",marginTop:"0.1rem"}}>{p.desc}</div></div>
    </button>)}</div>
  </PageShell>
}

function PrincipleDetailView({id,onMenu,onHome}){
  const page=PRINCIPLES_PAGES.find(p=>p.id===id);
  if(!page) return <PageShell title="Not Found" onMenu={onMenu} onHome={onHome}><p style={{color:"#666"}}>Page not found.</p></PageShell>;
  const C={"dojo-kun":"1. Reisetsu O Mamori \u2014 Respect the Rules\n2. Shingi O Omanji \u2014 A student must remain loyal to his Master\n3. Jojitsu Ni Oberezu \u2014 Teachers and Students are not Equal\n4. Shinkenmi Ni Tesseyo \u2014 Always apply yourself seriously","three-principles":"1. Mudana no Chikara \u2014 No unnecessary force\n2. Mudana no Ugoki \u2014 No unnecessary movement\n3. Mudana no Waza \u2014 No unnecessary technique","san-mi-ittai":"The Kihon Kumite are considered the best examples of san mi-ittai:\n\n1. Ten-i \u2014 Shifting position, moving away from the attack\n2. Ten-tai \u2014 Twisting/realigning the body to change its relation to the attack, reducing the exposed target area\n3. Ten-gi \u2014 Executing technique while allowing the attack to pass","taisabaki":"Methods of body evasion:\n\nSokushin \u2014 Step sideways\nKaishin \u2014 Rotating evasion (e.g., 1st Kihon Kumite)\nChinshin \u2014 Drop the body (e.g., 8th Kihon Kumite)\nSoremi \u2014 Upper body backward (e.g., 4th Kihon Kumite)\nHikimi \u2014 Evasion of middle and lower body (e.g., 5th Kihon Kumite)","timing":"1. Go no Sen \u2014 Block the attack and immediately counter\n2. Sen no Sen \u2014 Counter simultaneously with the attack\n3. Sen Sen no Sen \u2014 Attack just before being attacked","shu-ha-ri":"Shu \u2014 The beginner must correctly copy all techniques from the instructor\n\nHa \u2014 After years of training and reaching high dan grade, the karateka may develop new techniques provided they are improvements (except for basic techniques)\n\nRi \u2014 The highest form: after an even longer period, the karateka can execute all forms of karate automatically without conscious thought","kata-principles":"The six principles (Rokugensoku) guide proper kata performance in the Suzuki/WIKF tradition.\n\nDetailed content coming in Phase 4B.","kumite-principles":"The five principles (Gogensoku) guide proper kumite engagement in the Suzuki/WIKF tradition.\n\nDetailed content coming in Phase 4B.","budo-principles":"Junanshin \u2014 A pliable/moldable mind\nZanshin \u2014 A total state of alertness/awareness\nKiai \u2014 Spirit harmony (Ki = spirit, Ai = harmony)\nKime \u2014 Control, decision\nMetsuke \u2014 Looking, seeing\nMa-ai \u2014 Distance (combative distance)\nMuga Mushin \u2014 An empty mind\nRi-ai \u2014 Coherence, interconnection\nSei to Do \u2014 Action and non-action\nYoy\u016B \u2014 Margin (having reserve)\nShisei \u2014 Posture/attitude\nKanken \u2014 Intuition and seeing\nFud\u014Dshin \u2014 Immovable mind/spirit\nShu Ha Ri \u2014 Protect/yield, reflect, depart\nMisogi \u2014 Purification"};
  return <PageShell title={page.name} subtitle={page.desc} accent="#f4a261" onMenu={onMenu} onHome={onHome}>
    <div style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"1rem",marginTop:"0.5rem"}}>{(C[id]||"Content coming in Phase 4B.").split("\n\n").map((block,i)=><div key={i} style={{marginBottom:"0.8rem"}}>{block.split("\n").map((line,j)=><p key={j} style={{color:line.match(/^\d\./)?"#f0eeeb":"#b0aead",fontSize:"0.95rem",lineHeight:1.75,fontWeight:line.match(/^\d\./)?"600":"400"}}>{line}</p>)}</div>)}</div>
  </PageShell>
}

function GlossaryView({onMenu,onHome}){
  return <PageShell title="Japanese Glossary" subtitle={"Terminology reference for Wado-Ry\u016B"} accent="#f4a261" onMenu={onMenu} onHome={onHome}>
    <div style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"1.5rem",marginTop:"0.5rem",textAlign:"center"}}><div style={{fontSize:"3rem",marginBottom:"0.5rem"}}>🔤</div><p style={{color:"#555",fontSize:"0.95rem",fontWeight:600}}>Coming in Phase 4C</p><p style={{color:"#44444d",fontSize:"0.85rem",marginTop:"0.3rem"}}>A searchable glossary will be extracted from pages 195–221 of the WIKF Belgium Handbook.</p></div>
  </PageShell>
}

function CategoryView({name,onMenu,onHome}){
  const [exp,setExp]=useState(null);const [sub,setSub]=useState("All");const [q,setQ]=useState("");const [showSearch,setShowSearch]=useState(false);
  const cc=CM.find(m=>m[0]===name);const color=cc?cc[2]:"#ff6b6b";const icon=cc?cc[1]:"";const exs=EX[name]||[];
  const subs=useMemo(()=>{const s=new Set(exs.map(e=>e.group||e.chapter).filter(Boolean));return["All",...s];},[name]);
  const filtered=useMemo(()=>{let f=exs;if(sub!=="All") f=f.filter(e=>(e.group||e.chapter)===sub);if(q.trim()&&q.length>=2){const ql=q.toLowerCase();f=f.filter(e=>e.name.toLowerCase().includes(ql)||e.desc.toLowerCase().includes(ql));}return f;},[name,sub,q]);
  const searchBtn=<button onClick={()=>setShowSearch(!showSearch)} style={{background:"none",border:"none",color:showSearch?"#ff6b6b":"#555",cursor:"pointer",fontSize:"1.1rem",padding:"0.2rem",minWidth:44,minHeight:44,display:"flex",alignItems:"center",justifyContent:"center"}}>🔍</button>;
  return <div><TopBar onMenu={onMenu} onHome={onHome} right={searchBtn} />
    <div style={{padding:"0 1rem 2rem",maxWidth:700,margin:"0 auto"}}>
    <div style={{padding:"1rem 0 0.6rem",display:"flex",alignItems:"center",gap:"0.5rem"}}><span style={{fontSize:"1.5rem"}}>{icon}</span><h2 style={{fontSize:"1.3rem",fontWeight:700,color}}>{name}</h2><span style={{fontFamily:mono,fontSize:"0.75rem",color:"#555"}}>{filtered.length}</span></div>
    {showSearch&&<input value={q} onChange={e=>setQ(e.target.value)} placeholder="Filter..." autoFocus style={{width:"100%",background:"#131316",border:"1px solid #2a2a32",borderRadius:10,padding:"0.6rem 0.9rem",color:"#f0eeeb",fontSize:"0.95rem",fontFamily:"'DM Sans',sans-serif",marginBottom:"0.6rem",outline:"none"}}/>}
    {subs.length>2&&<div style={{display:"flex",gap:"0.3rem",overflowX:"auto",WebkitOverflowScrolling:"touch",paddingBottom:"0.5rem",marginBottom:"0.3rem"}}>{subs.map(s=><button key={s} onClick={()=>setSub(s)} style={{fontFamily:mono,fontSize:"0.65rem",padding:"0.3rem 0.6rem",borderRadius:6,border:"1px solid "+(sub===s?color:"#1e1e24"),background:sub===s?color+"18":"transparent",color:sub===s?color:"#555",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>{s}</button>)}</div>}
    {filtered.map((ex,i)=>{const isOpen=exp===i;return <div key={i} style={{background:"#131316",border:"1px solid "+(isOpen?"#2a2a32":"#1e1e24"),borderRadius:12,marginBottom:"0.4rem"}}><button onClick={()=>setExp(isOpen?null:i)} style={{width:"100%",background:"transparent",border:"none",padding:"0.75rem 0.9rem",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:"0.5rem"}}><div style={{width:6,height:6,borderRadius:"50%",background:color,flexShrink:0,opacity:0.6}}/><span style={{flex:1,fontWeight:600,fontSize:"0.95rem",color:isOpen?"#f0eeeb":"#c0bfbb",lineHeight:1.35}}>{ex.name}</span><span style={{fontSize:"0.7rem",color:"#44444d",transform:isOpen?"rotate(180deg)":"none",transition:"transform 0.15s"}}>▼</span></button>{isOpen&&<div style={{padding:"0 0.9rem 0.9rem"}}><p style={{fontSize:"0.9rem",color:"#b0aead",lineHeight:1.7}}>{ex.desc}</p></div>}</div>})}
    <div style={{textAlign:"center",padding:"0.8rem",color:"#33333b",fontSize:"0.65rem",fontFamily:mono}}>Karate Handbook v10 — May 2026</div>
  </div></div>
}

function SearchView({query,onMenu,onHome}){
  const [q,setQ]=useState(query);const [exp,setExp]=useState(null);
  const results=useMemo(()=>{if(!q||q.length<2) return [];const ql=q.toLowerCase();const r=[];for(const [cat,list] of Object.entries(EX)){for(const e of list){if(e.name.toLowerCase().includes(ql)||e.desc.toLowerCase().includes(ql)){r.push({...e,_cat:cat});}}}return r;},[q]);
  return <div><TopBar onMenu={onMenu} onHome={onHome} />
    <div style={{padding:"0 1rem 2rem",maxWidth:700,margin:"0 auto"}}>
    <input value={q} onChange={e=>setQ(e.target.value)} autoFocus placeholder="Search..." style={{width:"100%",background:"#131316",border:"1px solid #2a2a32",borderRadius:12,padding:"0.75rem 1rem",color:"#f0eeeb",fontSize:"1rem",fontFamily:"'DM Sans',sans-serif",margin:"1rem 0",outline:"none"}} />
    <div style={{fontFamily:mono,fontSize:"0.75rem",color:"#555",marginBottom:"0.6rem"}}>{results.length} result{results.length!==1?"s":""}</div>
    {results.map((ex,i)=>{const isOpen=exp===i;const eColor=CM.find(m=>m[0]===ex._cat)?.[2]||"#ff6b6b";return <div key={i} style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:12,marginBottom:"0.4rem"}}><button onClick={()=>setExp(isOpen?null:i)} style={{width:"100%",background:"transparent",border:"none",padding:"0.75rem 0.9rem",cursor:"pointer",textAlign:"left"}}><div style={{fontWeight:600,fontSize:"0.95rem",color:"#f0eeeb"}}>{ex.name}</div><div style={{fontSize:"0.7rem",color:eColor,fontFamily:mono,marginTop:"0.1rem"}}>{ex._cat}</div></button>{isOpen&&<div style={{padding:"0 0.9rem 0.9rem"}}><p style={{fontSize:"0.9rem",color:"#b0aead",lineHeight:1.7}}>{ex.desc}</p></div>}</div>})}
    <div style={{textAlign:"center",padding:"0.8rem",color:"#33333b",fontSize:"0.65rem",fontFamily:mono}}>Karate Handbook v10 — May 2026</div>
  </div></div>
}

function SyllabusView({onNav,onMenu,onHome}){
  const ref=useRef(null);
  useEffect(()=>{if(ref.current&&typeof marked!=='undefined'){ref.current.innerHTML=marked.parse(SYL);}},[]);
  return <div><TopBar onMenu={onMenu} onHome={onHome} />
    <div style={{padding:"0 1rem 2rem",maxWidth:700,margin:"0 auto"}}>
      <div style={{padding:"1rem 0 0.5rem"}}><h1 style={{fontSize:"1.4rem",fontWeight:700,fontFamily:mono,color:"#ff6b6b"}}>WIKF Syllabus</h1><p style={{fontSize:"0.85rem",color:"#666",marginTop:"0.2rem"}}>Complete reference text. For structured content, use the dedicated sections below.</p></div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.4rem",marginBottom:"1.2rem"}}>{[{icon:"🥋",name:"Kata",v:{type:"kata"}},{icon:"👊",name:"Kihon",v:{type:"kihon"}},{icon:"🤜",name:"Kumite Forms",v:{type:"kumiteForms"}},{icon:"🔪",name:"Weapons",v:{type:"weapons"}},{icon:"🏛️",name:"History",v:{type:"history"}},{icon:"☯️",name:"Principles",v:{type:"principles"}}].map(s=><button key={s.name} onClick={()=>onNav(s.v)} style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:10,padding:"0.7rem",cursor:"pointer",textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:"0.4rem"}}><span>{s.icon}</span><span style={{fontSize:"0.85rem",color:"#c0bfbb",fontWeight:600}}>{s.name}</span></button>)}</div>
      <div ref={ref} className="syl" style={{paddingBottom:"2rem"}} />
      <div style={{textAlign:"center",padding:"0.8rem",color:"#33333b",fontSize:"0.65rem",fontFamily:mono}}>Karate Handbook v10 — May 2026</div>
    </div>
  </div>
}

function ExamListView({onMenu,onHome,onSelectGrade}){
  const kyuGrades=EXAMS.filter(e=>e.grade.includes("Kyu"));const danGrades=EXAMS.filter(e=>!e.grade.includes("Kyu"));
  const renderGrade=(ex)=><button key={ex.grade} onClick={()=>onSelectGrade(ex.grade)} style={{width:"100%",background:"#131316",border:"1px solid #1e1e24",borderRadius:12,padding:"0.9rem 1rem",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:"0.8rem",marginBottom:"0.4rem",borderLeft:"4px solid "+ex.color}}>
    <div style={{width:36,height:36,borderRadius:"50%",background:ex.color+"22",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:mono,fontWeight:700,fontSize:"0.7rem",color:ex.color,flexShrink:0}}>{ex.grade.split(" ")[0]}</div>
    <div><div style={{fontWeight:700,fontSize:"1rem",color:"#f0eeeb"}}>{ex.grade}</div><div style={{fontSize:"0.8rem",color:"#666"}}>{ex.belt} belt{ex.min?" · "+ex.min:""}</div></div>
  </button>;
  return <PageShell title="Exam Syllabus" subtitle="AWIKP / WIKF grading requirements" accent="#f4a261" onMenu={onMenu} onHome={onHome}>
    <h3 style={{fontSize:"1rem",color:"#f4a261",fontWeight:700,margin:"0.5rem 0"}}>Kyu Grades</h3>{kyuGrades.map(renderGrade)}
    <h3 style={{fontSize:"1rem",color:"#f4a261",fontWeight:700,margin:"1rem 0 0.5rem"}}>Dan Grades</h3>{danGrades.map(renderGrade)}
  </PageShell>
}

function ExamDetailView({grade,onMenu,onHome}){
  const ex=EXAMS.find(e=>e.grade===grade);
  if(!ex) return <PageShell title="Not Found" onMenu={onMenu} onHome={onHome}><p style={{color:"#666"}}>Grade not found.</p></PageShell>;
  return <PageShell title={ex.grade} subtitle={(ex.belt||"")+" belt"+(ex.min?" · "+ex.min:"")} accent={ex.color} onMenu={onMenu} onHome={onHome}>
    {ex.sections.map((sec,si)=><div key={si} style={{marginTop:"1rem"}}><h3 style={{fontSize:"1rem",fontWeight:700,color:ex.color,marginBottom:"0.4rem"}}>{sec.title}</h3>
      {sec.items.map((item,ii)=>{const isObj=item&&typeof item==="object";return <div key={ii} style={{background:"#131316",border:"1px solid #1e1e24",borderRadius:10,padding:"0.65rem 0.8rem",marginBottom:"0.3rem"}}><div style={{fontWeight:600,fontSize:"0.9rem",color:"#f0eeeb"}}>{isObj?item.t:item}</div>{isObj&&item.d&&<div style={{fontSize:"0.82rem",color:"#888",marginTop:"0.15rem",lineHeight:1.5}}>{item.d}</div>}</div>})}</div>)}
  </PageShell>
}

function App(){
  const [view,setView]=useState({type:"home"});const [history,setHistory]=useState([]);const [drawer,setDrawer]=useState(false);
  const go=useCallback((v)=>{setHistory(h=>[...h,view]);setView(v);window.scrollTo(0,0);},[view]);
  const back=useCallback(()=>{if(history.length>0){setView(history[history.length-1]);setHistory(h=>h.slice(0,-1));}else{setView({type:"home"});}window.scrollTo(0,0);},[history]);
  const navTo=useCallback((v)=>{setHistory([]);setView(v);window.scrollTo(0,0);},[]);
  const menu=useCallback(()=>setDrawer(true),[]);
  useSwipeBack(back, view.type!=="home");
  const home=useCallback(()=>{setHistory([]);setView({type:"home"});window.scrollTo(0,0);},[]);
  const mp={onMenu:menu,onHome:home};
  return <>
    <NavDrawer open={drawer} onClose={()=>setDrawer(false)} onNav={navTo} />
    {view.type==="home"&&<Home onNav={v=>go(v)} onMenu={menu} />}
    {view.type==="category"&&<CategoryView name={view.name} {...mp} />}
    {view.type==="search"&&<SearchView query={view.query} {...mp} />}
    {view.type==="syllabus"&&<SyllabusView onNav={v=>go(v)} {...mp} />}
    {view.type==="exams"&&<ExamListView onSelectGrade={g=>go({type:"exam",grade:g})} {...mp} />}
    {view.type==="exam"&&<ExamDetailView grade={view.grade} {...mp} />}
    {view.type==="kata"&&<KataListView onNav={v=>go(v)} {...mp} />}
    {view.type==="kataDetail"&&<KataDetailView id={view.id} {...mp} />}
    {view.type==="kihon"&&<KihonView onNav={v=>go(v)} {...mp} />}
    {view.type==="kihonSection"&&<KihonSectionView id={view.id} {...mp} />}
    {view.type==="kumiteForms"&&<KumiteFormsView onNav={v=>go(v)} {...mp} />}
    {view.type==="kumiteFormDetail"&&<KumiteFormDetailView groupKey={view.groupKey} id={view.id} {...mp} />}
    {view.type==="weapons"&&<WeaponsView onNav={v=>go(v)} {...mp} />}
    {view.type==="weaponDetail"&&<WeaponDetailView weaponGroup={view.weaponGroup} id={view.id} {...mp} />}
    {view.type==="history"&&<HistoryView onNav={v=>go(v)} {...mp} />}
    {view.type==="historyDetail"&&<HistoryDetailView id={view.id} {...mp} />}
    {view.type==="principles"&&<PrinciplesView onNav={v=>go(v)} {...mp} />}
    {view.type==="principleDetail"&&<PrincipleDetailView id={view.id} {...mp} />}
    {view.type==="glossary"&&<GlossaryView {...mp} />}
  </>
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
