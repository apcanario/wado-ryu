<style>

::-webkit-scrollbar-thumb{background:#2a2a32;border-radius:4px}

th{font-family:'Space Mono',monospace;font-size:0.6rem;text-transform:uppercase;letter-spacing:0.08em;color:#8a8a96;text-align:left;padding:0.4rem 0.6rem;border-bottom:1px solid #2a2a32}
td{padding:0.4rem 0.6rem;border-bottom:1px solid rgba(42,42,50,0.4);vertical-align:top}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState}=React;

/* ─── ROLE INTENSITY SCALE ─── */
const RI_SCALE={
  "light":{label:"Light",range:"30–50%",color:"#2a9d8f",desc:"Feeding, cooperating. Predictable, controlled output so the active athlete can build."},
  "controlled":{label:"Controlled",range:"50–70%",color:"#f4a261",desc:"Realistic but measured. Enough pressure to be honest, not enough to disrupt learning."},
  "match":{label:"Match",range:"80–100%",color:"#e63946",desc:"Competition speed and intent. Full commitment within WKF rules."},
  "max":{label:"Max",range:"100%+",color:"#9b5de5",desc:"Supramaximal bursts. Short duration, explosive, beyond normal competition output."}
};

const DRILLS=[
{id:"001",name:"Kizami-tsuki Slide Entry",type:"OFF",level:["intermediate","advanced"],season:"any",intensity:"moderate",focus:["technical","speed"],format:"pairs",slot:"main",duration:"8–10 min",equipment:"Focus mitts",score:"Kizami-tsuki = ~44% of all scored hand techniques in WKF. Primary YUKO weapon.",desc:"From free kamae at long maai, pull rear foot behind lead foot (gaining distance without telegraphing) and fire kizami-tsuki jodan in a single action. The slide 'buys a pace' — the punch arrives before the opponent registers forward movement. Shoulder-driven snap, not full hip rotation. Partner holds focus mitt at jodan and moves backward unpredictably.",sets:"5 × 10 reps/side, 30s rest",
roles:[{role:"Athlete",int:"match",cue:"Full speed slide + snap. Sell the distance steal."},{role:"Pad holder",int:"controlled",cue:"Move backward unpredictably. Give a live target, not a stationary one."}]},

{id:"002",name:"Gyaku-tsuki Power Line",type:"OFF",level:["beginner","intermediate"],season:"pre-season / any",intensity:"moderate",focus:["technical","physical"],format:"pairs",slot:"main",duration:"10 min",equipment:"Body shield",score:"Gyaku-tsuki = ~58% of WAZA-ARI in competition. Clean power mechanics non-negotiable.",desc:"Drive off rear leg, rotate hip fully, deliver gyaku-tsuki chudan to body shield. Full kinetic chain: rear heel push → hip rotation → shoulder extension → fist. Must show zanshin for 1 full second after impact before resetting.",sets:"4 × 8 reps/side, 45s rest",
roles:[{role:"Athlete",int:"match",cue:"Full kinetic chain. Land with authority."},{role:"Shield holder",int:"light",cue:"Brace shield at chudan. Absorb, don't resist."}]},

{id:"003",name:"Kizami → Gyaku Double-Punch",type:"OFF",level:["intermediate","advanced"],season:"any",intensity:"high",focus:["speed","tactical"],format:"pairs",slot:"main",duration:"8 min",equipment:"Focus mitts × 2",score:"Highest-percentage scoring combination in WKF. Second punch scores because the first disrupts guard.",desc:"Kizami-tsuki jodan draws guard up → immediately gyaku-tsuki chudan as hands rise. One continuous action — kizami is the door opener, gyaku is the score. Must cover distance during kizami so gyaku lands without a second step. Progression: partner adds random lateral movement.",sets:"5 × 8 reps, 30s rest",
roles:[{role:"Athlete",int:"match",cue:"One continuous action. Cover distance on kizami."},{role:"Pad holder",int:"controlled",cue:"Present targets jodan + chudan. Add lateral movement in progression."}]},

{id:"004",name:"Gyaku-tsuki → Chudan Mawashi-geri",type:"OFF",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["speed","tactical"],format:"pairs",slot:"main",duration:"10 min",equipment:"Body shield + mitt",score:"YUKO setup into WAZA-ARI finisher. Hand-to-leg transition is where most athletes telegraph.",desc:"Gyaku-tsuki chudan draws guard low → immediately chudan mawashi-geri off rear leg. Punch and kick in one exhale — not two counts. Coach holds shield for punch, pivots to present open side for kick. Hands stay up between techniques.",sets:"4 × 6 reps/side, 45s rest",
roles:[{role:"Athlete",int:"match",cue:"One exhale. Punch-kick, not punch… kick."},{role:"Pad holder",int:"controlled",cue:"Shield for punch, pivot to present open side for kick. Smooth transition."}]},

{id:"005",name:"Kizami → Front-leg Jodan Mawashi-geri",type:"OFF",level:["advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["speed","tactical"],format:"pairs",slot:"main",duration:"10 min",equipment:"Focus mitts",score:"YUKO setup into IPPON finish. Front-leg jodan mawashi = highest-value technique in WKF (3 points).",desc:"Lead-hand kizami-tsuki draws guard up → immediately front-leg mawashi-geri jodan to exposed side of head. Kick comes off same side as punch — arm pulls back as leg fires, using hip rotation to chain. Kick must arrive before opponent resets guard.",sets:"4 × 6 reps/side, 45s rest",
roles:[{role:"Athlete",int:"match",cue:"Kizami must be convincing — sell the jab or the kick never lands."},{role:"Pad holder",int:"controlled",cue:"Hold mitt at jodan. React to kizami as if in fight."}]},

{id:"006",name:"Feint Mae-geri → Jodan Mawashi-geri",type:"OFF",level:["advanced","elite"],season:"mid-season / peak",intensity:"moderate–high",focus:["tactical"],format:"pairs",slot:"main",duration:"10 min",equipment:"None",score:"Converts a WAZA-ARI threat into an IPPON score. Without the feint, jodan mawashi has low hit rate.",desc:"Show clear mae-geri chamber (knee lift, hip drive) to provoke low guard shift, then convert same lift into jodan mawashi-geri without putting foot down. Decision point is at knee height. Progression: partner learns to read the feint, athlete must make chamber more convincing.",sets:"3 × 8 reps/side, 60s rest",
roles:[{role:"Athlete",int:"match",cue:"Chamber must be indistinguishable from real mae-geri."},{role:"Partner",int:"controlled",cue:"React honestly to the feint. If you can read it, say so — that's the feedback loop."}]},

{id:"007",name:"Long Gyaku-tsuki Lunge",type:"OFF",level:["advanced","elite"],season:"pre-season / early-comp",intensity:"high–max",focus:["speed","physical"],format:"pairs",slot:"main",duration:"10 min",equipment:"Head guards",score:"The 'hail mary' YUKO — scores senshu in the first exchange if timed correctly.",desc:"Maximum-reach lunging gyaku-tsuki jodan. Rear leg drives, hip rotates fully, lead shoulder reaches forward for extra centimetres. Drilled against partner retreating at random speed. Must commit through the target line. Sun-dome control: arrive at WKF distance (2cm seniors, 5cm cadets).",sets:"3 × 10 reps, 60s rest",
roles:[{role:"Athlete",int:"max",cue:"Full commitment through the line. Maximum reach."},{role:"Partner",int:"controlled",cue:"Retreat at random speed. Be a moving target, not a punching bag."}]},

{id:"008",name:"Switch-step Mae-geri → Kizami-tsuki",type:"OFF",level:["intermediate","advanced"],season:"any",intensity:"moderate",focus:["technical","tactical"],format:"pairs",slot:"main",duration:"8 min",equipment:"Body shield",score:"Stance-switching disrupts pattern reading. Mae-geri = WAZA-ARI, follow-up kizami = YUKO.",desc:"From mirrored kamae, switch lead leg (rear comes forward, lead goes back), immediately mae-geri chudan off new lead leg, follow with kizami-tsuki on same line. Progression: add gyaku-tsuki chudan for 3-hit chain.",sets:"4 × 6 reps/side, 30s rest",
roles:[{role:"Athlete",int:"match",cue:"Switch + kick is one action. No pause between stance change and technique."},{role:"Shield holder",int:"light",cue:"Hold shield at chudan. Stable base."}]},

{id:"009",name:"Slide Gyaku → Mawashi-geri Jodan Exit",type:"OFF",level:["intermediate","advanced"],season:"mid-season / peak",intensity:"high",focus:["speed","technical"],format:"pairs",slot:"main",duration:"8 min",equipment:"Body shield + mitt",score:"YUKO body punch into IPPON head kick. Exit discipline prevents opponent equalizing.",desc:"Slide into range with gyaku-tsuki chudan to body → immediately front-leg mawashi-geri jodan as gyaku arm pulls back (waist rotation loads the kick). Punch and kick in one exhale. After kick, step back out to safe maai.",sets:"3 × 6 reps/side, 60s rest",
roles:[{role:"Athlete",int:"match",cue:"Punch-kick-EXIT. Score and leave. Lingering gets equalized."},{role:"Pad holder",int:"controlled",cue:"Shield for body, mitt at jodan. Present both targets in sequence."}]},

{id:"010",name:"Push-off Retreat Mawashi-geri",type:"TRN",level:["intermediate","advanced"],season:"any",intensity:"moderate",focus:["technical","tactical"],format:"pairs",slot:"main",duration:"8 min",equipment:"None",score:"Converts dead-range stalls into IPPON from an unexpected angle.",desc:"After a stalled close-range exchange, push off opponent's body/shoulder with lead hand, create one step of distance, fire mawashi-geri jodan off the retreating lead leg. Both legs, both sides. Addresses the WKF-specific problem of chest-range dead zones.",sets:"4 × 5 reps/side, 30s rest",
roles:[{role:"Athlete",int:"match",cue:"Push creates distance. Kick fills it. One rhythm."},{role:"Partner",int:"controlled",cue:"Provide realistic chest-range pressure. Don't collapse or assist the push-off."}]},

{id:"011",name:"Nagashi-uke → Gyaku-tsuki Counter",type:"CTR",level:["intermediate","advanced"],season:"any",intensity:"moderate",focus:["tactical","technical"],format:"pairs",slot:"main",duration:"12 min",equipment:"None (light contact)",score:"Go-no-sen counter. First clean technique of an exchange scores — counter must arrive before attacker resets.",desc:"Partner attacks kizami-tsuki jodan. Defender uses nagashi-uke (deflecting parry) with lead hand to redirect punch past centreline, simultaneously shifting weight to rear leg. As punch passes, fire gyaku-tsuki chudan to open body. Parry and counter are one action. Hold zanshin 1 full second.",sets:"5 × 8 reps/side, 30s rest",
roles:[{role:"Attacker (feeder)",int:"controlled",cue:"Committed, honest kizami-tsuki. Not slow enough to be fake, not fast enough to overwhelm the learning."},{role:"Defender (active)",int:"match",cue:"Parry and counter are ONE action. Full speed on the counter."}]},

{id:"012",name:"Tai-sabaki Interception vs Jodan Mawashi",type:"CTR",level:["advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["speed","tactical"],format:"pairs",slot:"main",duration:"10 min",equipment:"Head guards",score:"Converts opponent's IPPON attempt into your YUKO. If interception arrives first, their kick is nullified.",desc:"Attacker chambers jodan mawashi-geri. Defender reads knee lift, shifts diagonally forward-inside (tai-sabaki), fires kizami-tsuki to head as kick is still travelling. Sen-no-sen — simultaneous with attack. Diagonal step goes inside kick's arc where it has no power.",sets:"3 × 6 reps/side, 60s rest",
roles:[{role:"Attacker",int:"match",cue:"Real jodan mawashi chamber. If you telegraph less, the defender learns more."},{role:"Defender (active)",int:"match",cue:"Read the knee. Move INTO the kick arc. Courage drill."}]},

{id:"013",name:"Step-back Counter Mawashi-geri",type:"CTR",level:["intermediate","advanced"],season:"any",intensity:"moderate–high",focus:["tactical","speed"],format:"pairs",slot:"main",duration:"10 min",equipment:"Head guards",score:"Converts YUKO attack into IPPON counter. Head kick off retreat = high-percentage because attacker's momentum prevents recovery.",desc:"Attacker enters with gyaku-tsuki chudan. Defender steps back, deflects with rear-hand nagashi-uke, immediately fires front-leg mawashi-geri jodan on the swivel — no reset, no pause. Step back creates kicking distance; swivel uses backward momentum to load hip.",sets:"4 × 6 reps/side, 45s rest",
roles:[{role:"Attacker (feeder)",int:"controlled",cue:"Enter with committed gyaku-tsuki. Enough intent to be real, enough control to let the counter develop."},{role:"Defender (active)",int:"match",cue:"Step back, deflect, kick — no pause. Use the backward momentum."}]},

{id:"014",name:"Triangle Block → Angled Gyaku-tsuki",type:"CTR",level:["advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["tactical","mental"],format:"pairs",slot:"main",duration:"10 min",equipment:"Head guards + body shield",score:"Nullifies opponent's IPPON attempt and creates YUKO from an undefendable angle.",desc:"Attacker throws jodan mawashi-geri. Defender steps inside the kick's arc (toward kicking leg), covers head with both forearms forming triangle on kicking side. From inside, pivot to angle and fire gyaku-tsuki chudan to open body. Requires courage.",sets:"3 × 6 reps/side, 60s rest",
roles:[{role:"Attacker",int:"match",cue:"Real jodan mawashi. Controlled power — this is head-height contact."},{role:"Defender (active)",int:"match",cue:"Step INTO the arc. Triangle first, counter second. Courage is the training variable."}]},

{id:"015",name:"Uraken-uchi Slip Counter",type:"CTR",level:["intermediate","advanced"],season:"any",intensity:"moderate–high",focus:["tactical","speed"],format:"pairs",slot:"main",duration:"10 min",equipment:"Head guards",score:"Uraken-uchi scores as YUKO (uchi category). Arrives from blind angle — high success rate vs committed attackers.",desc:"Attacker commits gyaku-tsuki chudan. Defender slips off centreline (lead shoulder drops, weight shifts laterally), lets punch pass, fires uraken-uchi jodan to temple during attacker's committed rotation. Must arrive during recovery phase, not after reset.",sets:"4 × 8 reps/side, 30s rest",
roles:[{role:"Attacker (feeder)",int:"controlled",cue:"Committed gyaku-tsuki. Don't pull it — the defender needs to learn to read commitment."},{role:"Defender (active)",int:"match",cue:"Slip is the setup. Uraken arrives during their recovery, not after."}]},

{id:"016",name:"Counter-Counter Flow (Kaeshi)",type:"CTR",level:["advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["tactical","mental"],format:"pairs",slot:"main",duration:"12 min",equipment:"Full WKF gear",score:"Elite bouts are decided in the counter-counter layer. Only the first clean technique of an exchange scores.",desc:"From free maai: (A) attacks with committed kizami-tsuki → (B) parries and counters with gyaku-tsuki → (A) defends the counter and delivers second-wave counter. Three-link chain. Both commit fully. Rotate roles every 5 exchanges. Progression: open technique choice.",sets:"5 exchanges × 5 rounds/role, 60s rest",
roles:[{role:"Both athletes",int:"match",cue:"Both commit fully. Three-link chain requires honest intent at every link."}]},

{id:"017",name:"Gyaku-tsuki Pad Reaction",type:"REA",level:["intermediate","advanced","elite"],season:"any",intensity:"high",focus:["speed","mental"],format:"pairs",slot:"main",duration:"16 min",equipment:"Focus mitts",score:"Decreased response time → senshu advantage in the opening exchange.",desc:"Coach holds focus mitt at random positions/intervals. Athlete maintains kamae with pulse footwork. When pad appears, fire gyaku-tsuki with minimum reaction delay. Coach varies height (chudan/jodan), angle, timing (regular → irregular → with feints).",sets:"4 × 3-min rounds, 1-min rest",
roles:[{role:"Athlete",int:"match",cue:"Fire on sight. Minimum reaction delay."},{role:"Coach / pad holder",int:"controlled",cue:"Vary height, angle, timing. Add feints in later rounds. YOU control the difficulty."}]},

{id:"018",name:"Multi-Pad Decision Drill",type:"REA",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"high–max",focus:["speed","mental"],format:"pairs",slot:"finisher",duration:"10 min",equipment:"Multiple pads",score:"WKF bouts require choosing the right weapon. Builds weapon selection under time pressure.",desc:"Coach holds multiple pads at varied heights/angles. Pads appear unpredictably — athlete selects correct weapon: kizami for jodan, gyaku for chudan, mawashi for lateral, uraken for angled. Decision-speed, not just reaction-speed.",sets:"4 × 90s rounds, 60s rest",
roles:[{role:"Athlete",int:"max",cue:"Decision AND execution at maximum speed. This is the ceiling drill."},{role:"Coach / pad holder",int:"controlled",cue:"Vary pad position, timing, and angle. Create real decision pressure."}]},

{id:"019",name:"Ball-Drop Reaction Drill",type:"REA",level:["kids","cadet","beginner"],season:"any",intensity:"low–moderate",focus:["speed","mental"],format:"pairs",slot:"warm-up",duration:"8 min",equipment:"Tennis ball",score:"Builds the reaction base all WKF scoring depends on. Fun for kids, developmental for cadets.",desc:"Partner holds tennis ball at shoulder height, drops without warning. Athlete executes kizami-tsuki to intercept before it hits floor. Progression: lower drop height; two balls, only one drops — must read which.",sets:"3 × 15 drops, 30s rest",
roles:[{role:"Athlete",int:"match",cue:"React to the drop. Intercept before it hits the floor."},{role:"Partner (dropper)",int:"light",cue:"Hold at shoulder height. Drop without warning — no tells."}]},

{id:"020",name:"Mirror Footwork Drill",type:"DEF",level:["beginner","intermediate","advanced"],season:"any",intensity:"low–moderate",focus:["tactical"],format:"pairs",slot:"warm-up",duration:"9 min",equipment:"None",score:"Maai control is prerequisite to every score in WKF. Can't land at sun-dome range without it.",desc:"Two athletes in kamae. One leads with footwork (slide in/out, lateral cut, diagonal pivot, feints). Other mirrors in real time with zero lag. Roles switch every 60s. Progression: leader adds kizami-tsuki at random — follower must parry without breaking rhythm.",sets:"6 × 60s rounds, 30s rest",
roles:[{role:"Leader",int:"controlled",cue:"Set the pace. Footwork variety — forward, back, lateral, diagonal. Add kizami in progression."},{role:"Follower (active)",int:"match",cue:"Zero lag. Mirror instantly. Parry without breaking rhythm in progression."}]},

{id:"021",name:"Called-Technique Rapid Fire",type:"REA",level:["beginner","intermediate","advanced"],season:"any",intensity:"moderate–high",focus:["speed","mental"],format:"full-class",slot:"main",duration:"10 min",equipment:"None / mitts optional",score:"Builds technique-selection speed. 'Jogai!' addition trains impulse control under pressure.",desc:"Coach calls technique names randomly ('kizami!', 'mawashi!', 'ura-mawashi!', 'uraken!'). Athlete executes from kamae as fast as possible. Progression: add 'jogai!' calls where athlete steps laterally instead of striking.",sets:"4 × 90s rounds, 60s rest",
roles:[{role:"All athletes",int:"match",cue:"Execute from kamae as fast as possible. No telegraphing, no wind-up."}]},

{id:"022",name:"Moving Focus-Mitt Accuracy",type:"OFF",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"moderate–high",focus:["speed","technical"],format:"pairs",slot:"main",duration:"12 min",equipment:"Focus mitts",score:"WKF scoring requires correct distance on a moving target. Builds live-tracking accuracy.",desc:"Coach holds mitts and moves constantly — forward, backward, laterally, pivoting. Small targets. Athlete tracks, closes distance, lands clean kizami or gyaku on moving mitt. Coach varies speed and applies light pressure between presentations.",sets:"3 × 3-min rounds, 1-min rest",
roles:[{role:"Athlete",int:"match",cue:"Track, close, land. Accuracy on a moving target."},{role:"Coach / pad holder",int:"controlled",cue:"Move unpredictably. Small targets. Apply shoulder checks between presentations."}]},

{id:"023",name:"Kabe Kumite (Wall Sparring)",type:"DEF",level:["advanced","elite"],season:"mid-season / peak",intensity:"high–max",focus:["mental","tactical"],format:"pairs",slot:"finisher",duration:"12 min",equipment:"Full WKF gear",score:"WKF's 8m tatami means the edge is always close. Fighting off the wall avoids jogai and creates counter-scoring.",desc:"Defender stands heels against wall/tatami edge. Attacker free-attacks. Defender cannot retreat — must use tai-sabaki, nagashi-uke, or sen-no-sen counters. Builds skill of fighting with nowhere to go.",sets:"6 × 60s rounds (3/role), 60s rest",
roles:[{role:"Attacker",int:"match",cue:"Full offensive pressure. Pin and score."},{role:"Defender (active)",int:"match",cue:"No retreat. Tai-sabaki, counter, or eat it. Pressure is the teacher."}]},

{id:"024",name:"U-Drill (Angle-Cutting Pressure)",type:"POS",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"moderate",focus:["tactical"],format:"pairs",slot:"main",duration:"8 min",equipment:"None",score:"Ring-cutting forces opponent toward tatami edge (jogai). Positional dominance creates scoring without raw speed.",desc:"Athlete follows U-shaped path: forward pressure → lateral cut → forward pressure on new line. Partner retreats straight — the U cuts off their angle. First footwork only, then kizami at each direction change, then free technique choice.",sets:"4 × 4 U-patterns/dir, 30s rest",
roles:[{role:"Athlete (presser)",int:"match",cue:"Own the angles. Cut off retreat lines."},{role:"Partner (retreater)",int:"light",cue:"Retreat in straight lines. Be the training dummy for angle-cutting — don't fight it."}]},

{id:"025",name:"Pulse Footwork Drill",type:"POS",level:["beginner","intermediate","advanced"],season:"any",intensity:"low–moderate",focus:["technical","physical"],format:"solo / full-class",slot:"warm-up",duration:"8 min",equipment:"None",score:"The pulse is the foundation of all WKF movement. Without it, every technique starts from a dead stop.",desc:"Maintain on-the-balls-of-the-feet pulse rhythm in kamae — constant micro-bounce keeping body loaded for any direction. Phase 1: pulse only (2 min). Phase 2: add kizami at random (2 min). Phase 3: add mawashi at random (2 min).",sets:"3 × 2-min phases, 30s rest",
roles:[{role:"All athletes",int:"controlled",cue:"Rhythm first, speed second. Stay on the balls of the feet."}]},

{id:"026",name:"Circle Belt Drill",type:"POS",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"moderate–high",focus:["tactical","mental"],format:"small-group",slot:"main",duration:"12 min",equipment:"Belt + WKF gear",score:"Trains 360-degree spatial awareness inside the WKF ring boundary.",desc:"Belt laid in circle on tatami. 3–4 athletes work footwork around circle maintaining kamae and pulse. At coach's signal, any athlete can attack any other. Must maintain 360° awareness.",sets:"4 × 2-min rounds, 1-min rest",
roles:[{role:"All athletes",int:"match",cue:"360° awareness. Attack on signal, defend on instinct."}]},

{id:"027",name:"Happo Kumite (8-Direction)",type:"REA",level:["advanced","elite"],season:"mid-season / peak",intensity:"high–max",focus:["tactical","mental","physical"],format:"small-group",slot:"finisher",duration:"15 min",equipment:"Full WKF gear",score:"Replicates multi-threat cognitive load of WKF competition.",desc:"Defender in centre. 4–8 attackers at compass points. Each attacks with single committed technique at random intervals. Defender responds with appropriate counter (varying each time). 30s for cadets, up to 2 min for elite.",sets:"3–4 rounds/defender, 90s rest",
roles:[{role:"Defender (centre)",int:"max",cue:"Every direction is live. Respond with the right counter every time."},{role:"Attackers (ring)",int:"controlled",cue:"Single committed technique. Honest intent but not trying to overwhelm — one at a time."}]},

{id:"028",name:"Corner Escape Drill",type:"POS",level:["advanced","elite"],season:"mid-season / peak",intensity:"high",focus:["tactical","mental"],format:"pairs",slot:"main",duration:"12 min",equipment:"Full WKF gear",score:"Cornered athlete who escapes and scores wins. Presser who seals forces jogai.",desc:"Two athletes free-spar, one driven into tatami corner. Cornered athlete practises: pivot off back foot, diagonal slide off corner, sen-no-sen counter on incoming pressure. Reverse roles every 60s.",sets:"6 × 60s rounds (3/role), 60s rest",
roles:[{role:"Presser",int:"match",cue:"Seal the corner. Force jogai or score."},{role:"Cornered (active)",int:"match",cue:"Escape and score. Pivot, slide, or counter — but get out."}]},

{id:"029",name:"Jiyu Kumite Line Drill",type:"TRN",level:["intermediate","advanced","elite"],season:"mid-season / peak",intensity:"moderate–high",focus:["tactical","mental"],format:"full-class",slot:"main",duration:"15 min",equipment:"Full WKF gear",score:"Senshu (first score) wins draws. Trains winning the opening exchange — most valuable tactical asset.",desc:"Two lines face off. Athletes step to maai, take kamae. One exchange only — first clean technique scores. Rotate to end of opposite line. Coach calls YAME after each exchange, identifies scoring technique.",sets:"15–20 exchanges/athlete, continuous",
roles:[{role:"Both athletes",int:"match",cue:"One exchange, first clean technique wins. Full commitment from the first step."}]},

{id:"030",name:"Resistance-Band Dynamic Warm-Up",type:"WU",level:["intermediate","advanced","elite"],season:"any",intensity:"moderate",focus:["physical","speed"],format:"solo / full-class",slot:"warm-up",duration:"12 min",equipment:"Resistance band (~10% BW)",score:"Peer-reviewed: ~7.3% faster punch reaction time vs body-weight-only warm-up.",desc:"12-minute protocol with wearable resistance band at ~10% body-mass tension. Dynamic stretching, kumite-specific movement patterns (slides, pivots, level changes), technique shadows under resistance.",sets:"Continuous 12-min protocol",
roles:[{role:"All athletes",int:"controlled",cue:"Focus on movement quality under resistance. Not a conditioning drill — it's a primer."}]}
];

const SESSIONS=[
{id:"S1",title:"Mid-Season Cadets — Counter-Attack & Reaction",params:{Duration:"60 min",Level:"Cadet (12–17)",Type:"Counter + Reactive",Season:"Mid-season",Focus:"Tactical + Speed",Size:"12–16 athletes"},color:"#f4a261",blocks:[
{slot:"WARM-UP",time:"0:00–0:12",mins:12,drills:[
{ref:"025",name:"Pulse Footwork Drill",mins:5,notes:"Two lines. Pure pulse rhythm in kamae — no techniques yet. Coach walks lines correcting flat feet.",ri:"All athletes → CONTROLLED. Rhythm, not speed."},
{ref:"019",name:"Ball-Drop Reaction Drill",mins:5,notes:"Pair up. Tennis ball drops from shoulder height. Intercept with kizami-tsuki. Make it competitive — who gets the most catches in 15 drops?",ri:"Athlete → MATCH (react fully). Dropper → LIGHT (hold and release, no tells)."},
{ref:"—",name:"Dynamic stretching",mins:2,notes:"Hip circles, leg swings, arm rotations. Keep moving, no static holds.",ri:"All → LIGHT."}
